<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Дъска</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 10%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:480px;margin:0 auto;padding:18px 16px 32px}

  header{margin-bottom:14px}
  h1{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--color-muted);font-size:13px;margin-top:3px}

  .form{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);
        padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .form h2{font-family:var(--font-display);font-size:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  label{font-size:12px;color:var(--color-muted);font-weight:600}
  input,textarea,select{font:inherit;font-size:14px;padding:9px 10px;border-radius:var(--radius-sm);
        border:1px solid var(--color-line);background:var(--color-bg);color:var(--color-ink)}
  .dates{display:flex;gap:8px}
  .dates .field{flex:1}
  .btn{font:inherit;font-size:14px;font-weight:700;padding:11px 14px;border-radius:var(--radius-sm);
       border:1px solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);cursor:pointer;margin-top:4px}
  .btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  h2.section{font-family:var(--font-display);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
             margin:22px 0 10px}
  h2.section::before{content:"";width:10px;height:10px;border-radius:3px}
  h2.section.pending::before{background:var(--color-tertiary)}
  h2.section.approved::before{background:var(--status-ok)}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);
        padding:13px 14px;box-shadow:var(--shadow)}
  .card.flag-amber{border:1.5px dashed var(--status-warning);background:var(--tint-warning)}
  .card .dates2{font-family:var(--font-display);font-weight:700;font-size:14.5px}
  .card .reason{font-size:12.5px;color:var(--color-muted);margin-top:3px}
  .card .sent{font-size:11.5px;color:var(--color-muted);margin-top:6px}
  .cover{font-size:12px;background:var(--color-bg);border-radius:var(--radius-sm);padding:7px 9px;margin-top:8px}
  .cover b{color:var(--status-warning)}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:8px}
  .pill.ok{background:color-mix(in oklab, var(--status-ok) 12%, var(--color-surface));color:var(--status-ok)}
  .pill.pending{background:var(--color-primary-soft);color:var(--color-primary)}
  .empty{border:1.5px dashed var(--color-line);border-radius:var(--radius-md);padding:16px 12px;
         text-align:center;color:var(--color-muted);font-size:12.5px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Отпуска</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="form">
    <h2>Нова заявка</h2>
    <div class="dates">
      <div class="field"><label for="from">От</label><input id="from" type="date"></div>
      <div class="field"><label for="to">До</label><input id="to" type="date"></div>
    </div>
    <div class="field"><label for="reason">Причина (по избор)</label><textarea id="reason" rows="2"></textarea></div>
    <button class="btn">Изпрати заявка</button>
  </div>

  <div id="body"></div>
</div>

<script>
const D = window.PARTYFOX;
const byId = id => document.getElementById(id);
const mine = D.leaveRequests.filter(l=>l.animator===D.me);
byId("sub").textContent = "Заявки на " + (D.animators.find(a=>a.id===D.me)?.name || "");

const pending  = mine.filter(l=>l.state==="pending");
const approved = mine.filter(l=>l.state==="approved");
const declined = mine.filter(l=>l.state==="declined");

function when(l){ return l.hours ? `${l.from} · ${l.hours}` : (l.from===l.to ? l.from : `${l.from} – ${l.to}`); }

function card(l){
  const needsCover = l.cover && l.cover.length;
  const cls = ["card"]; if (needsCover) cls.push("flag-amber");
  const cover = needsCover ? l.cover.map(c=>`<div class="cover">Без покритие: <b>${c.booking}</b>, ${c.when}</div>`).join("") : "";
  const status = l.state==="pending" ? `<span class="pill pending">Чака одобрение</span>`
    : l.state==="approved" ? `<span class="pill ok">Одобрена</span>`
    : `<div class="cover">${l.ownerNote||"Отказана"}</div>`;
  return `<div class="${cls.join(' ')}" data-leave="${l.id}">
    <div class="dates2">${when(l)}${l.days?` · ${l.days} дни`:""}</div>
    ${l.reason ? `<div class="reason">${l.reason}</div>` : ""}
    <div class="sent">Подадена: ${l.sent}</div>
    ${cover}${status}
  </div>`;
}

let html = "";
if (pending.length) { html += `<h2 class="section pending">Чака одобрение</h2><div class="list">${pending.map(card).join("")}</div>`; }
if (approved.length) { html += `<h2 class="section approved">Одобрена</h2><div class="list">${approved.map(card).join("")}</div>`; }
if (declined.length) { html += `<h2 class="section">Отказана</h2><div class="list">${declined.map(card).join("")}</div>`; }
if (!mine.length) { html = `<div class="empty">Нямате заявки за отпуска.</div>`; }
byId("body").innerHTML = html;
</script>
</body>
</html>
