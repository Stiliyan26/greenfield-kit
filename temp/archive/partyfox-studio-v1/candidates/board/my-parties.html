<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Дъска</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 10%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:480px;margin:0 auto;padding:18px 16px 32px}

  header{margin-bottom:14px}
  h1{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--color-muted);font-size:13px;margin-top:3px}

  h2.section{font-family:var(--font-display);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
             margin:20px 0 10px}
  h2.section::before{content:"";width:10px;height:10px;border-radius:3px}
  h2.section.problem::before{background:var(--status-warning)}
  h2.section.upcoming::before{background:var(--color-primary)}

  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);
        padding:13px 14px;box-shadow:var(--shadow)}
  .card .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .card .time{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
  .card .date{font-size:12px;color:var(--color-muted)}
  .card .child{font-weight:650;font-size:15.5px;margin-top:6px}
  .card .pkg{font-size:12px;color:var(--color-muted)}
  .card .addr{font-size:13px;margin-top:8px;padding:8px 10px;background:var(--color-bg);border-radius:var(--radius-sm)}
  .card .addr-note{font-size:12px;color:var(--color-muted);margin-top:4px}
  .card .parent{font-size:12.5px;color:var(--color-muted);margin-top:8px}
  .card.missing{border:2px solid var(--status-danger);background:var(--tint-danger)}
  .card.flag-amber{border:1.5px dashed var(--status-warning);background:var(--tint-warning)}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:8px}
  .pill.red{background:var(--status-danger);color:var(--color-surface)}
  .pill.amber{background:var(--tint-warning);color:var(--status-warning);border:1px dashed var(--status-warning)}
  a.call{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700;
         color:var(--color-primary);text-decoration:none}
  a.call:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:4px}
  .empty{border:1.5px dashed var(--color-line);border-radius:var(--radius-md);padding:16px 12px;
         text-align:center;color:var(--color-muted);font-size:12.5px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Моите партита</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div id="body"></div>
</div>

<script>
const D = window.PARTYFOX;
const byId = id => document.getElementById(id);
byId("sub").textContent = D.day + " · следващи 10 дни";

const flagged = D.myParties.filter(p=>!p.deposit || p.inLeave);
const rest    = D.myParties.filter(p=>p.deposit && !p.inLeave);

function card(p){
  const cls = ["card"];
  const pills = [];
  if (!p.deposit) { cls.push("missing"); pills.push(`<span class="pill red">Депозит липсва</span>`); }
  if (p.inLeave)  { cls.push("flag-amber"); pills.push(`<span class="pill amber">Попада в чакащата ви отпуска</span>`); }
  return `<div class="${cls.join(' ')}" data-booking="${p.id}">
    <div class="top"><span class="time">${p.start}–${p.end}</span><span class="date">${p.date}</span></div>
    <div class="child">${p.child}, ${p.age} г. · ${p.package}</div>
    <div class="pkg">${p.guests} гости</div>
    <div class="addr">${p.address}${p.addressNote?`<div class="addr-note">${p.addressNote}</div>`:""}</div>
    <div class="parent">${p.parent}</div>
    <a class="call" href="tel:${p.phone.replace(/\s/g,'')}">${p.phone}</a>
    ${pills.join("")}
  </div>`;
}

let html = "";
html += `<h2 class="section problem">Изисква внимание</h2>`;
html += `<div class="list">${flagged.length ? flagged.map(card).join("") : `<div class="empty">Няма нищо спешно.</div>`}</div>`;
html += `<h2 class="section upcoming">Предстоящи партита</h2>`;
html += `<div class="list">${rest.length ? rest.map(card).join("") : `<div class="empty">Няма други партита.</div>`}</div>`;
byId("body").innerHTML = html;
</script>
</body>
</html>
