<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Дъска</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 10%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--color-muted);font-size:13px;margin-top:3px}
  .search{font:inherit;font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--color-line);
          background:var(--color-surface);color:var(--color-ink);min-width:220px}
  .search:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  h2.section{font-family:var(--font-display);font-size:14px;margin:22px 0 10px}

  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
  .col{display:flex;flex-direction:column;gap:10px;min-height:100px}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
            border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-line)}
  .col-head h3{font-family:var(--font-display);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .count{font-size:12px;font-weight:700;background:var(--color-bg);border-radius:999px;padding:2px 9px;color:var(--color-muted)}
  .col.problem .col-head{border:2px solid var(--color-ink)}
  .col.problem .count{background:var(--color-ink);color:var(--color-surface)}
  .col-head h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--color-line)}
  .col.problem .col-head h3::before{background:var(--status-warning)}
  .col.repeat .col-head h3::before{background:var(--color-primary)}
  .col.new .col-head h3::before{background:var(--color-tertiary)}

  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);
        padding:11px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
  .card.flag-amber{border:1.5px dashed var(--status-warning);background:var(--tint-warning)}
  .card .fam{font-weight:650;font-size:14.5px}
  .card .parent{font-size:12px;color:var(--color-muted)}
  .card .row{font-size:12px;display:flex;justify-content:space-between;gap:8px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
  .pill.amber{background:var(--tint-warning);color:var(--status-warning);border:1px dashed var(--status-warning)}
  .pill.info{background:var(--color-primary-soft);color:var(--color-primary)}
  .pill.tag{background:var(--color-bg);color:var(--color-muted);border:1px solid var(--color-line)}
  .empty{border:1.5px dashed var(--color-line);border-radius:var(--radius-md);padding:16px 12px;
         text-align:center;color:var(--color-muted);font-size:12.5px}

  table{width:100%;border-collapse:collapse;background:var(--color-surface);border:1px solid var(--color-line);
        border-radius:var(--radius-md);overflow:hidden}
  th,td{text-align:left;padding:9px 12px;font-size:12.5px;border-top:1px solid var(--color-line)}
  th{background:var(--color-bg);color:var(--color-muted);font-weight:700;font-size:11.5px;text-transform:uppercase;
     letter-spacing:.02em;border-top:none}
  tr:hover td{background:color-mix(in oklab, var(--color-primary) 5%, var(--color-surface))}
  td.muted{color:var(--color-muted)}
  a.link{color:var(--color-primary);font-weight:600;text-decoration:none}
  a.link:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  @media (max-width:900px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:640px){
    .shell{padding:14px}
    .board{grid-template-columns:minmax(0,1fr)}
    .col.problem{order:-1}
    table, thead, tbody, th, td, tr { display:block; }
    thead{display:none}
    tr{border-top:1px solid var(--color-line);padding:8px 0}
    td{border-top:none;padding:2px 4px}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><h1>Клиенти</h1><div class="sub" id="sub"></div></div>
    <input class="search" placeholder="Търси семейство, дете, телефон…" aria-label="Търси клиент">
  </header>

  <div class="board" id="board"></div>

  <h2 class="section">Всички клиенти</h2>
  <table id="table"></table>
</div>

<script>
const D = window.PARTYFOX;
const byId = id => document.getElementById(id);
byId("sub").textContent = D.customers.length + " семейства · сортирани по важност";

const needsBooking = D.birthdays.filter(b=>!b.booked);
const repeatLarge  = D.customers.filter(c=>c.tags.includes("repeat")||c.tags.includes("large"));
const newCust      = D.customers.filter(c=>c.tags.includes("new"));

function birthdayCard(b){
  return `<div class="card flag-amber" data-customer="${b.customer}">
    <div class="fam">${b.child}</div>
    <div class="parent">${D.customers.find(c=>c.id===b.customer)?.family||""}</div>
    <div class="row"><span>Рожден ден</span><span>${b.date} · навършва ${b.turns}</span></div>
    <div class="tags"><span class="pill amber">Все още не е записан</span></div>
  </div>`;
}
function custCard(c){
  const tags = c.tags.map(t=>`<span class="pill tag">${t==="repeat"?"Постоянен":t==="large"?"Голяма поръчка":"Нов"}</span>`).join("");
  const bday = c.children.map(k=>k.name+" "+k.birthday).join(" · ");
  return `<div class="card" data-customer="${c.id}">
    <div class="fam">${c.family}</div>
    <div class="parent">${c.parent}</div>
    <div class="row"><span>Деца</span><span>${bday}</span></div>
    <div class="row"><span>Партита</span><span>${c.history.length}</span></div>
    <div class="tags">${tags}</div>
  </div>`;
}

const cols = [
  {label:"Рожден ден без записване", cls:"problem", html: needsBooking.length ? needsBooking.map(birthdayCard).join("") : `<div class="empty">Празно.</div>`},
  {label:"Постоянни и големи",       cls:"repeat",  html: repeatLarge.length ? repeatLarge.map(custCard).join("") : `<div class="empty">Празно.</div>`},
  {label:"Нови клиенти",             cls:"new",     html: newCust.length ? newCust.map(custCard).join("") : `<div class="empty">Празно.</div>`},
];

byId("board").innerHTML = cols.map(c=>`
  <section class="col ${c.cls}">
    <div class="col-head"><h3>${c.label}</h3></div>
    ${c.html}
  </section>`).join("");

byId("table").innerHTML = `
  <thead><tr><th>Семейство</th><th>Родител</th><th>Телефон</th><th>Тагове</th><th>Деца / рождени дни</th><th>Партита</th><th>Отворена поръчка</th></tr></thead>
  <tbody>${D.customers.map(c=>`
    <tr data-customer="${c.id}">
      <td>${c.family}</td>
      <td>${c.parent}</td>
      <td class="muted">${c.phone}</td>
      <td>${c.tags.map(t=>`<span class="pill tag">${t==="repeat"?"Постоянен":t==="large"?"Голяма поръчка":"Нов"}</span>`).join(" ") || "—"}</td>
      <td class="muted">${c.children.map(k=>k.name+" · "+k.birthday).join(", ")}</td>
      <td class="muted">${c.history.length}</td>
      <td>${c.open ? `<a class="link" href="#" data-order="${c.open}">${c.open}</a>` : `<span class="muted">—</span>`}</td>
    </tr>`).join("")}</tbody>`;
</script>
</body>
</html>
