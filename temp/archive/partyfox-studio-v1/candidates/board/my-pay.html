<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Дъска</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 10%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:480px;margin:0 auto;padding:18px 16px 32px}

  header{margin-bottom:14px}
  h1{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--color-muted);font-size:13px;margin-top:3px}

  .summary{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);
        padding:16px;box-shadow:var(--shadow);text-align:center}
  .summary .amount{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--color-muted)}
  .summary .note{font-size:12.5px;color:var(--color-muted);margin-top:6px}
  .summary .check{font-size:11.5px;color:var(--color-muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--color-line)}

  h2.section{font-family:var(--font-display);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
             margin:20px 0 10px}
  h2.section::before{content:"";width:10px;height:10px;border-radius:3px}
  h2.section.today::before{background:var(--status-warning)}
  h2.section.upcoming::before{background:var(--color-primary)}
  h2.section.done::before{background:var(--status-ok)}

  .list{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);
        padding:11px 13px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card.flag-amber{border:1.5px dashed var(--status-warning);background:var(--tint-warning)}
  .card .who{font-weight:650;font-size:14px}
  .card .meta{font-size:12px;color:var(--color-muted)}
  .card .hrs{font-size:12.5px;color:var(--color-muted);white-space:nowrap}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:4px}
  .pill.red{background:var(--status-danger);color:var(--color-surface)}
  .empty{border:1.5px dashed var(--color-line);border-radius:var(--radius-md);padding:16px 12px;
         text-align:center;color:var(--color-muted);font-size:12.5px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Моето заплащане</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="summary">
    <div class="amount" id="amount"></div>
    <div class="note" id="note"></div>
    <div class="check" id="check"></div>
  </div>

  <div id="body"></div>
</div>

<script>
const D = window.PARTYFOX;
const P = D.myPay;
const byId = id => document.getElementById(id);

byId("sub").textContent = P.month;
byId("amount").textContent = "Не е зададено";
byId("note").textContent = P.unsetNote;
byId("check").textContent = P.check;

const today = P.parties.filter(p=>p.state==="today");
const upcoming = P.parties.filter(p=>p.state==="upcoming");
const done = P.parties.filter(p=>p.state==="done");

function card(p){
  const cls = ["card"];
  const pill = p.depositMissing ? `<span class="pill red">Депозит липсва</span>` : "";
  if (p.depositMissing) cls.push("flag-amber");
  return `<div class="${cls.join(' ')}" data-booking-date="${p.date}">
    <div><div class="who">${p.child}</div><div class="meta">${p.package} · ${p.date}</div>${pill}</div>
    <div class="hrs">${p.hours} ч.</div>
  </div>`;
}

let html = "";
if (today.length) html += `<h2 class="section today">Днес</h2><div class="list">${today.map(card).join("")}</div>`;
if (upcoming.length) html += `<h2 class="section upcoming">Предстои</h2><div class="list">${upcoming.map(card).join("")}</div>`;
html += `<h2 class="section done">Обработени</h2><div class="list">${done.length ? done.map(card).join("") : `<div class="empty">Няма.</div>`}</div>`;
byId("body").innerHTML = html;
</script>
</body>
</html>
