<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Ростър · Заплащане</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Roster for pay: the month runs across as one strip of days, with a subtotal under each week. */
  :root{
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 10%, var(--color-surface));
    --tint-booking:var(--color-primary-soft);
    --edge-booking:color-mix(in oklab, var(--color-primary) 35%, var(--color-surface));
    --weekend:color-mix(in oklab, var(--color-surface-2) 70%, var(--color-surface));
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  header{margin-bottom:14px}
  .eyebrow{font-size:12px;color:var(--color-muted);font-weight:600}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:13px;margin-top:2px}

  .btn{font:inherit;font-size:14px;font-weight:600;border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);white-space:nowrap;min-height:44px}
  .btn:hover{background:var(--color-surface-2)}

  /* Totals */
  .totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .tile{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .tile .k{font-size:12px;font-weight:600;color:var(--color-muted)}
  .tile .v{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
  .tile .v small{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--color-muted);margin-left:4px}
  .tile .s{font-size:12.5px;color:var(--color-muted)}
  .tile.unset{background:var(--color-surface-2);border-style:dashed}
  .tile.unset .v{font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--color-muted);padding:5px 0 3px}
  .unset-note{margin-top:10px;font-size:13px;color:var(--color-muted)}
  .unset-note b{color:var(--color-ink);font-weight:600}

  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden;margin-top:16px}
  .card > h2{font-size:12px;font-weight:700;color:var(--color-muted);padding:10px 14px;background:var(--color-surface-2);border-bottom:1px solid var(--color-line);display:flex;justify-content:space-between;gap:10px}
  .card > h2 span{font-weight:600}

  /* Month strip (wide screens) */
  .strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));grid-template-rows:auto 58px auto}
  .strip .h{grid-row:1;text-align:center;padding:5px 0 4px;font-size:11px;color:var(--color-muted);line-height:1.15;font-variant-numeric:tabular-nums;
            border-left:1px solid color-mix(in oklab, var(--color-line) 60%, transparent);border-bottom:1px solid var(--color-line)}
  .strip .h b{display:block;font-size:12.5px;color:var(--color-ink)}
  .strip .h.we{background:var(--weekend)}
  .strip .h.today b{color:var(--color-primary)}
  .strip .bg{grid-row:2;border-left:1px solid color-mix(in oklab, var(--color-line) 60%, transparent)}
  .strip .bg.we{background:var(--weekend)}
  .strip .bg.today{box-shadow:inset 2px 0 0 var(--color-primary)}
  .blk{grid-row:2;margin:6px 2px;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-size:11.5px;font-weight:700;line-height:1.15;z-index:1;font-variant-numeric:tabular-nums;text-align:center}
  .blk small{font-size:11px;font-weight:500}
  .blk.done{background:var(--tint-booking);border:1px solid var(--edge-booking);color:var(--color-secondary)}
  .blk.today{background:var(--color-surface);border:2px solid var(--color-primary);color:var(--color-primary)}
  .blk.dep{background:var(--tint-danger);border:2px solid var(--status-danger);color:var(--status-danger)}
  .blk.upcoming{background:var(--color-surface);border:1.5px dashed var(--edge-booking);color:var(--color-muted)}
  .wk{grid-row:3;border-top:1px solid var(--color-line);border-left:1px solid var(--color-line);padding:6px 8px;font-size:12px;color:var(--color-muted);
      display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;background:var(--color-surface)}
  .wk:first-of-type{border-left:0}
  .wk b{color:var(--color-ink);font-weight:650}

  /* Calendar (phones): weeks as rows, subtotal at the end of each row */
  .cal{display:none}
  .cal .row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 50px;border-bottom:1px solid var(--color-line)}
  .cal .row:last-child{border-bottom:0}
  .cal .row.head span{font-size:11px;color:var(--color-muted);font-weight:600;text-align:center;padding:5px 0}
  .cal .c{min-height:54px;padding:3px 2px;border-left:1px solid color-mix(in oklab, var(--color-line) 60%, transparent);display:flex;flex-direction:column;gap:2px;align-items:stretch}
  .cal .c:first-child{border-left:0}
  .cal .c.we{background:var(--weekend)}
  .cal .c .n{font-size:12px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
  .cal .c.today .n{color:var(--color-primary);font-weight:700}
  .cal .c.out .n{visibility:hidden}
  .cal .blk{margin:0;padding:2px 0;flex:1}
  .cal .sum{border-left:1px solid var(--color-line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--color-muted);background:var(--color-surface-2);text-align:center;line-height:1.2}
  .cal .sum b{font-family:var(--font-display);font-size:14px;color:var(--color-ink)}

  /* Party list */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;color:var(--color-muted);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--color-line)}
  td{padding:10px 14px;border-bottom:1px solid var(--color-line);vertical-align:middle;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  td.num{text-align:right}
  th.num{text-align:right}
  .pkg{color:var(--color-muted);font-size:13px}
  .st{font-size:12px;font-weight:600;border-radius:var(--radius-sm);padding:3px 8px;white-space:nowrap;display:inline-block}
  .st.done{background:var(--tint-ok);color:var(--status-ok)}
  .st.today{background:var(--color-primary-soft);color:var(--color-primary)}
  .st.upcoming{background:var(--color-surface-2);color:var(--color-muted)}
  .dep-chip{font-size:11.5px;font-weight:700;background:var(--status-danger);color:var(--color-surface);border-radius:var(--radius-sm);padding:2px 7px;white-space:nowrap;display:inline-block;margin-left:6px}
  .unset-v{color:var(--color-muted);font-style:italic;font-size:13px}
  tfoot td{background:var(--color-surface-2);font-weight:650;border-top:1px solid var(--color-line)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--color-muted)}

  @media (max-width:900px){
    .totals{grid-template-columns:repeat(2,minmax(0,1fr))}
    .strip .h b{font-size:11.5px}
    .strip .h span{display:none}
    .blk small{display:none}
  }
  @media (max-width:640px){
    .shell{padding:14px 12px}
    h1{font-size:20px}
    .totals{gap:8px}
    .tile{padding:10px 12px}
    .tile .v{font-size:22px}
    .strip{display:none}
    .cal{display:block}
    thead{display:none}
    table,tbody,tfoot,tr,td{display:block}
    tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"date who st" "date hrs amt";column-gap:12px;row-gap:2px;padding:10px 12px;border-bottom:1px solid var(--color-line)}
    tbody tr:last-child{border-bottom:0}
    td{padding:0;border:0}
    td.d{grid-area:date;font-family:var(--font-body);font-weight:700;font-size:13.5px;width:64px;white-space:nowrap;align-self:center}
    td.who{grid-area:who}
    td.hrs{grid-area:hrs;color:var(--color-muted);font-size:13px;text-align:left}
    td.stc{grid-area:st;text-align:right}
    td.amt{grid-area:amt;text-align:right}
    tfoot tr{background:var(--color-surface-2);border-top:1px solid var(--color-line);border-bottom:0}
    tfoot td{border:0}
    .foot .btn{width:100%}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow" id="me"></div>
    <h1>Моето заплащане</h1>
    <div class="day" id="month"></div>
  </header>

  <section class="totals" id="totals" aria-label="Обобщение"></section>
  <p class="unset-note" id="unset"></p>

  <section class="card" aria-label="Месецът по дни">
    <h2>Месецът по дни <span>седмиците започват в понеделник</span></h2>
    <div class="strip" id="strip"></div>
    <div class="cal" id="cal"></div>
  </section>

  <section class="card" aria-label="Партита този месец">
    <h2>Партита <span id="pcount"></span></h2>
    <table id="list"></table>
  </section>

  <div class="foot"><span id="check"></span><button class="btn">Нещо не е вярно? Пиши на собственика</button></div>
</div>

<script>
const D = window.PARTYFOX;
const P = D.myPay;
const me = D.animators.find(a => a.id === D.me);
const DAYS = 30;                           // September; the 1st is a Monday
const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "нд"];
const TODAY = 27;
const rows = P.parties.map(p => ({ ...p, d: +p.date.match(/\d+/)[0] }));
const done = rows.filter(p => p.state === "done");
const hoursDone = done.reduce((s, p) => s + p.hours, 0);
const hoursAll = rows.reduce((s, p) => s + p.hours, 0);
const unset = v => v === null ? "не е зададено" : v;

document.getElementById("me").textContent = `${me.name} · ${me.role}`;
document.getElementById("month").textContent = `${P.month[0].toUpperCase()}${P.month.slice(1)} · към ${D.day.toLowerCase()}`;
document.getElementById("totals").innerHTML = `
  <div class="tile" data-total="parties"><span class="k">Проведени партита</span><span class="v">${done.length}<small>от ${rows.length}</small></span><span class="s">1 днес, ${rows.filter(p => p.state === "upcoming").length} предстои</span></div>
  <div class="tile" data-total="hours"><span class="k">Отработени часове</span><span class="v">${hoursDone}<small>ч</small></span><span class="s">${hoursAll} ч с днес и предстоящото</span></div>
  <div class="tile unset" data-total="amount"><span class="k">Сума за месеца</span><span class="v">${unset(P.amount)}</span><span class="s">зависи от дела на аниматора</span></div>
  <div class="tile unset" data-total="bonus"><span class="k">Бонуси</span><span class="v">${unset(P.bonus)}</span><span class="s">формулата не е уточнена</span></div>`;
document.getElementById("unset").innerHTML = `<b>Защо няма суми?</b> ${P.unsetNote}`;

const cls = p => p.state === "today" ? (p.depositMissing ? "dep" : "today") : p.state;
const wdOf = d => (d - 1) % 7;               // 0 = Monday
// Wide strip: 30 days across, week subtotals below.
let strip = Array.from({ length: DAYS }, (_, i) => {
  const d = i + 1, we = wdOf(d) >= 5;
  return `<div class="h${we ? " we" : ""}${d === TODAY ? " today" : ""}" style="grid-column:${d}"><span>${WD[wdOf(d)]}</span><b>${d}</b></div>
          <i class="bg${we ? " we" : ""}${d === TODAY ? " today" : ""}" style="grid-column:${d}"></i>`;
}).join("");
strip += rows.map(p => `<div class="blk ${cls(p)}" data-pay="${p.d}" style="grid-column:${p.d}" title="${p.date} · ${p.child} · ${p.package} · ${p.hours} ч">${p.hours} ч</div>`).join("");
const weeks = [];
for (let s = 1; s <= DAYS; s += 7) weeks.push([s, Math.min(s + 6, DAYS)]);
strip += weeks.map(([a, b]) => {
  const ps = rows.filter(p => p.d >= a && p.d <= b);
  const h = ps.reduce((s, p) => s + p.hours, 0);
  return `<div class="wk" data-week="${a}" style="grid-column:${a} / ${b + 1}"><span>${a}–${b}${b - a > 2 ? " септ." : ""}</span>${ps.length ? `<span><b>${ps.length}</b> парти${ps.length === 1 ? "" : "та"} · <b>${h}</b> ч</span>` : ""}</div>`;
}).join("");
document.getElementById("strip").innerHTML = strip;

// Phone calendar: weeks as rows, hours total at the end.
let cal = `<div class="row head" aria-hidden="true">${WD.map(w => `<span>${w}</span>`).join("")}<span>общо</span></div>`;
for (const [a] of weeks) {
  cal += `<div class="row" data-week="${a}">`;
  for (let i = 0; i < 7; i++) {
    const d = a + i, inMonth = d <= DAYS;
    const p = rows.find(x => x.d === d);
    cal += `<div class="c${i >= 5 ? " we" : ""}${d === TODAY ? " today" : ""}${inMonth ? "" : " out"}"><span class="n">${inMonth ? d : ""}</span>${p ? `<span class="blk ${cls(p)}" data-pay="${p.d}">${p.hours}ч</span>` : ""}</div>`;
  }
  const ps = rows.filter(p => p.d >= a && p.d <= a + 6);
  cal += `<div class="sum"><b>${ps.reduce((s, p) => s + p.hours, 0)}</b>ч</div></div>`;
}
document.getElementById("cal").innerHTML = cal;

const ST = { done: "Проведено", today: "Днес", upcoming: "Предстои" };
document.getElementById("pcount").textContent = `${rows.length} в ${P.month}`;
document.getElementById("list").innerHTML = `
  <thead><tr><th>Дата</th><th>Парти</th><th class="num">Часове</th><th>Състояние</th><th class="num">Сума</th></tr></thead>
  <tbody>${rows.map(p => `<tr data-pay="${p.d}">
    <td class="d">${p.date}</td>
    <td class="who"><b>${p.child}</b> <span class="pkg">· ${p.package}</span>${p.depositMissing ? `<span class="dep-chip">Депозит липсва</span>` : ""}</td>
    <td class="hrs num">${p.hours} ч</td>
    <td class="stc"><span class="st ${p.state}">${ST[p.state]}</span></td>
    <td class="amt num"><span class="unset-v">не е зададено</span></td></tr>`).join("")}</tbody>
  <tfoot><tr><td class="d">Общо</td><td class="who">${done.length} проведени</td><td class="hrs num">${hoursDone} ч</td><td class="stc"></td><td class="amt num"><span class="unset-v">не е зададено</span></td></tr></tfoot>`;
document.getElementById("check").textContent = P.check;
</script>
</body>
</html>
