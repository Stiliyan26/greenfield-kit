<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Ростър · Отпуск</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Roster for one animator: weeks are rows, days run across, her parties and leave sit in the cells. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 10%, var(--color-surface));
    --tint-booking:var(--color-primary-soft);
    --edge-booking:color-mix(in oklab, var(--color-primary) 35%, var(--color-surface));
    --weekend:color-mix(in oklab, var(--color-surface-2) 70%, var(--color-surface));
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  header{margin-bottom:14px}
  .eyebrow{font-size:12px;color:var(--color-muted);font-weight:600}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:13px;margin-top:2px}

  .btn{font:inherit;font-size:14px;font-weight:600;border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);white-space:nowrap;min-height:44px}
  .btn:hover{background:var(--color-surface-2)}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:transparent}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden}
  .card > h2{font-size:12px;font-weight:700;color:var(--color-muted);padding:10px 14px;background:var(--color-surface-2);border-bottom:1px solid var(--color-line);display:flex;justify-content:space-between;gap:10px}
  .card > h2 span{font-weight:600}

  /* Calendar */
  .wds,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .wds span{font-size:11.5px;font-weight:600;color:var(--color-muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--color-line)}
  .wds span:nth-child(n+6){color:var(--color-secondary)}
  .week{border-bottom:1px solid var(--color-line)}
  .week:last-child{border-bottom:0}
  .cell{font:inherit;color:inherit;text-align:left;border:0;border-left:1px solid color-mix(in oklab, var(--color-line) 60%, transparent);
        background:var(--color-surface);min-height:88px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;min-width:0}
  .cell:first-child{border-left:0}
  .cell.we{background:var(--weekend)}
  .cell:hover{background:color-mix(in oklab, var(--color-primary-soft) 50%, var(--color-surface))}
  .cell.past{cursor:default;color:var(--color-muted)}
  .cell.past .n{opacity:.6}
  .cell.past:hover{background:var(--color-surface)}
  .cell.past.we:hover{background:var(--weekend)}
  .cell .n{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.1}
  .cell .n small{font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--color-muted);margin-left:3px}
  .cell.today .n{color:var(--color-primary)}
  .cell.today{box-shadow:inset 0 3px 0 var(--color-primary)}
  .pc{font-size:11.5px;font-weight:700;border-radius:var(--radius-sm);padding:2px 5px;background:var(--tint-booking);border:1px solid var(--edge-booking);
      font-variant-numeric:tabular-nums;line-height:1.25}
  .pc .nm{display:block;font-weight:500;overflow-wrap:anywhere}
  .pc.cover{background:var(--tint-warning);border:1.5px solid var(--status-warning);color:var(--status-warning)}
  .lv{font-size:11px;font-weight:600;border-radius:var(--radius-sm);padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv.approved{background:repeating-linear-gradient(135deg,var(--color-bg) 0 6px,var(--color-surface) 6px 12px);border:1px solid var(--color-line);color:var(--color-muted)}
  .cell.pend{background:var(--color-primary-soft);box-shadow:inset 0 1.5px 0 var(--color-primary),inset 0 -1.5px 0 var(--color-primary)}
  .cell.pend .lv{color:var(--color-primary);padding:0}
  .cell.sel{background:color-mix(in oklab, var(--color-secondary) 16%, var(--color-surface));box-shadow:inset 0 0 0 2px var(--color-secondary)}

  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--color-muted);border-top:1px solid var(--color-line)}
  .legend span{display:flex;align-items:center;gap:6px}
  .lg{width:14px;height:14px;border-radius:var(--radius-sm);display:inline-block}
  .lg-p{background:var(--tint-booking);border:1px solid var(--edge-booking)}
  .lg-pend{background:var(--color-primary-soft);border:1.5px solid var(--color-primary)}
  .lg-ok{background:repeating-linear-gradient(135deg,var(--color-line) 0 3px,var(--color-surface) 3px 6px);border:1px solid var(--color-line)}
  .lg-sel{background:color-mix(in oklab, var(--color-secondary) 16%, var(--color-surface));border:2px solid var(--color-secondary)}
  .lg-cover{background:var(--tint-warning);border:1.5px solid var(--status-warning)}

  /* Form */
  form{padding:14px;display:flex;flex-direction:column;gap:12px}
  .range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field > span{font-size:12px;font-weight:600;color:var(--color-muted)}
  .val{border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:10px 11px;font-size:14px;min-height:44px;background:var(--color-surface);font-weight:600}
  .val.empty{color:var(--color-muted);font-weight:400}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--color-line);border-radius:var(--radius-sm);overflow:hidden}
  .seg label{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:14px;cursor:pointer;min-height:44px}
  .seg label + label{border-left:1px solid var(--color-line)}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--color-secondary);color:var(--color-on-secondary);font-weight:600}
  .seg label:has(input:focus-visible){outline:2px solid var(--color-primary);outline-offset:-2px}
  .hours{display:none;grid-template-columns:1fr 1fr;gap:8px}
  .hours.on{display:grid}
  input[type=time],textarea{font:inherit;font-size:14px;border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:10px 11px;background:var(--color-surface);color:var(--color-ink);min-height:44px;width:100%}
  textarea{min-height:70px;resize:vertical}
  .hint{font-size:13px;color:var(--color-muted)}
  .conflict{border:1.5px solid var(--status-warning);background:var(--tint-warning);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;display:none}
  .conflict.on{display:block}
  .conflict b{color:var(--status-warning);display:block}

  /* My requests */
  .mine{list-style:none;padding:0}
  .mine li{padding:12px 14px;border-bottom:1px solid var(--color-line);display:flex;flex-direction:column;gap:6px}
  .mine li:last-child{border-bottom:0}
  .mine .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .mine .d{font-family:var(--font-body);font-weight:700;font-size:15px;line-height:1.25}
  .mine .s{font-size:13px;color:var(--color-muted)}
  .st{font-size:12px;font-weight:600;border-radius:var(--radius-sm);padding:3px 9px;white-space:nowrap}
  .st.pending{background:var(--color-primary-soft);color:var(--color-primary)}
  .st.approved{background:var(--tint-ok);color:var(--status-ok)}
  .needs{border:1.5px solid var(--status-warning);background:var(--tint-warning);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px}
  .needs b{color:var(--status-warning);display:block}
  .side{display:flex;flex-direction:column;gap:16px}

  @media (max-width:980px){
    .layout{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .shell{padding:14px 12px}
    h1{font-size:20px}
    .cell{min-height:70px;padding:4px 3px 6px;gap:3px}
    .cell .n{font-size:14px}
    .cell .n small{display:none}
    .pc{padding:1px 2px;text-align:center;font-size:11px}
    .pc .nm{display:none}
    .lv{padding:0 2px;text-align:center}
    .lv .long{display:none}
  }
  @media (min-width:561px){ .lv .short{display:none} }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow" id="me"></div>
    <h1>Отпуск</h1>
    <div class="day">Избери дни в календара. Собственикът одобрява или отказва молбата.</div>
  </header>

  <div class="layout">
    <section class="card" aria-label="Календар">
      <h2>Септември – октомври <span id="today"></span></h2>
      <div class="wds" aria-hidden="true"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>нд</span></div>
      <div id="cal"></div>
      <div class="legend">
        <span><i class="lg lg-p"></i> Мое парти</span>
        <span><i class="lg lg-pend"></i> Отпуск, чака решение</span>
        <span><i class="lg lg-ok"></i> Одобрен отпуск</span>
        <span><i class="lg lg-cover"></i> Парти, което трябва да се покрие</span>
        <span><i class="lg lg-sel"></i> Избрано сега</span>
      </div>
    </section>

    <div class="side">
      <section class="card" aria-label="Нова молба">
        <h2>Нова молба</h2>
        <form id="form" onsubmit="return false">
          <div class="range">
            <div class="field"><span>От</span><div class="val empty" id="from">Избери ден</div></div>
            <div class="field"><span>До</span><div class="val empty" id="to">—</div></div>
          </div>
          <div class="seg" role="radiogroup" aria-label="Вид отпуск">
            <label><input type="radio" name="kind" value="days" checked> Цели дни</label>
            <label><input type="radio" name="kind" value="hours"> Няколко часа</label>
          </div>
          <div class="hours" id="hours">
            <label class="field"><span>От час</span><input type="time" value="12:00"></label>
            <label class="field"><span>До час</span><input type="time" value="15:00"></label>
          </div>
          <label class="field"><span>Причина (по желание)</span><textarea placeholder="Напр. семейно пътуване"></textarea></label>
          <div class="conflict" id="conflict"></div>
          <button class="btn primary" id="send" disabled>Изпрати на собственика</button>
          <p class="hint" id="hint">Натисни първия и последния ден от отпуска.</p>
        </form>
      </section>

      <section class="card" aria-label="Моите молби">
        <h2>Моите молби <span id="count"></span></h2>
        <ul class="mine" id="mine"></ul>
      </section>
    </div>
  </div>
</div>

<script>
const D = window.PARTYFOX;
const me = D.animators.find(a => a.id === D.me);
const off = text => { const m = text.match(/(\d+)\s+(септ|окт)/); return m[2] === "септ" ? +m[1] - 27 : +m[1] + 3; };
const num = o => o <= 3 ? 27 + o : o - 3;               // offset from 27 Sept to day of month
const label = o => `${num(o)} ${o <= 3 ? "септ." : "окт."}`;
const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "нд"];
const FIRST = -5, WEEKS = 5;                          // Mon 22 Sept … Sun 26 Oct
const parties = D.myParties.map(p => ({ ...p, o: off(p.date) }));
const leave = D.leaveRequests.filter(l => l.animator === me.id);
const pendDays = new Set();
leave.filter(l => l.state === "pending").forEach(l => { for (let o = off(l.from); o <= off(l.to); o++) pendDays.add(o); });

document.getElementById("me").textContent = `${me.name} · ${me.role}`;
document.getElementById("today").textContent = `днес е ${D.day.toLowerCase()}`;

let sel = { a: null, b: null };
function renderCal() {
  let html = "";
  for (let w = 0; w < WEEKS; w++) {
    html += `<div class="week">`;
    for (let d = 0; d < 7; d++) {
      const o = FIRST + w * 7 + d;
      const inSel = sel.a !== null && o >= sel.a && o <= (sel.b ?? sel.a);
      const cls = [d >= 5 && "we", o < 0 && "past", o === 0 && "today", pendDays.has(o) && "pend", inSel && "sel"].filter(Boolean).join(" ");
      const ps = parties.filter(p => p.o === o);
      const lvHours = leave.find(l => l.hours && off(l.from) === o);
      const pend = leave.find(l => l.state === "pending" && o >= off(l.from) && o <= off(l.to));
      html += `<button class="cell ${cls}" data-day="${o}" ${o < 0 ? 'tabindex="-1" aria-disabled="true"' : ""} aria-label="${WD[d]} ${label(o)}${ps.length ? ", парти в " + ps[0].start : ""}">
        <span class="n">${num(o)}${num(o) === 1 || o === FIRST ? `<small>${o <= 3 ? "септ." : "окт."}</small>` : ""}</span>
        ${pend && off(pend.from) === o ? `<span class="lv" data-leave="${pend.id}"><span class="long">отпуск · чака</span><span class="short">чака</span></span>` : ""}
        ${lvHours ? `<span class="lv approved" data-leave="${lvHours.id}" title="Одобрен отпуск ${lvHours.hours}"><span class="long">отпуск ${lvHours.hours.replace(/:00/g, "")}</span><span class="short">${lvHours.hours.replace(/:00/g, "")}</span></span>` : ""}
        ${ps.map(p => `<span class="pc${p.inLeave ? " cover" : ""}" data-booking="${p.id}" title="${p.start} ${p.child}">${p.start}<span class="nm">${p.child}</span></span>`).join("")}
      </button>`;
    }
    html += `</div>`;
  }
  document.getElementById("cal").innerHTML = html;
  document.querySelectorAll(".cell:not(.past)").forEach(c => c.addEventListener("click", () => pick(+c.dataset.day)));
}

function pick(o) {
  if (sel.a === null || sel.b !== null || o < sel.a) sel = { a: o, b: null };
  else sel.b = o;
  renderCal(); renderForm();
  const again = document.querySelector(`.cell[data-day="${o}"]`); if (again) again.focus();
}

function renderForm() {
  const from = document.getElementById("from"), to = document.getElementById("to");
  const end = sel.b ?? sel.a;
  from.textContent = sel.a === null ? "Избери ден" : label(sel.a);
  to.textContent = sel.a === null ? "—" : label(end);
  from.classList.toggle("empty", sel.a === null); to.classList.toggle("empty", sel.a === null);
  document.getElementById("send").disabled = sel.a === null;
  document.getElementById("hint").textContent = sel.a === null ? "Натисни първия и последния ден от отпуска."
    : sel.b === null ? "Натисни последния ден или изпрати за един ден." : `${end - sel.a + 1} дни`;
  const hit = sel.a === null ? [] : parties.filter(p => p.o >= sel.a && p.o <= end);
  const overlap = sel.a === null ? null : leave.find(l => l.state === "pending" && off(l.from) <= end && off(l.to) >= sel.a);
  const box = document.getElementById("conflict");
  box.classList.toggle("on", !!(hit.length || overlap));
  box.innerHTML = (hit.length ? `<b>В тези дни имаш ${hit.length === 1 ? "1 парти" : hit.length + " партита"}</b>${hit.map(p => `${p.date}, ${p.start} · ${p.child}`).join("<br>")}<br>Собственикът ще трябва да намери заместник.` : "") +
    (overlap ? `${hit.length ? "<br>" : ""}<b>Вече си поискала отпуск ${overlap.from} – ${overlap.to}</b>Молбата чака решение.` : "");
}
document.querySelectorAll('input[name="kind"]').forEach(r => r.addEventListener("change", () =>
  document.getElementById("hours").classList.toggle("on", document.querySelector('input[name="kind"]:checked').value === "hours")));

const LABEL = { pending: "Чака решение", approved: "Одобрен", declined: "Отказан" };
document.getElementById("count").textContent = `${leave.length}`;
document.getElementById("mine").innerHTML = leave.map(l => {
  const when = l.hours ? `${l.from} · ${l.hours}` : `${l.from} – ${l.to}`;
  return `<li data-leave="${l.id}">
    <div class="top"><span class="d">${when}</span><span class="st ${l.state}">${LABEL[l.state]}</span></div>
    <span class="s">${l.reason || "без причина"} · изпратена ${l.sent}${l.days ? ` · ${l.days} дни` : ""}</span>
    ${(l.cover || []).map(c => `<div class="needs"><b>Трябва заместник за 1 парти</b>${c.booking} · ${c.when}. Собственикът ще реши.</div>`).join("")}
    ${l.state === "declined" && l.ownerNote ? `<div class="s">Бележка от собственика: ${l.ownerNote}</div>` : ""}
  </li>`;
}).join("");

renderCal(); renderForm();
</script>
</body>
</html>
