<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Ростър · Поръчки</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Roster: orders are rows, the requested weekend days run across. Every color, font and radius comes from the studio world. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 10%, var(--color-surface));
    --tint-booking:var(--color-primary-soft);
    --edge-booking:color-mix(in oklab, var(--color-primary) 35%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 12%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .eyebrow{font-size:12px;color:var(--color-muted);font-weight:600}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:13px;margin-top:2px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--color-surface);border:1px solid var(--color-line);border-radius:999px;
        padding:7px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .chip b{font-family:var(--font-display);font-size:16px;line-height:1}
  .chip.total{background:var(--color-secondary-soft);border-color:transparent;color:var(--color-secondary)}
  .chip.warn{border-color:var(--status-warning);background:var(--tint-warning);color:var(--status-warning)}

  .btn{font:inherit;font-size:13px;font-weight:600;border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);white-space:nowrap}
  .btn:hover{background:var(--color-surface-2)}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:transparent}
  .btn.primary:hover{background:color-mix(in oklab, var(--color-primary) 88%, var(--color-ink))}
  .btn.warn{border-color:var(--status-warning);color:var(--status-warning);background:var(--color-surface)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}

  /* The roster */
  .grid{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden}
  .ruler,.row{display:grid;grid-template-columns:minmax(0,1fr) 380px 150px}
  .ruler{background:var(--color-surface-2);border-bottom:1px solid var(--color-line);font-size:12px;color:var(--color-muted);font-weight:600}
  .ruler > div{padding:8px 14px}
  .ruler .dates{padding:0;display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--color-line);border-right:1px solid var(--color-line)}
  .ruler .dates span{padding:6px 8px;text-align:center;line-height:1.25}
  .ruler .dates span:nth-child(2){border-right:2px solid var(--color-line)}
  .ruler .dates small{display:block;font-size:11px;font-weight:500}
  .wk{display:block;font-size:11px;font-weight:600;color:var(--color-muted)}

  .row{border-bottom:1px solid var(--color-line);cursor:pointer;position:relative;background:var(--color-surface);
       text-align:left;width:100%;font:inherit;color:inherit;border-left:0;border-right:0;border-top:0;padding:0}
  .row:last-child{border-bottom:0}
  .row:hover{background:color-mix(in oklab, var(--color-surface-2) 55%, var(--color-surface))}
  .row[aria-current="true"]{background:var(--color-surface-2);box-shadow:inset 3px 0 0 var(--color-primary)}
  .row:focus-visible{outline-offset:-2px}
  .info{padding:11px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .meta{font-size:12px;color:var(--color-muted);font-variant-numeric:tabular-nums}
  .who{font-weight:650;font-size:14px}
  .parent{font-size:12.5px;color:var(--color-muted)}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
  .tag{font-size:11px;font-weight:600;border-radius:var(--radius-sm);padding:2px 7px;background:var(--color-surface-2);color:var(--color-muted)}
  .tag.large{background:var(--color-tertiary-soft);color:var(--color-secondary)}
  .tag.repeat{background:var(--color-secondary-soft);color:var(--color-secondary)}

  .lanes{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--color-line);border-right:1px solid var(--color-line);position:relative}
  .lanes > span{position:relative;display:flex;align-items:center;justify-content:center;padding:8px 6px;min-height:100%}
  .lanes > span:nth-child(2){border-right:2px solid var(--color-line)}
  .lanes > span + span{border-left:1px solid var(--color-line)}
  .lanes > span:nth-child(3){border-left:0}
  .lanes .lbl{display:none}
  .slot{border-radius:var(--radius-sm);padding:5px 8px;background:var(--tint-booking);border:1px solid var(--edge-booking);
        font-size:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:74px}
  .slot .t{font-weight:700;font-variant-numeric:tabular-nums}
  .slot .g{color:var(--color-muted);font-size:11.5px}
  .slot.warn{background:var(--tint-warning);border:1.5px solid var(--status-warning)}
  .slot.ok{background:var(--tint-ok);border-color:color-mix(in oklab, var(--status-ok) 40%, var(--color-surface))}

  .state{padding:11px 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px}
  .st{font-size:12px;font-weight:600;border-radius:var(--radius-sm);padding:4px 9px;border:1px solid currentColor;line-height:1.3}
  .st.new{color:var(--color-primary);background:var(--color-primary-soft);border-color:transparent}
  .st.warn{color:var(--status-warning);background:var(--tint-warning)}
  .st.ok{color:var(--status-ok);background:var(--tint-ok);border-color:transparent}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--color-muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .lg{width:14px;height:14px;border-radius:var(--radius-sm);display:inline-block}
  .lg-new{background:var(--tint-booking);border:1px solid var(--edge-booking)}
  .lg-warn{background:var(--tint-warning);border:1.5px solid var(--status-warning)}
  .lg-ok{background:var(--tint-ok);border:1px solid var(--status-ok)}

  /* Detail panel */
  .panel{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);position:sticky;top:12px}
  .panel .hd{padding:14px 16px 12px;border-bottom:1px solid var(--color-line)}
  .panel h2{font-family:var(--font-body);font-size:18px;font-weight:700;line-height:1.2;margin-top:3px}
  .panel .when{font-family:var(--font-body);font-size:15px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
  .alert{margin:12px 16px 0;padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--status-warning);
         background:var(--tint-warning);color:var(--color-ink)}
  .alert b{color:var(--status-warning);display:block;margin-bottom:2px}
  .alert.info{border-color:var(--color-line);background:var(--color-surface-2)}
  .alert.info b{color:var(--color-secondary)}
  dl{padding:12px 16px;display:grid;grid-template-columns:92px 1fr;gap:8px 12px;font-size:13px}
  dt{color:var(--color-muted)}
  dd{margin:0;overflow-wrap:anywhere}
  dd.missing{color:var(--status-warning);font-weight:600}
  .quote{font-style:italic}
  .actions{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap}

  @media (max-width:1100px){
    .layout{grid-template-columns:1fr}
    .panel{position:static}
  }
  @media (max-width:720px){
    .shell{padding:14px}
    h1{font-size:20px}
    .chip{padding:6px 11px}
    .ruler{display:none}
    .row{grid-template-columns:1fr auto;grid-template-areas:"info state" "lanes lanes"}
    .info{grid-area:info;padding:12px 12px 8px}
    .state{grid-area:state;padding:12px 12px 8px;justify-content:flex-start;align-items:flex-end}
    .lanes{grid-area:lanes;margin:0 12px 12px;border:1px solid var(--color-line);border-radius:var(--radius-sm)}
    .lanes > span{flex-direction:column;justify-content:flex-start;gap:4px;padding:6px 4px;min-height:74px}
    .lanes .lbl{display:block;font-size:11px;color:var(--color-muted);font-weight:600;text-align:center;line-height:1.2}
    .slot{min-width:0;width:100%;padding:4px 5px;font-size:11px}
    .slot .g{font-size:11px}
    dl{grid-template-columns:84px 1fr}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="eyebrow">Собственик</div>
      <h1>Поръчки от сайта</h1>
      <div class="day" id="day"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="layout">
    <div>
      <div class="grid" id="grid" role="list" aria-label="Поръчки по заявена дата"></div>
      <div class="legend">
        <span><i class="lg lg-new"></i> Нова поръчка</span>
        <span><i class="lg lg-warn"></i> Трябва действие: липсва адрес или няма свободен аниматор</span>
        <span><i class="lg lg-ok"></i> Насрочена</span>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
const D = window.PARTYFOX;
const byId = (list, id) => list.find(x => x.id === id);
const animatorName = id => (byId(D.animators, id) || {}).name || "";

// The four weekend days the orders ask for, split into two weekends.
const days = [
  { key: "съб, 4 окт.", wd: "съб", d: "4 окт." },
  { key: "нед, 5 окт.", wd: "нед", d: "5 окт." },
  { key: "съб, 11 окт.", wd: "съб", d: "11 окт." },
  { key: "нед, 12 окт.", wd: "нед", d: "12 окт." },
];

const STATE = {
  "new": { cls: "new", label: "Нова", slot: "" },
  "needs-info": { cls: "warn", label: "Липсва адрес", slot: "warn" },
  "clash": { cls: "warn", label: "Няма свободен аниматор", slot: "warn" },
  "scheduled": { cls: "ok", label: "Насрочена", slot: "ok" },
};

// Leave that would take the assigned animator away on the party's day.
function leaveHit(order) {
  if (!order.animator) return null;
  return D.leaveRequests.find(l => l.animator === order.animator && l.state === "pending" &&
    (l.cover || []).some(c => c.when.startsWith(order.date.replace(/\.$/, ""))));
}

function tags(o) {
  const c = o.customer && byId(D.customers, o.customer);
  const out = [];
  if (o.large) out.push(`<span class="tag large">Голяма · ${o.guests} гости</span>`);
  if (c && c.tags.includes("repeat")) out.push(`<span class="tag repeat">Редовни · ${c.history.length} партита</span>`);
  if (!c) out.push(`<span class="tag">Нов клиент</span>`);
  else if (c.tags.includes("new")) out.push(`<span class="tag">Нов клиент</span>`);
  return out.join("");
}

const counts = {
  total: D.orders.length,
  fresh: D.orders.filter(o => o.state === "new").length,
  info: D.orders.filter(o => o.state === "needs-info").length,
  clash: D.orders.filter(o => o.state === "clash").length,
};
document.getElementById("day").textContent = `${D.day} · най-новите отгоре`;
document.getElementById("stats").innerHTML = `
  <span class="chip total"><b>${counts.total}</b> поръчки</span>
  <span class="chip"><b>${counts.fresh}</b> нови</span>
  <span class="chip warn"><b>${counts.info}</b> без адрес</span>
  <span class="chip warn"><b>${counts.clash}</b> без свободен аниматор</span>`;

let selected = "o1045";

function renderGrid() {
  let html = `<div class="ruler" aria-hidden="true"><div>Поръчка</div><div class="dates">` +
    days.map(d => `<span><span class="wk">${d.wd}</span>${d.d}</span>`).join("") +
    `</div><div>Състояние</div></div>`;
  for (const o of D.orders) {
    const s = STATE[o.state];
    const hit = leaveHit(o);
    html += `<button class="row" role="listitem" data-order="${o.id}" aria-current="${o.id === selected}">
      <span class="info">
        <span class="meta">#${o.id.slice(1)} · получена ${o.received}</span>
        <span class="who">${o.child}, ${o.age} г. · ${o.package}</span>
        <span class="parent">${o.parent}</span>
        <span class="tags">${tags(o)}</span>
      </span>
      <span class="lanes">` + days.map(d => `<span><span class="lbl">${d.wd}<br>${d.d}</span>${d.key === o.date ?
        `<span class="slot ${s.slot}"><span class="t">${o.time}</span><span class="g">${o.guests} гости</span></span>` : ""}</span>`).join("") +
      `</span>
      <span class="state"><span class="st ${s.cls}">${s.label}${o.state === "scheduled" ? " · " + animatorName(o.animator) : ""}</span>${hit ? `<span class="st warn" data-leave="${hit.id}">Нужно покритие</span>` : ""}</span>
    </button>`;
  }
  const grid = document.getElementById("grid");
  grid.innerHTML = html;
  grid.querySelectorAll(".row").forEach(r => r.addEventListener("click", () => { selected = r.dataset.order; render(); }));
}

function renderPanel() {
  const o = byId(D.orders, selected);
  const c = o.customer && byId(D.customers, o.customer);
  const s = STATE[o.state];
  const hit = leaveHit(o);
  let alert = "";
  let actions = `<button class="btn primary">Насрочи</button><button class="btn">Пиши на родителя</button>`;
  if (o.state === "needs-info") {
    alert = `<div class="alert" data-order-alert="${o.id}"><b>Адресът липсва</b>Родителят написа: <span class="quote">„${o.note}“</span> Аниматорът няма да знае къде да отиде.</div>`;
    actions = `<button class="btn warn">Поискай адреса</button><button class="btn">Насрочи без адрес</button>`;
  } else if (o.state === "clash") {
    alert = `<div class="alert" data-order-alert="${o.id}"><b>Няма свободен аниматор в ${o.time}</b>${o.clashNote}</div>`;
    actions = `<button class="btn primary">Възложи на Симо</button><button class="btn">Предложи друг час</button>`;
  } else if (o.large) {
    alert = `<div class="alert info" data-order-alert="${o.id}"><b>Голяма поръчка · ${o.guests} гости</b>${o.note}</div>`;
    actions = `<button class="btn primary">Насрочи с двама аниматори</button><button class="btn">Пиши на родителя</button>`;
  } else if (hit) {
    alert = `<div class="alert" data-leave="${hit.id}"><b>Мая е поискала отпуск ${hit.from} – ${hit.to}</b>Молбата чака решение. Ако я одобриш, партито ще трябва да се покрие от друг аниматор.</div>`;
    actions = `<button class="btn primary">Отвори резервацията</button><button class="btn">Виж молбата за отпуск</button>`;
  } else if (o.note) {
    alert = `<div class="alert info"><b>Бележка от родителя</b>${o.note}</div>`;
  }
  const n = c ? c.history.length : 0;
  const history = c ? (n ? `${c.family} · ${n === 1 ? "1 предишно парти" : n + " предишни партита"}` : `${c.family} · първа поръчка`) : "Няма досие · нов клиент";
  document.getElementById("panel").innerHTML = `
    <div class="hd" data-order="${o.id}">
      <div class="meta">#${o.id.slice(1)} · получена ${o.received}</div>
      <h2>${o.child}, ${o.age} г. · ${o.package}</h2>
      <div class="when">${o.date} · ${o.time}</div>
      <div class="tags" style="margin-top:8px"><span class="st ${s.cls}">${s.label}${o.state === "scheduled" ? " · " + animatorName(o.animator) : ""}</span></div>
    </div>
    ${alert}
    <dl>
      <dt>Родител</dt><dd>${o.parent}</dd>
      <dt>Телефон</dt><dd>${o.phone}</dd>
      <dt>Гости</dt><dd>${o.guests}</dd>
      <dt>Адрес</dt>${o.address ? `<dd>${o.address}</dd>` : `<dd class="missing">Не е попълнен</dd>`}
      <dt>Клиент</dt><dd ${c ? `data-customer="${c.id}"` : ""}>${history}</dd>
      ${o.note && o.state !== "needs-info" && !o.large ? `<dt>Бележка</dt><dd>${o.note}</dd>` : ""}
      <dt>Депозит</dt><dd>Сумата не е зададена</dd>
    </dl>
    <div class="actions">${actions}</div>`;
}

function render() { renderGrid(); renderPanel(); }
render();
</script>
</body>
</html>
