<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Ростър · Отпуски</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Roster: animators are rows, the next three weeks run across, leave sits on the grid as bands. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 10%, var(--color-surface));
    --weekend:color-mix(in oklab, var(--color-surface-2) 70%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 12%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .eyebrow{font-size:12px;color:var(--color-muted);font-weight:600}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:13px;margin-top:2px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--color-surface);border:1px solid var(--color-line);border-radius:999px;
        padding:7px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .chip b{font-family:var(--font-display);font-size:16px;line-height:1}
  .chip.total{background:var(--color-secondary-soft);border-color:transparent;color:var(--color-secondary)}
  .chip.warn{border-color:var(--status-warning);background:var(--tint-warning);color:var(--status-warning)}

  .btn{font:inherit;font-size:13px;font-weight:600;border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);white-space:nowrap}
  .btn:hover{background:var(--color-surface-2)}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:transparent}
  .btn.primary:hover{background:color-mix(in oklab, var(--color-primary) 88%, var(--color-ink))}
  .btn.warn{border-color:var(--status-warning);color:var(--status-warning)}

  /* The grid */
  .grid{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden}
  .row{display:grid;grid-template-columns:150px repeat(var(--days),minmax(0,1fr));border-bottom:1px solid var(--color-line);position:relative}
  .row:last-child{border-bottom:0}
  .months,.ruler{background:var(--color-surface-2)}
  .months{border-bottom:0}
  .months span{grid-row:1;font-size:11px;font-weight:700;color:var(--color-muted);padding:6px 6px 0;text-transform:uppercase;letter-spacing:.04em;border-left:1px solid var(--color-line)}
  .corner{grid-column:1;grid-row:1;padding:8px 14px;font-size:12px;color:var(--color-muted);font-weight:600;border-right:1px solid var(--color-line);display:flex;align-items:flex-end}
  .months .corner{padding-bottom:0}
  .ruler .d{grid-row:1;text-align:center;padding:2px 0 6px;font-size:11px;color:var(--color-muted);line-height:1.2;font-variant-numeric:tabular-nums}
  .ruler .d b{display:block;font-size:12.5px;color:var(--color-ink);font-weight:650}
  .ruler .d.we b{color:var(--color-secondary)}
  .ruler .d.today{color:var(--color-primary)}
  .ruler .d.today b{background:var(--color-primary);color:var(--color-on-primary);border-radius:var(--radius-sm);margin:0 3px}

  .who{grid-column:1;grid-row:1;padding:12px 14px;border-right:1px solid var(--color-line);display:flex;flex-direction:column;justify-content:center;gap:2px;z-index:2;background:var(--color-surface)}
  .who .nm{font-weight:650}
  .who .rl{font-size:12px;color:var(--color-muted)}
  .cell{grid-row:1;border-left:1px solid color-mix(in oklab, var(--color-line) 55%, transparent);min-height:62px}
  .cell.we{background:var(--weekend)}
  .cell.today{box-shadow:inset 2px 0 0 var(--color-primary)}

  .band{grid-row:1;align-self:center;height:40px;margin:0 2px;border-radius:var(--radius-sm);z-index:3;font:inherit;
        display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;font-size:11.5px;font-weight:600;
        overflow:hidden;white-space:nowrap;cursor:pointer;text-align:center}
  .band.pending{background:var(--color-primary-soft);border:1.5px dashed var(--color-primary);color:var(--color-primary)}
  .band.approved{background:repeating-linear-gradient(135deg,var(--color-bg) 0 9px,var(--color-surface) 9px 18px);border:1px solid var(--color-line);color:var(--color-muted)}
  .band.declined{background:var(--color-surface);border:1px dashed var(--color-line);color:var(--color-muted);text-decoration:line-through}
  .band.hl{box-shadow:0 0 0 3px color-mix(in oklab, var(--color-primary) 30%, transparent)}
  .band .short{display:none}
  .band.narrow .long{display:none}
  .band.narrow .short{display:inline}
  .band.narrow{padding:0 1px;margin:0 1px}
  .cover{grid-row:1;align-self:end;margin:0 3px 3px;z-index:4;border:1.5px solid var(--status-warning);background:var(--tint-warning);
         color:var(--status-warning);font-size:11px;font-weight:700;border-radius:var(--radius-sm);text-align:center;padding:0 2px;line-height:1.4}
  .row.has-cover .band{align-self:start;margin-top:4px;height:34px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--color-muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .lg{width:14px;height:14px;border-radius:var(--radius-sm);display:inline-block}
  .lg-pending{background:var(--color-primary-soft);border:1.5px dashed var(--color-primary)}
  .lg-approved{background:repeating-linear-gradient(135deg,var(--color-line) 0 3px,var(--color-surface) 3px 6px);border:1px solid var(--color-line)}
  .lg-declined{border:1px dashed var(--color-muted)}
  .lg-cover{background:var(--tint-warning);border:1.5px solid var(--status-warning)}
  .lg-we{background:var(--weekend);border:1px solid var(--color-line)}

  /* Request cards */
  h2{font-size:13px;font-weight:700;color:var(--color-muted);margin:24px 0 10px;display:flex;gap:8px;align-items:center}
  h2 b{font-family:var(--font-display);font-size:15px;color:var(--color-ink)}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .cards.done{grid-template-columns:repeat(3,minmax(0,1fr))}
  .req{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
  .req.pending{box-shadow:inset 3px 0 0 var(--color-primary)}
  .req .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .req .nm{font-weight:650;font-size:15px}
  .req .rl{font-size:12px;color:var(--color-muted)}
  .req .dates{font-family:var(--font-body);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.25}
  .req .sub{font-size:12.5px;color:var(--color-muted)}
  .st{font-size:12px;font-weight:600;border-radius:var(--radius-sm);padding:3px 9px;white-space:nowrap}
  .st.pending{background:var(--color-primary-soft);color:var(--color-primary)}
  .st.approved{background:var(--tint-ok);color:var(--status-ok)}
  .st.declined{background:var(--color-surface-2);color:var(--color-muted)}
  .needs{border:1px solid var(--status-warning);background:var(--tint-warning);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px}
  .needs b{color:var(--status-warning);display:block;font-size:12.5px}
  .clear{font-size:12.5px;color:var(--status-ok);font-weight:600}
  .ownote{border-left:3px solid var(--color-line);padding:4px 10px;font-size:13px;background:var(--color-surface-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .ownote span{display:block;font-size:11.5px;color:var(--color-muted);font-weight:600}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}

  @media (max-width:1100px){
    .row{grid-template-columns:120px repeat(var(--days),minmax(0,1fr))}
    .cards.done{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:720px){
    .shell{padding:14px}
    h1{font-size:20px}
    .chip{padding:6px 11px}
    .row{grid-template-columns:56px repeat(var(--days),minmax(0,1fr))}
    .who{padding:10px 6px}
    .who .rl{display:none}
    .who .nm{font-size:12.5px}
    .corner{padding:6px;font-size:11px}
    .ruler .d{padding:2px 0 5px;overflow:visible;white-space:nowrap}
    .ruler .d span{display:none}
    .ruler .d:not(.sat) b{display:none}
    .ruler .d b{font-size:11px}
    .ruler .d.today b{margin:0;background:none;color:var(--color-primary)}
    .corner .ctx{display:none}
    .months span{padding:5px 3px 0;overflow:hidden;white-space:nowrap}
    .cell{min-height:52px}
    .band{height:30px;margin:0 1px;padding:0;font-size:11px}
    .band .long,.band .short{display:none !important}
    .row.has-cover .band{height:26px;margin-top:4px}
    .cover{height:12px;margin:0 0 5px}
    .cover .ctx{display:none}
    .cards,.cards.done{grid-template-columns:1fr}
    .acts .btn{flex:1 1 auto}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="eyebrow">Собственик</div>
      <h1>Молби за отпуск</h1>
      <div class="day" id="day"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="grid" id="grid" aria-label="Отпуски по аниматор и ден"></div>
  <div class="legend">
    <span><i class="lg lg-pending"></i> Чака решение</span>
    <span><i class="lg lg-approved"></i> Одобрен</span>
    <span><i class="lg lg-declined"></i> Отказан</span>
    <span><i class="lg lg-cover"></i> Парти, което трябва да се покрие</span>
    <span><i class="lg lg-we"></i> Събота и неделя</span>
  </div>

  <h2><b id="n-pending"></b> Чакат решение</h2>
  <div class="cards" id="pending"></div>
  <h2><b id="n-done"></b> Решени</h2>
  <div class="cards done" id="done"></div>
</div>

<script>
const D = window.PARTYFOX;
const animator = id => D.animators.find(a => a.id === id);
// Window: today (Sat 27 Sept) to Sun 19 Oct.
const FIRST = { month: "септ", day: 27 };
const DAYS = 23;
const WD = ["сб", "нд", "пн", "вт", "ср", "чт", "пт"];
const idx = text => { const m = text.match(/(\d+)\s+(септ|окт)/); return m[2] === "септ" ? +m[1] - FIRST.day : +m[1] + 3; };
const dayNum = i => i < 4 ? 27 + i : i - 3;
document.documentElement.style.setProperty("--days", DAYS);

const pending = D.leaveRequests.filter(l => l.state === "pending");
const coverNeeded = pending.reduce((n, l) => n + (l.cover || []).length, 0);
document.getElementById("day").textContent = `${D.day} · следващите три седмици`;
document.getElementById("stats").innerHTML = `
  <span class="chip total"><b>${pending.length}</b> чакат решение</span>
  <span class="chip warn"><b>${coverNeeded}</b> парти без покритие</span>`;

let html = `<div class="row months" aria-hidden="true"><div class="corner"></div>
  <span style="grid-column:2 / span 4">септ.</span><span style="grid-column:6 / span ${DAYS - 4}">окт.</span></div>`;
html += `<div class="row ruler" aria-hidden="true"><div class="corner"><span class="ctx">Аниматор</span></div>` +
  Array.from({ length: DAYS }, (_, i) => `<div class="d${i % 7 < 2 ? " we" : ""}${i % 7 === 0 ? " sat" : ""}${i === 0 ? " today" : ""}" style="grid-column:${i + 2}"><span>${WD[i % 7]}</span><b>${dayNum(i)}</b></div>`).join("") + `</div>`;

const LABEL = { pending: "Чака решение", approved: "Одобрен", declined: "Отказан" };
const BAND = { pending: "Чака", approved: "Одобрен", declined: "Отказан" };
const SHORT = { pending: "чака", approved: "да", declined: "отказ" };
for (const a of D.animators) {
  const mine = D.leaveRequests.filter(l => l.animator === a.id);
  const hasCover = mine.some(l => (l.cover || []).length);
  html += `<div class="row${hasCover ? " has-cover" : ""}" data-animator="${a.id}"><div class="who"><span class="nm">${a.name}</span><span class="rl">${a.role}</span></div>` +
    Array.from({ length: DAYS }, (_, i) => `<i class="cell${i % 7 < 2 ? " we" : ""}${i === 0 ? " today" : ""}" style="grid-column:${i + 2}"></i>`).join("");
  for (const l of mine) {
    const s = idx(l.from), e = idx(l.to) + 1;
    const len = e - s;
    const long = l.hours ? `${BAND[l.state]} · ${l.hours}` : len >= 3 ? `${BAND[l.state]} · ${l.days} дни` : BAND[l.state];
    const short = l.hours ? l.hours.replace(/:00/g, "") : SHORT[l.state];
    html += `<button class="band ${l.state}${len < 2 ? " narrow" : ""}" data-leave="${l.id}" style="grid-column:${s + 2} / ${e + 2}" title="${a.name}: ${l.from}${l.to !== l.from ? " – " + l.to : ""} · ${LABEL[l.state]}" aria-label="${a.name}, ${LABEL[l.state]}, ${l.from}"><span class="long">${long}</span><span class="short">${short}</span></button>`;
    for (const c of l.cover || []) {
      const ci = idx(c.when);
      html += `<span class="cover" data-cover="${l.id}" style="grid-column:${ci + 2}" title="Трябва покритие: ${c.booking}, ${c.when}"><span class="ctx">${c.booking.split(",")[0]}</span></span>`;
    }
  }
  html += `</div>`;
}
document.getElementById("grid").innerHTML = html;

function card(l) {
  const a = animator(l.animator);
  const when = l.hours ? `${l.from} · ${l.hours}` : (l.from === l.to ? l.from : `${l.from} – ${l.to}`);
  const length = l.hours ? "няколко часа" : `${l.days} ${l.days === 1 ? "ден" : "дни"}`;
  let body = "";
  if (l.state === "pending") {
    body += (l.cover || []).length
      ? (l.cover.map(c => `<div class="needs" data-cover="${l.id}"><b>Трябва покритие за 1 парти</b>${c.booking} · ${c.when}</div>`).join(""))
      : `<div class="clear">Няма партита в тези дни</div>`;
    body += `<div class="acts">
      <button class="btn primary" data-action="approve">Одобри</button>
      <button class="btn">Откажи с бележка</button>
      ${(l.cover || []).length ? `<button class="btn warn">Намери заместник</button>` : ""}</div>`;
  }
  if (l.state === "declined" && l.ownerNote) body += `<div class="ownote"><span>Твоята бележка при отказа</span>${l.ownerNote}</div>`;
  return `<article class="req ${l.state}" data-leave="${l.id}" tabindex="0">
    <div class="top"><div><div class="nm">${a.name}</div><div class="rl">${a.role}</div></div><span class="st ${l.state}">${LABEL[l.state]}</span></div>
    <div><div class="dates">${when}</div><div class="sub">${length} · ${l.reason || "без причина"} · изпратена ${l.sent}</div></div>
    ${body}
  </article>`;
}
const done = D.leaveRequests.filter(l => l.state !== "pending");
document.getElementById("n-pending").textContent = pending.length;
document.getElementById("n-done").textContent = done.length;
document.getElementById("pending").innerHTML = pending.map(card).join("");
document.getElementById("done").innerHTML = done.map(card).join("");

// Pointing at a card lights its band on the grid, and the other way round.
const light = (id, on) => document.querySelectorAll(`.band[data-leave="${id}"]`).forEach(b => b.classList.toggle("hl", on));
document.querySelectorAll(".req").forEach(c => {
  ["mouseenter", "focusin"].forEach(ev => c.addEventListener(ev, () => light(c.dataset.leave, true)));
  ["mouseleave", "focusout"].forEach(ev => c.addEventListener(ev, () => light(c.dataset.leave, false)));
});
document.querySelectorAll(".band").forEach(b => b.addEventListener("click", () => {
  const c = document.querySelector(`.req[data-leave="${b.dataset.leave}"]`);
  c.scrollIntoView({ behavior: "smooth", block: "center" }); c.focus({ preventScroll: true });
}));
</script>
</body>
</html>
