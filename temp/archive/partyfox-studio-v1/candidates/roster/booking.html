<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Ростър · Резервация</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Roster: the booking's path runs across as one row of steps, and the party sits on the animator's day lane. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 10%, var(--color-surface));
    --tint-booking:var(--color-primary-soft);
    --edge-booking:color-mix(in oklab, var(--color-primary) 35%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 12%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .eyebrow{font-size:12px;color:var(--color-muted);font-weight:600}
  .eyebrow a{color:inherit}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:13px;margin-top:2px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--color-surface);border:1px solid var(--color-line);border-radius:999px;
        padding:7px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .chip b{font-family:var(--font-display);font-size:16px;line-height:1}
  .chip.total{background:var(--color-secondary-soft);border-color:transparent;color:var(--color-secondary)}
  .chip.bad{border-color:var(--status-danger);background:var(--tint-danger);color:var(--status-danger)}

  .btn{font:inherit;font-size:13px;font-weight:600;border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);white-space:nowrap}
  .btn:hover{background:var(--color-surface-2)}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:transparent}
  .btn.primary:hover{background:color-mix(in oklab, var(--color-primary) 88%, var(--color-ink))}

  /* Missing deposit: the one solid red treatment on the screen. */
  .deposit{display:grid;grid-template-columns:auto 1fr auto;gap:14px 18px;align-items:center;padding:14px 18px;
           border:2px solid var(--status-danger);background:var(--tint-danger);border-radius:var(--radius-md)}
  .deposit .mark{background:var(--status-danger);color:var(--color-surface);font-weight:700;font-size:13px;
                 border-radius:var(--radius-sm);padding:6px 10px;white-space:nowrap}
  .deposit h2{font-size:15px;font-weight:700;color:var(--status-danger)}
  .deposit p{font-size:13px;color:var(--color-ink);margin-top:2px}
  .deposit .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

  .card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md)}
  .card > h3{font-size:12px;font-weight:700;color:var(--color-muted);padding:11px 16px;border-bottom:1px solid var(--color-line);
             background:var(--color-surface-2);border-radius:var(--radius-md) var(--radius-md) 0 0;display:flex;justify-content:space-between;gap:10px}
  .card > h3 span{font-weight:600}

  /* Path of the booking: one roster row, steps as columns. */
  .path{margin-top:16px}
  .steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr))}
  .step{position:relative;padding:14px 8px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--color-line);min-width:0}
  .step:last-child{border-right:0}
  .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
       border:1.5px solid var(--color-line);background:var(--color-surface);color:var(--color-muted);position:relative;z-index:1}
  .step::before{content:"";position:absolute;left:0;right:0;top:25px;height:2px;background:var(--color-line)}
  .step:first-child::before{left:19px}
  .step:last-child::before{right:calc(100% - 19px)}
  .step.done::before{background:color-mix(in oklab, var(--status-ok) 45%, var(--color-surface))}
  .step.done .dot{background:var(--status-ok);border-color:var(--status-ok);color:var(--color-surface)}
  .step.missing{background:var(--tint-danger)}
  .step.missing .dot{background:var(--status-danger);border-color:var(--status-danger);color:var(--color-surface)}
  .step.next .dot{border:2px solid var(--color-primary);color:var(--color-primary)}
  .step .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .step .lb{font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .step.todo .lb{color:var(--color-muted);font-weight:500}
  .step.missing .lb{color:var(--status-danger)}
  .step .wh{font-size:11.5px;color:var(--color-muted);font-variant-numeric:tabular-nums}
  .step.missing .wh{color:var(--status-danger);font-weight:600}

  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:16px}

  /* The animator's day lane */
  .lane-wrap{padding:12px 16px 14px}
  .hours{position:relative;height:18px;margin:0 0 4px}
  .hours span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--color-muted);font-variant-numeric:tabular-nums}
  .hours span:first-child{transform:none}
  .lane{position:relative;height:58px;border:1px solid var(--color-line);border-radius:var(--radius-sm);background:var(--color-surface)}
  .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--color-line)}
  .block{position:absolute;top:7px;bottom:7px;border-radius:var(--radius-sm);padding:4px 8px;font-size:12px;z-index:2;
         display:flex;flex-direction:column;justify-content:center;overflow:hidden;box-shadow:var(--shadow);
         background:var(--tint-danger);border:2px solid var(--status-danger);color:var(--status-danger)}
  .block .t{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .block .d{white-space:nowrap;font-size:11.5px}
  .block .ts{display:none}
  .leave-band{position:absolute;top:7px;bottom:7px;border-radius:var(--radius-sm);z-index:1;
        background:repeating-linear-gradient(135deg,var(--color-bg) 0 9px,var(--color-surface) 9px 18px);
        border:1px solid var(--color-line);display:flex;align-items:center;justify-content:center;
        font-size:11.5px;color:var(--color-muted);font-weight:600;text-align:center;line-height:1.2;padding:0 4px}
  .lane-note{font-size:12.5px;color:var(--color-muted);margin-top:8px}

  dl{padding:12px 16px;display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}
  dt{color:var(--color-muted)}
  dd{margin:0;overflow-wrap:anywhere}
  dd.unset{color:var(--color-muted);font-style:italic}
  .tag{font-size:11px;font-weight:600;border-radius:var(--radius-sm);padding:2px 7px;background:var(--color-secondary-soft);color:var(--color-secondary);margin-left:6px;white-space:nowrap}
  .actions{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}

  .prov{list-style:none;padding:0}
  .prov li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 16px;border-bottom:1px solid var(--color-line);font-size:13px}
  .prov li:last-child{border-bottom:0}
  .prov .who{color:var(--color-muted);font-size:12.5px}
  .prov .st{grid-row:span 2;align-self:center;font-size:12px;font-weight:600;border-radius:var(--radius-sm);padding:3px 8px;background:var(--color-surface-2);color:var(--color-muted)}
  .prov .st.ok{background:var(--tint-ok);color:var(--status-ok)}

  .msgs{list-style:none;padding:0}
  .msgs li{padding:11px 16px;border-bottom:1px solid var(--color-line);font-size:13px}
  .msgs li:last-child{border-bottom:0}
  .msgs .m{display:flex;gap:8px;font-size:12px;color:var(--color-muted);margin-bottom:3px}
  .msgs .ch{font-weight:700;color:var(--color-secondary)}

  @media (max-width:1100px){
    .deposit{grid-template-columns:auto 1fr}
    .deposit .acts{grid-column:1 / -1;justify-content:flex-start}
  }
  @media (max-width:900px){
    .cols{grid-template-columns:1fr}
  }
  @media (max-width:720px){
    .shell{padding:14px}
    h1{font-size:20px}
    .chip{padding:6px 11px}
    .deposit{grid-template-columns:1fr;gap:10px;padding:14px}
    .deposit .mark{justify-self:start}
    .deposit .acts .btn{flex:1 1 auto}
    /* On a phone the path turns into a vertical list: time runs down. */
    .steps{grid-template-columns:1fr}
    .step{flex-direction:row;align-items:flex-start;gap:12px;border-right:0;padding:9px 14px 9px 14px}
    .step::before{left:24px;right:auto;top:0;bottom:0;width:2px;height:auto}
    .step:first-child::before{top:20px;left:24px}
    .step:last-child::before{bottom:calc(100% - 20px);right:auto}
    .dot{flex:none}
    dl{grid-template-columns:110px 1fr}
    .block{padding:4px 5px}
    .block .tl,.block .d{display:none}
    .block .ts{display:inline}
    .hours span:nth-child(even){display:none}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="eyebrow">Собственик · <a href="#" id="crumbs"></a></div>
      <h1 id="title"></h1>
      <div class="day" id="day"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="deposit" id="deposit" data-deposit="b5" aria-label="Депозит"></section>

  <section class="card path" aria-label="Пътят на резервацията">
    <h3>Пътят на резервацията <span id="progress"></span></h3>
    <ol class="steps" id="steps"></ol>
  </section>

  <div class="cols">
    <div class="stack">
      <section class="card" data-lane="maya">
        <h3>Денят на Мая <span id="lane-day"></span></h3>
        <div class="lane-wrap">
          <div class="hours" id="hours" aria-hidden="true"></div>
          <div class="lane" id="lane"></div>
          <p class="lane-note" id="lane-note"></p>
        </div>
      </section>
      <section class="card" data-section="details">
        <h3>Парти и родител</h3>
        <dl id="details"></dl>
        <div class="actions"><button class="btn">Отвори адреса в карти</button><button class="btn">Промени</button></div>
      </section>
    </div>
    <div class="stack">
      <section class="card" data-section="providers">
        <h3>Външни доставчици</h3>
        <ul class="prov" id="providers"></ul>
      </section>
      <section class="card" data-section="messages">
        <h3>Съобщения до родителя <span id="msg-count"></span></h3>
        <ul class="msgs" id="messages"></ul>
        <div class="actions"><button class="btn">Ново съобщение</button></div>
      </section>
    </div>
  </div>
</div>

<script>
const D = window.PARTYFOX;
const B = D.booking;
const party = D.bookings.find(b => b.id === B.id);
const animator = D.animators.find(a => a.id === party.animator);
const customer = D.customers.find(c => c.id === B.customer);
const hh = h => `${String(h).padStart(2, "0")}:00`;

document.getElementById("crumbs").textContent = `Поръчка #${B.order.slice(1)}`;
document.getElementById("title").textContent = `${party.child}, ${party.age} г. · ${party.package}`;
document.getElementById("day").textContent = `${D.day} · ${hh(party.start)}–${hh(party.end)} · аниматор ${animator.name}`;
document.getElementById("stats").innerHTML = `
  <span class="chip total"><b>${B.guests}</b> гости</span>
  <span class="chip">Пакет „${party.package}“</span>`;

const reminder = B.messages.filter(m => /депозит/i.test(m.text)).pop();
document.getElementById("deposit").innerHTML = `
  <span class="mark">Депозит липсва</span>
  <div>
    <h2>Депозитът за партито на ${party.child} не е получен</h2>
    <p>Партито е днес от ${hh(party.start)}. ${reminder ? `Последно напомняне: ${reminder.when} (${reminder.channel}).` : ""} ${B.depositNote}</p>
  </div>
  <div class="acts">
    <button class="btn primary" data-action="deposit-received">Отбележи депозита като получен</button>
    <button class="btn" data-action="remind">Напомни отново</button>
  </div>`;

const done = B.steps.filter(s => s.state === "done").length;
document.getElementById("progress").textContent = `${done} от ${B.steps.length} стъпки`;
const glyph = { done: "✓", missing: "!", next: "", todo: "" };
document.getElementById("steps").innerHTML = B.steps.map((s, i) => `
  <li class="step ${s.state}" data-step="${i + 1}">
    <span class="dot" aria-hidden="true">${glyph[s.state] || i + 1}</span>
    <span class="txt"><span class="lb">${s.label}</span>
    <span class="wh">${s.state === "missing" ? "Не е получен" : s.when || "Предстои"}</span></span>
  </li>`).join("");

// Мая's day: the same hours as the operations day, with her approved leave.
const span = D.hours.end - D.hours.start;
const pct = h => ((h - D.hours.start) / span) * 100;
const hoursList = Array.from({ length: span }, (_, i) => D.hours.start + i).filter(h => h % 2 === 1);
document.getElementById("hours").innerHTML = hoursList.map(h => `<span style="left:${pct(h)}%">${hh(h)}</span>`).join("");
document.getElementById("lane-day").textContent = "днес";
const leave = D.leave.find(l => l.animator === animator.id);
const others = D.bookings.filter(b => b.animator === animator.id && b.id !== party.id);
document.getElementById("lane").innerHTML =
  Array.from({ length: span - 1 }, (_, i) => `<i class="tick" style="left:${pct(D.hours.start + i + 1)}%"></i>`).join("") +
  (leave ? `<div class="leave-band" data-leave="l5" style="left:${pct(leave.from)}%;width:${pct(leave.to) - pct(leave.from)}%">отпуск</div>` : "") +
  `<div class="block" data-booking="${party.id}" style="left:${pct(party.start)}%;width:${pct(party.end) - pct(party.start)}%">
     <span class="t"><span class="tl">${hh(party.start)}–${hh(party.end)}</span><span class="ts">${hh(party.start)}</span></span><span class="d">${party.child}</span></div>`;
document.getElementById("lane-note").textContent = others.length
  ? `Мая има още ${others.length} парти днес.`
  : `Мая няма други партита днес. Одобреният ѝ отпуск ${hh(leave.from)}–${hh(leave.to)} свършва час преди партито.`;

const repeat = customer.tags.includes("repeat");
document.getElementById("details").innerHTML = `
  <dt>Адрес</dt><dd>${party.address}<br><span style="color:var(--color-muted)">${B.addressNote}</span></dd>
  <dt>Родител</dt><dd data-customer="${customer.id}">${B.parent}${repeat ? `<span class="tag">Редовни · ${customer.history.length}-то парти</span>` : ""}</dd>
  <dt>Телефон</dt><dd>${B.phone}</dd>
  <dt>Имейл</dt><dd>${B.email}</dd>
  <dt>Гости</dt><dd>${B.guests}</dd>
  <dt>Сума на депозита</dt><dd class="unset">не е зададена</dd>
  <dt>Заплащане на Мая</dt><dd class="unset">не е зададено</dd>`;

document.getElementById("providers").innerHTML = B.providers.map((p, i) => `
  <li data-provider="${i + 1}"><span>${p.what}</span><span class="st ${p.state === "Потвърдено" ? "ok" : ""}">${p.state}</span><span class="who">${p.who}</span></li>`).join("");

document.getElementById("msg-count").textContent = `${B.messages.length} изпратени`;
document.getElementById("messages").innerHTML = B.messages.slice().reverse().map((m, i) => `
  <li data-message="${B.messages.length - i}"><div class="m"><span class="ch">${m.channel}</span><span>${m.when}</span></div>${m.text}</li>`).join("");
</script>
</body>
</html>
