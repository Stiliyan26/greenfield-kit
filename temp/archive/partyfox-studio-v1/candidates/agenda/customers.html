<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Клиенти</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Agenda candidate · owner · customers: upcoming birthdays as a dated list, then the families. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 12%, var(--color-surface));
    --tint-primary:color-mix(in oklab, var(--color-primary) 10%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 8%, transparent);
    --ring:0 0 0 3px color-mix(in oklab, var(--color-primary) 35%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .shell{max-width:960px;margin:0 auto;padding:20px 22px;display:grid;grid-template-columns:220px 1fr;gap:26px}

  aside{position:sticky;top:20px;align-self:start}
  h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:12.5px;margin:2px 0 14px}
  .search{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--color-line);border-radius:var(--radius-sm);
          background:var(--color-surface);color:var(--color-ink);margin-bottom:12px}
  .search::placeholder{color:var(--color-muted)}
  .search:focus-visible,.chip:focus-visible,.btn:focus-visible,.toggle:focus-visible{outline:none;box-shadow:var(--ring)}
  .filters{display:flex;flex-direction:column;gap:4px}
  .chip{font-family:inherit;font-size:13px;font-weight:600;text-align:left;padding:6px 10px;border-radius:var(--radius-sm);
        border:1px solid transparent;background:transparent;color:var(--color-ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .chip small{color:var(--color-muted);font-weight:600;font-size:12px}
  .chip[aria-pressed="true"]{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
  .chip[aria-pressed="true"] small{color:var(--color-on-primary)}
  .chip:hover:not([aria-pressed="true"]){background:var(--color-surface-2)}
  .stats{margin-top:12px}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-line);font-size:13px}
  .stat b{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
  .stat.accent b{color:var(--color-tertiary)}

  main{position:relative;padding-left:26px;min-width:0}
  main::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--color-line);border-radius:2px}
  .section{position:relative;margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--color-muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .section::before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:2px;background:var(--color-muted)}
  .section b{font-family:var(--font-display);font-size:14px;letter-spacing:0;color:var(--color-ink);text-transform:none}
  .slot + .section,.fam + .section{margin-top:26px}

  .slot{position:relative;margin-bottom:10px}
  .slot::before{content:"";position:absolute;left:-22px;top:8px;width:9px;height:9px;border-radius:50%;
                background:var(--color-surface);border:2px solid var(--color-primary)}
  .slot.open::before{background:var(--color-tertiary);border-color:var(--color-tertiary);box-shadow:0 0 0 4px color-mix(in oklab, var(--color-primary) 15%, transparent)}

  .row{display:grid;grid-template-columns:minmax(74px,max-content) 1fr;gap:14px;align-items:start}
  .time{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;
        font-variant-numeric:tabular-nums;color:var(--color-primary);padding-top:2px}
  .time small{display:block;font-size:12px;color:var(--color-muted);font-family:var(--font-body);margin-top:3px;font-weight:600}

  .card{background:var(--color-surface);border:1px solid var(--color-line);
        border-radius:var(--radius-md);padding:9px 14px;box-shadow:var(--shadow);min-width:0}
  .card.open{border:1.5px solid var(--color-tertiary);background:var(--color-tertiary-soft)}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .head .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .child{font-weight:700;font-size:15px}
  .sub{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--color-muted)}
  .sub .who{color:var(--color-ink);font-weight:600}

  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .pill.ok{background:var(--tint-ok);color:var(--status-ok)}
  .pill.wait{background:var(--tint-primary);color:var(--color-primary)}
  .pill.open{background:var(--color-tertiary);color:var(--color-on-tertiary)}
  .pill.red{background:var(--status-danger);color:var(--color-surface)}   /* the only solid red */
  .tag{font-size:11px;font-weight:700;border-radius:var(--radius-sm);padding:2px 8px;white-space:nowrap}
  .tag.repeat{color:var(--color-secondary);background:var(--color-secondary-soft)}
  .tag.large{color:var(--color-tertiary);background:var(--color-tertiary-soft)}
  .tag.new{color:var(--color-primary);background:var(--tint-primary)}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:var(--radius-sm);
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);cursor:pointer}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
  .btn.accent{background:var(--color-tertiary);color:var(--color-on-tertiary);border-color:var(--color-tertiary)}

  /* Families: full-width cards on the same rail. */
  .fam{position:relative;margin-bottom:10px;background:var(--color-surface);border:1px solid var(--color-line);
       border-radius:var(--radius-md);padding:10px 14px;box-shadow:var(--shadow);min-width:0}
  .fam::before{content:"";position:absolute;left:-22px;top:14px;width:9px;height:9px;border-radius:50%;
               background:var(--color-surface);border:2px solid var(--color-primary)}
  .fam.hidden{display:none}
  .fam .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .fam .name{font-family:var(--font-display);font-size:16px;font-weight:700}
  .fam .kids{margin-top:4px;font-size:12.5px;color:var(--color-muted);display:flex;gap:6px 14px;flex-wrap:wrap}
  .fam .kids b{color:var(--color-ink);font-weight:600}
  .fam .sum{margin-top:6px;font-size:12.5px;color:var(--color-muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
  .fam .sum strong{font-family:var(--font-display);font-size:15px;color:var(--color-ink);font-variant-numeric:tabular-nums}
  .toggle{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--color-primary);background:transparent;border:0;padding:4px 0;cursor:pointer}
  .toggle::before{content:"▸ ";font-size:11px}
  .toggle[aria-expanded="true"]::before{content:"▾ "}
  .hist{margin-top:6px;border-top:1px solid var(--color-line);padding-top:4px}
  .hist[hidden]{display:none}
  .h{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--color-line);font-size:12.5px;align-items:center}
  .h:last-child{border-bottom:0}
  .h .d{font-weight:600;color:var(--color-muted)}
  .h .g{color:var(--color-muted);white-space:nowrap;display:flex;gap:8px;align-items:center}

  .note{margin-top:8px;font-size:13px;color:var(--color-muted);grid-column:2}
  .empty{color:var(--color-muted);font-size:13px;font-style:italic;padding:8px 0}

  @media (max-width:640px){
    .shell{grid-template-columns:1fr;padding:14px;gap:14px}
    aside{position:static}
    .filters{flex-direction:row;flex-wrap:wrap}
    .chip{padding:5px 9px;font-size:12.5px}
    .stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
    .stat{border:0;padding:4px 0;gap:6px}
    main{padding-left:20px;margin-top:4px}
    main::before{left:6px}
    .section::before,.slot::before,.fam::before{left:-18px}
    .row{grid-template-columns:minmax(52px,max-content) 1fr;gap:10px}
    .time{font-size:20px}
    .card,.fam{padding:10px 12px}
    .h{grid-template-columns:78px 1fr;gap:4px 10px}
    .h .g{grid-column:2;white-space:normal}
    .note{grid-column:1}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div><h1>Клиенти</h1><div class="day" id="day"></div></div>
    <input class="search" id="q" type="search" placeholder="Търси семейство или дете" aria-label="Търси клиент">
    <div class="filters" role="group" aria-label="Филтър">
      <button class="chip" data-filter="all" aria-pressed="true">Всички <small id="c-all"></small></button>
      <button class="chip" data-filter="repeat" aria-pressed="false">Повтарящи се <small id="c-repeat"></small></button>
      <button class="chip" data-filter="large" aria-pressed="false">Големи партита <small id="c-large"></small></button>
      <button class="chip" data-filter="new" aria-pressed="false">Нови <small id="c-new"></small></button>
    </div>
    <div class="stats">
      <div class="stat"><span>Рождени дни до 30 дни</span><b id="s-bd"></b></div>
      <div class="stat accent"><span>Още без поръчка</span><b id="s-open"></b></div>
    </div>
  </aside>

  <main id="list"></main>
  <p class="note">Първо идват рождените дни по дата, защото те са следващата работа: дете без поръчка е шанс за обаждане. Отдолу са семействата с история и отворени поръчки.</p>
</div>

<script>
const D = window.PARTYFOX;
const MONTHS = {"септ.":9,"окт.":10,"ноем.":11,"дек.":12};
const cust = id => D.customers.find(c => c.id === id);
const parse = s => { const m = s.match(/(\S+),\s*(\d+)\s+(\S+)/); return { dow:m[1], day:+m[2], mon:m[3], key: MONTHS[m[3]]*100 + +m[2] }; };

const bds = D.birthdays.map(b => ({...b, d: parse(b.date)})).sort((a,b) => a.d.key - b.d.key);
const counts = { all: D.customers.length, repeat: D.customers.filter(c=>c.tags.includes("repeat")).length,
  large: D.customers.filter(c=>c.tags.includes("large")).length, new: D.customers.filter(c=>c.tags.includes("new")).length };
document.getElementById("day").textContent = `${counts.all} семейства · ${D.day}`;
for (const k of Object.keys(counts)) document.getElementById("c-"+k).textContent = counts[k];
document.getElementById("s-bd").textContent = bds.length;
document.getElementById("s-open").textContent = bds.filter(b => !b.booked).length;

const bookedPill = b => {
  if (!b.booked) return `<span class="pill open">Още без поръчка</span>`;
  if (b.booked.startsWith("b")) return `<span class="pill ok">Парти днес · ${b.booked}</span>`;
  const o = D.orders.find(o => o.id === b.booked);
  return o?.state === "scheduled" ? `<span class="pill ok">Насрочено · ${o.time}</span>` : `<span class="pill wait">Поръчка ${b.booked} чака</span>`;
};
const TAGS = { repeat: "Повтарящо се", large: "Големи партита", new: "Ново" };
const tags = c => c.tags.map(t => `<span class="tag ${t}">${TAGS[t]}</span>`).join("");

const bdHtml = `<div class="section"><b>Рождени дни</b><span>следващите 30 дни</span></div>` + bds.map(b => {
  const c = cust(b.customer);
  return `<div class="slot${b.booked ? "" : " open"}" data-birthday="${b.child}" data-customer="${b.customer}"><div class="row">
    <div class="time">${b.d.day}<small>${b.d.mon} · ${b.d.dow}</small></div>
    <div class="card${b.booked ? "" : " open"}">
      <div class="head"><div class="left"><span class="child">${b.child} става на ${b.turns}</span>${bookedPill(b)}</div><span class="sub" style="margin:0">${tags(c)}</span></div>
      <div class="sub"><span class="who">${c.family}</span><span>${c.parent} · ${c.phone}</span>${c.history.length ? `<span>последно: ${c.history[0].package}, ${c.history[0].date}</span>` : ""}</div>
      ${b.booked ? "" : `<div class="actions"><button class="btn accent">Пиши на семейството</button><button class="btn">Обади се</button></div>`}
    </div>
  </div></div>`;
}).join("");

const famHtml = c => {
  const parties = c.history.length;
  const biggest = parties ? Math.max(...c.history.map(h => h.guests)) : null;
  const open = c.open ? D.orders.find(o => o.id === c.open) : null;
  const expanded = c.id === "c4";
  return `<div class="fam" data-customer="${c.id}" data-tags="${c.tags.join(" ")}" data-text="${(c.family+" "+c.parent+" "+c.phone+" "+c.children.map(k=>k.name).join(" ")).toLowerCase()}">
    <div class="head"><div class="left" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="name">${c.family}</span>${tags(c)}</div>
      ${open ? `<span class="pill wait">Отворена поръчка ${open.id} · ${open.date}</span>` : ""}</div>
    <div class="kids"><b>${c.parent}</b><span>${c.phone}</span>${c.children.map(k => `<span>${k.name} · р.д. ${k.birthday}</span>`).join("")}</div>
    <div class="sum"><span><strong>${parties}</strong> ${parties===1?"парти":"партита"}</span>${biggest ? `<span>най-голямо: <strong>${biggest}</strong> гости</span>` : ""}${parties ? `<span>последно: ${c.history[0].date}</span>` : `<span>първо парти предстои</span>`}
      ${parties ? `<button class="toggle" aria-expanded="${expanded}" aria-controls="hist-${c.id}">История</button>` : ""}</div>
    ${parties ? `<div class="hist" id="hist-${c.id}" ${expanded ? "" : "hidden"}>${c.history.map(h => `<div class="h"><span class="d">${h.date}</span><span>${h.child} · ${h.package}</span><span class="g">${h.guests} гости${h.depositMissing ? ` <span class="pill red">Депозит липсва</span>` : ""}</span></div>`).join("")}</div>` : ""}
  </div>`;
};

document.getElementById("list").innerHTML = bdHtml +
  `<div class="section"><b>Семейства</b><span id="fam-count"></span></div>` + D.customers.map(famHtml).join("") + `<div class="empty" id="fam-empty" hidden>Няма семейства по този филтър.</div>`;

let filter = "all", q = "";
function apply(){
  let n = 0;
  document.querySelectorAll(".fam").forEach(el => {
    const ok = (filter === "all" || el.dataset.tags.split(" ").includes(filter)) && (!q || el.dataset.text.includes(q));
    el.classList.toggle("hidden", !ok); if (ok) n++;
  });
  document.getElementById("fam-count").textContent = `${n} от ${D.customers.length}`;
  document.getElementById("fam-empty").hidden = n > 0;
}
apply();
document.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b===btn)));
  filter = btn.dataset.filter; apply();
}));
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); apply(); });
document.querySelectorAll(".toggle").forEach(t => t.addEventListener("click", () => {
  const open = t.getAttribute("aria-expanded") !== "true";
  t.setAttribute("aria-expanded", String(open));
  document.getElementById(t.getAttribute("aria-controls")).hidden = !open;
}));
</script>
</body>
</html>
