<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Отпуск</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Agenda candidate · animator · request leave, phone first: a short form, then my requests by date. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 12%, var(--color-surface));
    --tint-primary:color-mix(in oklab, var(--color-primary) 10%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 8%, transparent);
    --ring:0 0 0 3px color-mix(in oklab, var(--color-primary) 35%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

  .shell{max-width:560px;margin:0 auto;padding:14px 16px 28px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:12.5px;margin-top:2px}
  .me{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;flex:none}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--color-primary);color:var(--color-on-primary);
          display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px}

  form{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:20px}
  form h2{font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  .field{display:flex;flex-direction:column;gap:3px;min-width:0}
  .field.wide{grid-column:1 / -1}
  label{font-size:12px;font-weight:700;color:var(--color-muted)}
  input,textarea{font-family:inherit;font-size:14px;color:var(--color-ink);background:var(--color-surface);border:1px solid var(--color-line);
                 border-radius:var(--radius-sm);padding:8px 10px;width:100%;min-width:0}
  textarea{resize:vertical;min-height:58px}
  input::placeholder,textarea::placeholder{color:var(--color-muted)}
  input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--color-primary)}
  .hint{font-size:12px;color:var(--color-muted);margin-top:8px}
  .hint b{color:var(--status-warning)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:var(--radius-sm);
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);cursor:pointer}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}

  main{position:relative;padding-left:20px;min-width:0}
  main::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--color-line);border-radius:2px}
  .section{position:relative;margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--color-muted);display:flex;gap:8px;align-items:baseline}
  .section::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:2px;background:var(--color-muted)}
  .section b{font-family:var(--font-display);font-size:14px;letter-spacing:0;color:var(--color-ink);text-transform:none}

  .slot{position:relative;margin-bottom:12px}
  .slot::before{content:"";position:absolute;left:-18px;top:8px;width:9px;height:9px;border-radius:50%;
                background:var(--color-surface);border:2px solid var(--color-primary)}
  .slot.cover::before{border-color:var(--status-warning)}
  .slot.approved::before{border-color:var(--status-ok);background:var(--status-ok)}
  .slot.declined::before{border-color:var(--color-line);background:var(--color-surface-2)}

  .row{display:grid;grid-template-columns:minmax(52px,max-content) 1fr;gap:10px;align-items:start}
  .time{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums;color:var(--color-primary);padding-top:2px}
  .time small{display:block;font-size:12px;color:var(--color-muted);font-family:var(--font-body);margin-top:3px;font-weight:600;letter-spacing:0}

  .card{background:var(--color-surface);border:1px solid var(--color-line);
        border-radius:var(--radius-md);padding:11px 12px;box-shadow:var(--shadow);min-width:0}
  .card.need{border:1.5px dashed var(--status-warning);background:var(--tint-warning)}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .card .reason{font-weight:700;font-size:15px}
  .sub{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--color-muted)}
  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .pill.wait{background:var(--tint-primary);color:var(--color-primary)}
  .pill.ok{background:var(--tint-ok);color:var(--status-ok)}
  .pill.no{background:var(--color-surface-2);color:var(--color-muted)}
  .warn{margin-top:8px;font-size:12.5px;color:var(--color-ink);background:var(--color-surface);
        border:1px solid var(--status-warning);border-radius:var(--radius-sm);padding:6px 10px}
  .warn b{color:var(--status-warning)}
  .ownernote{margin-top:8px;font-size:12.5px;border-left:3px solid var(--color-line);padding:1px 0 1px 9px}
  .ownernote small{display:block;font-size:12px;color:var(--color-muted);font-weight:600}
  .cancel{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--color-primary);background:transparent;border:0;padding:6px 0 0;cursor:pointer}
  .cancel:focus-visible{outline:none;box-shadow:var(--ring);border-radius:2px}

  .note{margin-top:14px;font-size:12.5px;color:var(--color-muted)}

  @media (min-width:720px){
    .shell{max-width:960px;padding:20px 22px;display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start}
    .side{position:sticky;top:20px}
    header{flex-direction:column;gap:12px;margin-bottom:14px}
    form{margin-bottom:0}
    .note{grid-column:2;margin-top:8px;font-size:13px}
    main{padding-left:26px}
    main::before{left:8px}
    .section::before,.slot::before{left:-22px}
    .row{grid-template-columns:minmax(74px,max-content) 1fr;gap:14px}
    .time{font-size:26px}
    .card{padding:11px 14px}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="side">
    <header>
      <div><h1>Отпуск</h1><div class="day" id="day"></div></div>
      <div class="me"><span class="avatar" id="initial"></span><span id="me"></span></div>
    </header>
    <form data-form="leave" onsubmit="return false">
      <h2>Нова заявка</h2>
      <div class="grid">
        <div class="field"><label for="from">От</label><input id="from" type="date" value="2025-10-13"></div>
        <div class="field"><label for="to">До</label><input id="to" type="date" value="2025-10-13"></div>
        <div class="field wide"><label for="hours">Само часове (по избор)</label><input id="hours" type="text" placeholder="напр. 12:00–15:00"></div>
        <div class="field wide"><label for="reason">Причина (по избор)</label><textarea id="reason" placeholder="Кратко, за собственика"></textarea></div>
      </div>
      <div class="hint" id="hint"></div>
      <div class="actions"><button class="btn primary" type="submit" id="send">Изпрати заявка</button><span class="hint" style="margin:0">Собственикът одобрява.</span></div>
    </form>
  </div>

  <main id="list"></main>
  <p class="note">Заявките са подредени по дата. Ако в поискания период имаш насрочено парти, го виждаш веднага: собственикът трябва да намери заместник, преди да одобри.</p>
</div>

<script>
const D = window.PARTYFOX;
const me = D.animators.find(a => a.id === D.me);
const MONTHS = {"септ.":9,"окт.":10,"ноем.":11,"дек.":12};
const parse = s => { const m = s.match(/(\S+),\s*(\d+)\s+(\S+)/); return { dow:m[1], day:+m[2], mon:m[3], key: MONTHS[m[3]]*100 + +m[2] }; };

document.getElementById("initial").textContent = me.name[0];
document.getElementById("me").textContent = `${me.name} · ${me.role}`;
document.getElementById("day").textContent = D.day;

const mine = D.leaveRequests.filter(r => r.animator === D.me).map(r => ({...r, f: parse(r.from), t: parse(r.to)})).sort((a,b) => a.f.key - b.f.key);
const needCover = r => r.state === "pending" && (r.cover||[]).length > 0;
const pill = r => ({ pending: `<span class="pill wait">Чака отговор</span>`, approved: `<span class="pill ok">Одобрена</span>`, declined: `<span class="pill no">Отказана</span>` })[r.state];
const timeCol = r => {
  const isToday = r.from === "съб, 27 септ.";
  const range = r.f.key === r.t.key ? `${r.f.day}` : `${r.f.day}–${r.t.day}`;
  return `<div class="time">${range}<small>${isToday ? "днес" : r.f.mon}</small></div>`;
};

document.getElementById("list").innerHTML = `<div class="section"><b>Моите заявки</b><span>${mine.length}</span></div>` + mine.map(r => `
  <div class="slot ${needCover(r) ? "cover" : r.state}" data-leave="${r.id}"><div class="row">
    ${timeCol(r)}
    <div class="card${needCover(r) ? " need" : ""}">
      <div class="head"><span class="reason">${r.reason || "Отпуск"}</span>${pill(r)}</div>
      <div class="sub"><span>${r.hours ? `${r.from} · ${r.hours}` : `${r.from} – ${r.to}`}</span>${r.days ? `<span>${r.days} ${r.days===1?"ден":"дни"}</span>` : ""}<span>изпратена ${r.sent}</span></div>
      ${(r.cover||[]).map(c => `<div class="warn" data-cover="${r.id}"><b>Имаш парти в този период:</b> ${c.booking} · ${c.when}. Собственикът ще търси заместник, преди да одобри.</div>`).join("")}
      ${r.ownerNote ? `<div class="ownernote"><small>Бележка на собственика</small>${r.ownerNote}</div>` : ""}
      ${r.state === "pending" ? `<button class="cancel" type="button">Оттегли заявката</button>` : ""}
    </div>
  </div></div>`).join("");

// The form is a mockup: it only warns about a party that falls inside the chosen days.
const partiesOn = { "2025-10-05": "Ния, 4 г. · Балони, 10:30" };
const hint = document.getElementById("hint");
function check(){
  const from = document.getElementById("from").value, to = document.getElementById("to").value;
  const hit = Object.keys(partiesOn).find(d => d >= from && d <= to);
  hint.innerHTML = hit ? `<b>Имаш парти в този период:</b> ${partiesOn[hit]}. Собственикът ще търси заместник.` : "В избраните дни нямаш насрочено парти.";
}
check();
document.getElementById("from").addEventListener("input", check);
document.getElementById("to").addEventListener("input", check);
document.getElementById("send").addEventListener("click", e => { e.target.textContent = "Изпратена (демо)"; e.target.disabled = true; });
</script>
</body>
</html>
