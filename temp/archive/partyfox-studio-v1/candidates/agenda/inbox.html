<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Входящи поръчки</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Agenda candidate · owner · order inbox. Every color, font and radius comes from the studio world. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 12%, var(--color-surface));
    --tint-primary:color-mix(in oklab, var(--color-primary) 10%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 8%, transparent);
    --ring:0 0 0 3px color-mix(in oklab, var(--color-primary) 35%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .shell{max-width:960px;margin:0 auto;padding:20px 22px;display:grid;grid-template-columns:220px 1fr;gap:26px}

  aside{position:sticky;top:20px;align-self:start}
  h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:12.5px;margin:2px 0 18px}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-line);font-size:13px}
  .stat b{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
  .stat.amber b{color:var(--status-warning)}
  .stat.ok b{color:var(--status-ok)}

  .filters{margin-top:16px;display:flex;flex-direction:column;gap:4px}
  .chip{font-family:inherit;font-size:13px;font-weight:600;text-align:left;padding:6px 10px;border-radius:var(--radius-sm);
        border:1px solid transparent;background:transparent;color:var(--color-ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .chip small{color:var(--color-muted);font-weight:600;font-size:12px}
  .chip[aria-pressed="true"]{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
  .chip[aria-pressed="true"] small{color:var(--color-on-primary)}
  .chip:hover:not([aria-pressed="true"]){background:var(--color-surface-2)}
  .chip:focus-visible,.btn:focus-visible{outline:none;box-shadow:var(--ring)}

  .legend{margin-top:16px;font-size:12px;color:var(--color-muted);display:flex;flex-direction:column;gap:8px}
  .legend span{display:flex;align-items:center;gap:7px}
  .lg{width:12px;height:12px;border-radius:var(--radius-sm);flex:none}
  .lg-new{background:var(--color-primary)}
  .lg-need{background:var(--tint-warning);border:1px solid var(--status-warning)}
  .lg-sched{background:var(--tint-ok);border:1px solid var(--status-ok)}

  main{position:relative;padding-left:26px;min-width:0}
  main::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--color-line);border-radius:2px}

  .date{position:relative;margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--color-muted);display:flex;align-items:baseline;gap:8px}
  .date::before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:2px;background:var(--color-muted)}
  .date b{font-family:var(--font-display);font-size:14px;letter-spacing:0;color:var(--color-ink);text-transform:none}
  .slot + .date{margin-top:22px}

  .slot{position:relative;margin-bottom:14px}
  .slot::before{content:"";position:absolute;left:-22px;top:8px;width:9px;height:9px;border-radius:50%;
                background:var(--color-surface);border:2px solid var(--color-primary)}
  .slot.amber::before{border-color:var(--status-warning)}
  .slot.ok::before{border-color:var(--status-ok)}

  .row{display:grid;grid-template-columns:minmax(74px,max-content) 1fr;gap:14px;align-items:start}
  .time{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;
        font-variant-numeric:tabular-nums;color:var(--color-primary);padding-top:2px}
  .time small{display:block;font-size:12px;color:var(--color-muted);font-family:var(--font-body);margin-top:3px;font-weight:600}

  .card{background:var(--color-surface);border:1px solid var(--color-line);
        border-radius:var(--radius-md);padding:11px 14px;box-shadow:var(--shadow);min-width:0}
  .card.need{border:1.5px dashed var(--status-warning);background:var(--tint-warning)}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card .child{font-weight:700;font-size:15px}
  .head .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pkg{font-size:11px;font-weight:700;color:var(--color-secondary);background:var(--color-secondary-soft);border-radius:var(--radius-sm);padding:2px 8px}
  .received{font-size:12px;color:var(--color-muted);white-space:nowrap}
  .sub{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--color-muted)}
  .sub .who{color:var(--color-ink);font-weight:600}
  .addr{margin-top:5px;font-size:12px;color:var(--color-muted)}
  .quote{margin-top:7px;font-size:12.5px;color:var(--color-ink);border-left:3px solid var(--color-line);padding:1px 0 1px 9px}

  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .pill.new{background:var(--color-primary);color:var(--color-on-primary)}
  .pill.amber{background:var(--tint-warning);color:var(--status-warning);border:1px solid var(--status-warning)}
  .pill.ok{background:var(--tint-ok);color:var(--status-ok)}
  .pill.big{background:var(--color-tertiary-soft);color:var(--color-tertiary)}

  .warn{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--status-warning);background:var(--color-surface);
        border:1px solid var(--status-warning);border-radius:var(--radius-sm);padding:6px 10px;display:flex;gap:8px;align-items:flex-start}
  .warn .tag{flex:none;background:var(--status-warning);color:var(--color-surface);border-radius:var(--radius-sm);padding:1px 7px;font-size:11px;font-weight:800;margin-top:1px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:var(--radius-sm);
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);cursor:pointer}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
  .btn.amber{border-color:var(--status-warning);color:var(--status-warning)}

  .note{margin-top:8px;font-size:13px;color:var(--color-muted);grid-column:2}
  .empty{color:var(--color-muted);font-size:13px;font-style:italic;padding:8px 0}

  @media (max-width:640px){
    .shell{grid-template-columns:1fr;padding:14px;gap:14px}
    aside{position:static}
    .stats{display:flex;gap:16px;flex-wrap:wrap}
    .stat{border:0;padding:4px 0;gap:6px}
    .filters{flex-direction:row;flex-wrap:wrap;margin-top:10px}
    .chip{padding:5px 9px;font-size:12.5px}
    .legend{display:none}
    main{padding-left:20px;margin-top:4px}
    main::before{left:6px}
    .date::before,.slot::before{left:-18px}
    .row{grid-template-columns:minmax(52px,max-content) 1fr;gap:10px}
    .time{font-size:20px}
    .card{padding:10px 12px}
    .received{white-space:normal}
    .note{grid-column:1}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div><h1>Входящи поръчки</h1><div class="day" id="day"></div></div>
    <div class="stats">
      <div class="stat"><span>Нови от сайта</span><b id="s-new"></b></div>
      <div class="stat amber"><span>Искат внимание</span><b id="s-attn"></b></div>
      <div class="stat ok"><span>Насрочени</span><b id="s-sched"></b></div>
    </div>
    <div class="filters" role="group" aria-label="Филтър">
      <button class="chip" data-filter="all" aria-pressed="true">Всички <small id="c-all"></small></button>
      <button class="chip" data-filter="new" aria-pressed="false">Нови <small id="c-new"></small></button>
      <button class="chip" data-filter="attn" aria-pressed="false">Искат внимание <small id="c-attn"></small></button>
      <button class="chip" data-filter="scheduled" aria-pressed="false">Насрочени <small id="c-sched"></small></button>
    </div>
    <div class="legend">
      <span><i class="lg lg-new"></i> Нова поръчка</span>
      <span><i class="lg lg-need"></i> Липсва адрес / застъпване</span>
      <span><i class="lg lg-sched"></i> Насрочено</span>
    </div>
  </aside>

  <main id="list"></main>
  <p class="note">Поръчките са подредени по датата на партито, за да се вижда кое идва първо. Датите с две поръчки в един час показват откъде идва застъпването.</p>
</div>

<script>
const D = window.PARTYFOX;
const anim = id => D.animators.find(a=>a.id===id);
const MONTHS = {"септ.":9,"окт.":10,"ноем.":11,"дек.":12};
const MONTH_LONG = {"септ.":"септември","окт.":"октомври","ноем.":"ноември","дек.":"декември"};
const DAY_LONG = {"пон":"Понеделник","вт":"Вторник","ср":"Сряда","чет":"Четвъртък","пет":"Петък","съб":"Събота","нед":"Неделя"};
const parseDate = s => { const m = s.match(/(\S+),\s*(\d+)\s+(\S+)/); return { dow:m[1], day:+m[2], mon:m[3], key: MONTHS[m[3]]*100 + +m[2] }; };
const attn = o => o.state === "needs-info" || o.state === "clash";

const orders = [...D.orders].map(o => ({...o, d: parseDate(o.date)}))
  .sort((a,b) => a.d.key - b.d.key || a.time.localeCompare(b.time) || a.id.localeCompare(b.id));

const counts = { all: orders.length, new: orders.filter(o=>o.state==="new").length,
  attn: orders.filter(attn).length, scheduled: orders.filter(o=>o.state==="scheduled").length };
document.getElementById("day").textContent = `${counts.all} поръчки от сайта · по дата на партито`;
document.getElementById("s-new").textContent = counts.new;
document.getElementById("s-attn").textContent = counts.attn;
document.getElementById("s-sched").textContent = counts.scheduled;
document.getElementById("c-all").textContent = counts.all;
document.getElementById("c-new").textContent = counts.new;
document.getElementById("c-attn").textContent = counts.attn;
document.getElementById("c-sched").textContent = counts.scheduled;

const statePill = o => ({
  "new": `<span class="pill new">Нова</span>`,
  "needs-info": `<span class="pill amber">Липсва адрес</span>`,
  "clash": `<span class="pill amber">Застъпване</span>`,
  "scheduled": `<span class="pill ok">Насрочено · ${anim(o.animator)?.name || ""}</span>`,
})[o.state];

function render(filter){
  const shown = orders.filter(o => filter==="all" || (filter==="attn" ? attn(o) : o.state===filter));
  let html = "", lastKey = null;
  for (const o of shown){
    if (o.d.key !== lastKey){
      const same = shown.filter(x => x.d.key === o.d.key).length;
      html += `<div class="date"><b>${DAY_LONG[o.d.dow]}, ${o.d.day} ${MONTH_LONG[o.d.mon]}</b><span>${same} ${same===1?"поръчка":"поръчки"}</span></div>`;
      lastKey = o.d.key;
    }
    const slotCls = attn(o) ? "amber" : o.state==="scheduled" ? "ok" : "";
    html += `<div class="slot ${slotCls}" data-order="${o.id}"><div class="row">
      <div class="time">${o.time}<small>${o.guests} гости</small></div>
      <div class="card${attn(o)?" need":""}">
        <div class="head">
          <div class="left"><span class="child">${o.child}, ${o.age} г.</span><span class="pkg">${o.package}</span>${statePill(o)}${o.large?`<span class="pill big">Голямо парти</span>`:""}</div>
          <span class="received">получена ${o.received} · ${o.id}</span>
        </div>
        <div class="sub"><span class="who">${o.parent}</span><span>${o.phone}</span>${o.customer?`<span>клиент ${o.customer}</span>`:`<span>нов клиент</span>`}</div>
        ${o.address ? `<div class="addr" title="${o.address}">${o.address}</div>`
                    : `<div class="warn"><span class="tag">Без адрес</span><span>Родителят още не е пратил адрес. Без адрес аниматорът няма къде да отиде.</span></div>`}
        ${o.clashNote ? `<div class="warn"><span class="tag">Застъпване</span><span>${o.clashNote}</span></div>` : ""}
        ${o.note ? `<div class="quote">„${o.note}“</div>` : ""}
        <div class="actions">
          ${o.state==="scheduled" ? `<button class="btn">Отвори партито</button>` : `<button class="btn primary">Насрочи</button>`}
          ${o.state==="needs-info" ? `<button class="btn amber">Поискай адрес</button>` : ""}
          ${o.state==="clash" ? `<button class="btn amber">Предложи друг час</button>` : ""}
          <button class="btn">Обади се</button>
        </div>
      </div>
    </div></div>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="empty">Няма поръчки в този филтър.</div>`;
}
render("all");
document.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b===btn)));
  render(btn.dataset.filter);
}));
</script>
</body>
</html>
