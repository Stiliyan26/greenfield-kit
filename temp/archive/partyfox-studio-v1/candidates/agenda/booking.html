<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Парти</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  /* Agenda candidate · owner · one booking as a timeline from order to pay. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-ok:color-mix(in oklab, var(--status-ok) 12%, var(--color-surface));
    --tint-primary:color-mix(in oklab, var(--color-primary) 10%, var(--color-surface));
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 8%, transparent);
    --ring:0 0 0 3px color-mix(in oklab, var(--color-primary) 35%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .shell{max-width:960px;margin:0 auto;padding:20px 22px;display:grid;grid-template-columns:250px 1fr;gap:26px}

  aside{position:sticky;top:20px;align-self:start}
  .crumb{font-size:12px;color:var(--color-muted);margin-bottom:6px}
  .crumb a{color:var(--color-primary);font-weight:600;text-decoration:none}
  .crumb a:focus-visible{outline:none;box-shadow:var(--ring);border-radius:2px}
  h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:12.5px;margin:2px 0 14px}
  .when{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
  .when b{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--color-primary);font-variant-numeric:tabular-nums;line-height:1}
  .when span{font-size:12.5px;color:var(--color-muted);font-weight:600}

  .dep{border:2px solid var(--status-danger);background:var(--tint-danger);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:14px}
  .dep .pill{margin-bottom:5px}
  .dep p{font-size:12.5px;color:var(--color-ink)}

  .facts{border-top:1px solid var(--color-line)}
  .fact{display:grid;grid-template-columns:82px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--color-line);font-size:13px}
  .fact span{color:var(--color-muted);font-size:12px;font-weight:600;padding-top:1px}
  .fact b{font-weight:600}
  .fact small{display:block;font-size:12px;color:var(--color-muted);font-weight:500}
  .fact a{color:var(--color-primary);text-decoration:none;font-weight:600}

  main{position:relative;padding-left:26px;min-width:0}
  main::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--color-line);border-radius:2px}
  .section{position:relative;margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--color-muted)}
  .section::before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:2px;background:var(--color-muted)}

  .slot{position:relative;margin-bottom:12px}
  .slot::before{content:"";position:absolute;left:-22px;top:8px;width:9px;height:9px;border-radius:50%;
                background:var(--color-surface);border:2px solid var(--color-primary)}
  .slot.done::before{background:var(--color-primary)}
  .slot.missing::before{background:var(--status-danger);border-color:var(--status-danger)}
  .slot.next::before{background:var(--color-tertiary);border-color:var(--color-tertiary);box-shadow:0 0 0 4px color-mix(in oklab, var(--color-primary) 15%, transparent)}
  .slot.todo::before{border-color:var(--color-line)}

  .row{display:grid;grid-template-columns:minmax(74px,max-content) 1fr;gap:14px;align-items:start}
  .time{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;
        font-variant-numeric:tabular-nums;color:var(--color-primary);padding-top:2px}
  .time.muted{color:var(--color-muted)}
  .time.red{color:var(--status-danger)}
  .time small{display:block;font-size:12px;color:var(--color-muted);font-family:var(--font-body);margin-top:3px;font-weight:600}

  .card{background:var(--color-surface);border:1px solid var(--color-line);
        border-radius:var(--radius-md);padding:10px 14px;box-shadow:var(--shadow);min-width:0}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card .title{font-weight:700;font-size:15px}
  .slot.done .card{padding:8px 14px}
  .slot.done .title{font-size:14px}
  .slot.done .title::before{content:"✓ ";color:var(--status-ok)}
  .card.missing{border:2px solid var(--status-danger);background:var(--tint-danger)}
  .card.next{border:1.5px solid var(--color-tertiary);background:var(--color-tertiary-soft)}
  .card.todo{border:1px dashed var(--color-line);background:transparent;box-shadow:none;color:var(--color-muted)}
  .sub{margin-top:5px;font-size:12.5px;color:var(--color-muted)}

  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block}
  .pill.red{background:var(--status-danger);color:var(--color-surface)}   /* the only solid red */
  .pill.ok{background:var(--tint-ok);color:var(--status-ok)}
  .pill.soft{background:var(--color-surface-2);color:var(--color-muted)}
  .pill.next{background:var(--color-tertiary);color:var(--color-on-tertiary)}

  .attach{margin-top:8px;border-top:1px solid var(--color-line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
  .msg{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12.5px}
  .msg .meta{color:var(--color-muted);font-size:12px;font-weight:600}
  .msg .meta b{display:block;color:var(--color-ink)}
  .msg .text{border-left:3px solid var(--color-line);padding-left:9px}
  .prov{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12.5px;align-items:center}
  .prov small{color:var(--color-muted);display:block;font-size:12px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:var(--radius-sm);
       border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);cursor:pointer}
  .btn.primary{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
  .btn.danger{background:var(--status-danger);color:var(--color-surface);border-color:var(--status-danger)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn:disabled{opacity:.55;cursor:default}

  .note{margin-top:8px;font-size:13px;color:var(--color-muted);grid-column:2}
  .note b{color:var(--status-danger)}

  @media (max-width:640px){
    .shell{grid-template-columns:1fr;padding:14px;gap:14px}
    aside{position:static}
    .facts{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .fact{grid-template-columns:1fr;gap:1px}
    .fact.wide{grid-column:1 / -1}
    main{padding-left:20px}
    main::before{left:6px}
    .section::before,.slot::before{left:-18px}
    .row{grid-template-columns:minmax(52px,max-content) 1fr;gap:10px}
    .time{font-size:20px}
    .card{padding:10px 12px}
    .msg{grid-template-columns:1fr;gap:3px}
    .note{grid-column:1}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="crumb"><a href="#">← Графикът на деня</a> · парти <span id="bid"></span></div>
    <h1 id="title"></h1>
    <div class="day" id="day"></div>
    <div class="when"><b id="when-time"></b><span id="when-date"></span></div>

    <div class="dep" data-booking="b5" data-part="deposit">
      <span class="pill red">Депозит липсва</span>
      <p id="dep-note"></p>
    </div>

    <div class="facts" id="facts"></div>
  </aside>

  <main id="timeline"></main>
  <p class="note">Всичко за партито стои в един ред по време: от поръчката до заплащането. Червено е само <b>липсващият депозит</b>; собственикът го отбелязва като получен от този екран.</p>
</div>

<script>
const D = window.PARTYFOX;
const B = D.booking;
const party = D.bookings.find(b => b.id === B.id);
const animator = D.animators.find(a => a.id === party.animator);

document.getElementById("bid").textContent = B.id;
document.getElementById("title").textContent = `${party.child}, ${party.age} г. · ${party.package}`;
document.getElementById("day").textContent = `${D.day} · поръчка ${B.order}`;
document.getElementById("when-time").textContent = `${party.start}:00`;
document.getElementById("when-date").textContent = `до ${party.end}:00 · днес`;
document.getElementById("dep-note").textContent = B.depositNote;

document.getElementById("facts").innerHTML = [
  ["Родител", `<b>${B.parent}</b><small><a href="tel:${B.phone.replace(/\s/g,"")}">${B.phone}</a> · <a href="mailto:${B.email}">${B.email}</a></small>`, "wide"],
  ["Гости", `<b>${B.guests}</b>`],
  ["Аниматор", `<b>${animator.name}</b><small>${animator.role}</small>`],
  ["Адрес", `<b>${party.address}</b><small>${B.addressNote}</small>`, "wide"],
  ["Клиент", `<b>${D.customers.find(c=>c.id===B.customer)?.family || "—"}</b><small>${B.customer} · повтарящо се семейство</small>`],
].map(([k,v,cls]) => `<div class="fact ${cls||""}"><span>${k}</span><div>${v}</div></div>`).join("");

// Parse "12 септ., 19:20" / "13 септ." / "днес, 16:00" into the big numeral + small line.
function timeCol(step){
  if (!step.when){
    if (step.state === "missing") return `<div class="time red">—<small>не е получен</small></div>`;
    return `<div class="time muted">·<small>предстои</small></div>`;
  }
  const today = step.when.match(/^днес,\s*(\d+:\d+)/);
  if (today) return `<div class="time">${today[1]}<small>днес</small></div>`;
  const m = step.when.match(/(\d+)\s+(\S+?)\.?(?:,\s*(\d+:\d+))?$/);
  return `<div class="time">${m[1]}<small>${m[2]}.${m[3] ? " · " + m[3] : ""}</small></div>`;
}

const messages = B.messages;
const attachments = {
  3: `<div class="attach">${messages.slice(0,1).map(msg).join("")}</div>`,
  4: `<div class="attach">${B.providers.map(p => `<div class="prov"><div>${p.what}<small>${p.who}</small></div><span class="pill ${p.state==="Потвърдено"?"ok":"soft"}">${p.state}</span></div>`).join("")}</div>`,
  5: `<div class="sub">${B.depositNote} Без получен депозит партито остава под въпрос до самия ден.</div>
      <div class="actions"><button class="btn primary" data-action="deposit-received">Отбележи депозита като получен</button><button class="btn">Изпрати ново напомняне</button></div>
      <div class="attach">${messages.slice(1).map(msg).join("")}</div>`,
  6: `<div class="sub">${party.start}:00–${party.end}:00 · ${animator.name} · ${party.address}. ${B.addressNote}</div>
      <div class="actions"><button class="btn">Прати адреса на ${animator.name}</button><button class="btn">Напомни на родителя</button></div>`,
  7: `<div class="sub">След партито: кратко съобщение до родителя с молба за отзив.</div>`,
  8: `<div class="sub">Влиза в заплащането на ${animator.name} за месеца. Дялът на аниматора не е зададен.</div>`,
};
function msg(m){
  return `<div class="msg"><div class="meta"><b>${m.channel}</b>${m.when}</div><div class="text">${m.text}</div></div>`;
}
const statePill = { done: "", missing: `<span class="pill red">Депозит липсва</span>`, next: `<span class="pill next">Днес</span>`, todo: `<span class="pill soft">Предстои</span>` };

let html = `<div class="section">Ход на партито · ${B.steps.filter(s=>s.state==="done").length} от ${B.steps.length} стъпки</div>`;
B.steps.forEach((s, i) => {
  html += `<div class="slot ${s.state}" data-booking="${B.id}" data-step="${i}"><div class="row">
    ${timeCol(s)}
    <div class="card ${s.state}">
      <div class="head"><span class="title">${s.label}</span>${statePill[s.state]}</div>
      ${attachments[i] || ""}
    </div>
  </div></div>`;
});
document.getElementById("timeline").innerHTML = html;

document.querySelector('[data-action="deposit-received"]').addEventListener("click", e => {
  e.currentTarget.textContent = "Отбелязано като получено (демо)";
  e.currentTarget.disabled = true;
});
</script>
</body>
</html>
