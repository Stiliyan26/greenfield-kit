<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Table candidate review</title>
    <link rel="stylesheet" href="/studio/styles.css" />
    <style>
      body { margin: 0; padding: 24px; background: #f4f3ee; font-family: "Manrope", Arial, sans-serif; }
      .row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 24px; }
      .col { flex: 1 1 0; min-width: 0; }
      .col h1 { font-size: 12px; font-weight: 800; color: #6b7a76; margin: 0 0 8px; }
      .preview-shell { min-height: 0; }
      .preview-app { min-height: 0; }
      .preview-shell.is-phone { width: 440px; flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="col">
        <h1>Calendar, desktop</h1>
        <div class="preview-shell"><div class="preview" id="calendar"></div></div>
      </div>
      <div class="col preview-shell is-phone" style="padding: 12px">
        <div class="preview" id="phone"></div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <h1>Booking</h1>
        <div class="preview-shell"><div class="preview" id="booking"></div></div>
      </div>
      <div class="col">
        <h1>Animator</h1>
        <div class="preview-shell"><div class="preview" id="animator"></div></div>
      </div>
    </div>
    <script type="module">
      import { calendar, booking, animator } from "/studio/candidates/table/markup.js"

      const tokens =
        "--brand:hsl(222 63% 40%);--brand-ink:#fff;--brand-two:hsl(194 54% 48%);" +
        "--brand-three:hsl(250 45% 54%);--brand-pale:hsl(222 40% 94%);"

      const app = (html) =>
        `<div class="preview-app table comfortable font-plex" style="${tokens}">${html}</div>`

      document.getElementById("calendar").innerHTML = app(calendar())
      document.getElementById("phone").innerHTML = app(calendar())
      document.getElementById("booking").innerHTML = app(booking())
      document.getElementById("animator").innerHTML = app(animator())
    </script>
  </body>
</html>
