<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Клиенти</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<link rel="stylesheet" href="./pf.css">
<script src="./pf.js"></script>
<style>
  .search { position: relative; width: 460px; max-width: 100%; }
  .search svg.i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--color-muted); }
  .search .input { padding-left: 40px; min-height: 46px; font-size: 15.5px; }
  .layout { display: grid; grid-template-columns: 470px minmax(0, 1fr) 390px; gap: 22px; align-items: start; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 12px; border-bottom: 1.5px solid var(--color-ink); }
  .filters button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--radius-pill); border: 1.5px solid var(--color-line); background: var(--color-surface); font-weight: 800; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .filters button[aria-pressed="true"] { border-color: var(--color-ink); background: var(--color-ink); color: var(--color-surface); }
  .filters button[aria-pressed="true"] .count { background: var(--color-surface); color: var(--color-ink); }
  .fam { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--color-line); text-decoration: none; align-items: center; }
  .fam:last-child { border-bottom: 0; border-radius: 0 0 var(--radius-md) var(--radius-md); }
  .fam b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .fam .kids { font-size: 13.5px; color: var(--color-muted); font-weight: 600; }
  .fam .n { grid-row: span 2; text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .fam .n small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 800; color: var(--color-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .fam .marks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .fam .marks .tag { font-size: 11.5px; padding: 3px 6px; }
  .fam[aria-current="true"] { background: var(--color-primary-soft); box-shadow: inset 4px 0 0 var(--color-primary); }

  .profile { display: grid; gap: 16px; }
  .pf-head { padding: 18px 20px 0; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .pf-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 42px; line-height: 0.95; }
  .pf-head p { font-size: 14px; color: var(--color-muted); font-weight: 600; margin-top: 4px; }
  .pf-head .contact { margin-left: auto; display: grid; gap: 4px; justify-items: end; font-size: 14px; font-weight: 700; }
  .pf-head .contact a { display: inline-flex; gap: 6px; align-items: center; text-underline-offset: 3px; }
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 16px 0 0; border-top: 1.5px solid var(--color-ink); }
  .strip > div { padding: 12px 20px 14px; border-right: 1px solid var(--color-line); }
  .strip > div:last-child { border-right: 0; }
  .strip dt { font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-muted); }
  .strip dd { margin: 4px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; }
  .strip dd small { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--color-muted); display: block; margin-top: 3px; }
  .note { margin: 0 20px 16px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--color-surface-2); font-size: 14.5px; font-weight: 600; display: flex; gap: 8px; align-items: flex-start; }

  .kids-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--color-line); }
  .kid { display: flex; gap: 12px; align-items: center; padding: 12px 20px; }
  .kid + .kid { border-left: 1px solid var(--color-line); }
  .kid b { font-size: 16px; display: block; }
  .kid span { font-size: 13.5px; color: var(--color-muted); font-weight: 600; }

  .timeline { padding: 0 20px 10px; }
  .ev { display: grid; grid-template-columns: 90px 18px minmax(0, 1fr) auto; gap: 12px; align-items: start; position: relative; padding: 8px 0; }
  .ev .d { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; text-align: right; }
  .ev .d small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--color-muted); }
  .ev .rail { position: relative; align-self: stretch; }
  .ev .rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -8px; width: 2px; background: var(--color-line); }
  .ev:last-child .rail::before { bottom: 50%; }
  .ev .rail::after { content: ""; position: absolute; left: 3px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-surface); border: 2px solid var(--color-ink); }
  .ev.future .rail::after { background: var(--color-primary); border-color: var(--color-primary); }
  .ev.order .rail::after { border-style: dashed; border-color: var(--status-warning); }
  .ev b { font-size: 15px; display: block; }
  .ev .meta { font-size: 13.5px; color: var(--color-muted); font-weight: 600; }
  .ev .tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .sec-label { padding: 12px 20px 6px; border-top: 1.5px solid var(--color-ink); }

  .bdays .panel-head p { font-size: 13px; color: var(--color-muted); font-weight: 600; width: 100%; }
  .bdays .panel-head { flex-wrap: wrap; }
  .bd { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding: 9px 16px; border-top: 1px solid var(--color-line); align-items: center; }
  .bd .date-tile { grid-row: span 2; width: 46px; height: 50px; }
  .bd .date-tile span { font-size: 25px; }
  .bd b { font-size: 15px; }
  .bd .fam-name { font-size: 13px; color: var(--color-muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd .st { grid-column: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .bd.open { background: color-mix(in oklab, var(--color-tertiary-soft) 60%, var(--color-surface)); }
  .bd-label { padding: 10px 16px 6px; border-top: 1.5px solid var(--color-ink); }
  .panel-head + .bd-label { border-top: 0; padding-top: 2px; }
  .list-b.booked .bd { padding-top: 6px; padding-bottom: 6px; }
  .list-b.booked .bd .fam-name { display: none; }
  .list-b.booked:last-child .bd:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }

  @media (max-width: 1600px) {
    .layout { grid-template-columns: 330px minmax(0, 1fr) 300px; gap: 18px; }
    .page-head h1 { font-size: 44px; }
    .search { width: 380px; }
    .fam { padding: 8px 12px; }
    .fam .marks { display: none; }
    .pf-head h2 { font-size: 34px; }
    .pf-head .contact { margin-left: 0; justify-items: start; grid-auto-flow: column; gap: 14px; }
    .strip dd { font-size: 25px; }
    .strip > div { padding: 10px 14px 12px; }
    .kid { padding: 10px 14px; }
    .timeline { padding: 0 14px 8px; }
    .ev { grid-template-columns: 70px 18px minmax(0, 1fr); padding: 6px 0; }
    .ev .tags { grid-column: 3; justify-content: flex-start; }
    .sec-label { padding: 10px 14px 4px; }
    .note { margin: 0 14px 14px; }
    .bd { padding: 7px 12px; }
    .bd .fam-name { display: none; }
  }
  @media (max-width: 720px) {
    .page-head .head-end { width: 100%; margin-left: 0; }
    .search { width: 100%; }
    .layout { display: flex; flex-direction: column; gap: 14px; }
    .layout > * { min-width: 0; max-width: 100%; }
    .bdays .list-b.booked, .booked-label { display: none; }
    .profile { display: none; }
    .bdays { order: -1; }
    .bdays .list-b { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; overflow-x: auto; gap: 8px; padding: 0 12px 12px; }
    .bd { border: 1.5px solid var(--color-line); border-radius: var(--radius-sm); padding: 8px; grid-template-columns: auto minmax(0, 1fr); }
    .bd .st { grid-column: 1 / -1; }
    .bd .st .tag { font-size: 11.5px; }
    .bdays .panel-head p { display: none; }
    .filters { overflow: hidden; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Клиенти</h1>
        <p data-summary></p>
      </div>
      <div class="head-end">
        <label class="search" data-search><input class="input" type="search" aria-label="Търсене в клиентите" placeholder="Търси семейство, телефон или дете"></label>
      </div>
    </div>
    <div class="layout">
      <section class="panel" data-families aria-label="Семейства"></section>
      <section class="profile" data-profile aria-label="Избрано семейство"></section>
      <aside class="panel bdays" data-birthdays aria-label="Рождени дни скоро"></aside>
    </div>
  </main>
</div>
<script>
(() => {
  const { D, esc, date, customer, animator, booking, tag, unset, dateTile, icon, parse, iso, diff, fromToday, chip } = PF
  PF.shell("owner", "customers")
  const SELECTED = "c4"
  const LARGE = 25

  document.querySelector("[data-search]").insertAdjacentHTML("afterbegin", PF.icon("search"))

  // Parties per family: earlier history plus this season's bookings.
  const partiesOf = (c) => [
    ...D.history.filter((h) => h.customerId === c.id).map((h) => ({ date: h.date, child: h.child, program: h.program, children: h.children, kind: "past" })),
    ...D.bookings.filter((b) => b.customerId === c.id).map((b) => ({ date: b.date, child: b.child.name, program: b.program, children: b.children, kind: b.stage === "done" ? "past" : "future", b })),
  ].sort((a, b) => b.date.localeCompare(a.date))
  const ageNow = (bd) => { const t = parse(D.today), b = parse(bd); let a = t.getUTCFullYear() - b.getUTCFullYear(); if (iso(t).slice(5) < bd.slice(5)) a--; return a }
  const nextBday = (bd) => { let y = parse(D.today).getUTCFullYear(); let n = `${y}${bd.slice(4)}`; if (n < D.today) n = `${y + 1}${bd.slice(4)}`; return { date: n, turns: Number(n.slice(0, 4)) - Number(bd.slice(0, 4)), inDays: diff(D.today, n) } }
  const since = (d) => `${date.month(d).slice(0, 3)} ${d.slice(0, 4)}`

  const fams = D.customers.map((c) => {
    const parties = partiesOf(c)
    const kids = c.children.map((k) => ({ ...k, age: ageNow(k.birthday), next: nextBday(k.birthday) }))
    const soon = kids.filter((k) => k.next.inDays <= 30).sort((a, b) => a.next.inDays - b.next.inDays)
    return { c, parties, kids, soon, repeat: parties.length >= 2, large: parties.some((p) => p.children >= LARGE), maxKids: Math.max(0, ...parties.map((p) => p.children)) }
  })
  const repeatN = fams.filter((f) => f.repeat).length
  const largeN = fams.filter((f) => f.large).length
  const soonN = fams.filter((f) => f.soon.length).length
  document.querySelector("[data-summary]").textContent = `${fams.length} семейства · ${repeatN} се връщат · ${largeN} с партита над ${LARGE} деца.`

  const sorted = [...fams].sort((a, b) => b.parties.length - a.parties.length || a.c.parent.localeCompare(b.c.parent, "bg"))
  document.querySelector("[data-families]").innerHTML = `
    <div class="panel-head"><h2>Семейства</h2></div>
    <div class="filters" role="group" aria-label="Филтър">
      <button type="button" aria-pressed="true" data-filter="all">Всички <span class="count">${fams.length}</span></button>
      <button type="button" aria-pressed="false" data-filter="repeat">${icon("repeat")}Връщат се <span class="count">${repeatN}</span></button>
      <button type="button" aria-pressed="false" data-filter="large">${icon("users")}${LARGE}+ деца <span class="count">${largeN}</span></button>
      <button type="button" aria-pressed="false" data-filter="birthday">${icon("cake")}Рожден ден <span class="count">${soonN}</span></button>
    </div>
    ${sorted.map((f) => `<a class="fam" href="#" data-customer="${f.c.id}"${f.c.id === SELECTED ? ' aria-current="true"' : ""}>
      <div><b>${esc(f.c.parent)}</b><span class="kids">${f.kids.map((k) => `${esc(k.name)} ${k.age}`).join(" · ")} · ${esc(f.c.district)}</span>
        <div class="marks">${f.repeat ? tag("primary", "връщат се", "repeat") : tag("neutral", "ново")}${f.large ? tag("neutral", `до ${f.maxKids} деца`, "users") : ""}${f.soon.length ? tag("neutral", `${f.soon[0].name} · ${date.dm(f.soon[0].next.date)}`, "cake") : ""}</div></div>
      <span class="n">${f.parties.length}<small>${f.parties.length === 1 ? "парти" : "партита"}</small></span></a>`).join("")}`

  // Profile: parties, children and next birthday first. No money: it isn't known.
  const f = fams.find((x) => x.c.id === SELECTED)
  const c = f.c
  const nextKid = [...f.kids].sort((a, b) => a.next.inDays - b.next.inDays)[0]
  const orders = D.orders.filter((o) => o.customerId === c.id && o.status === "new")
  const events = [
    ...orders.map((o) => ({ date: o.wantedDate, html: `<div class="ev order future" data-order="${o.id}"><span class="d">${date.dm(o.wantedDate)}<small>${o.wantedDate.slice(0, 4)}</small></span><span class="rail"></span><div><b>${esc(o.child.name)}, ${o.child.age} г. · ${esc(o.program)}</b><span class="meta">Заявка от сайта ${date.stamp(o.receivedAt)} · ${o.children} деца · „${esc(o.message)}“</span></div><div class="tags">${tag("warning", "Без отговор", "mail")}</div></div>` })),
    ...f.parties.map((p) => {
      const b = p.b
      const crew = b ? b.animators.map((id) => animator(id).short).join(", ") : ""
      const tags = b ? (b.deposit.status === "missing" ? tag("danger", "Няма капаро", "coin") : p.kind === "future" ? tag("ok", "Капаро", "check") : "") : ""
      return { date: p.date, html: `<div class="ev ${p.kind}"${b ? ` data-booking="${b.id}"` : ` data-history="${p.date}"`}><span class="d">${date.dm(p.date)}<small>${p.date.slice(0, 4)}</small></span><span class="rail"></span><div><b>${esc(p.child)} · ${esc(p.program)}</b><span class="meta">${p.children} деца${crew ? ` · ${esc(crew)}` : ""}${p.kind === "future" ? ` · ${esc(date.rel(p.date))}` : ""}</span></div><div class="tags">${tags}</div></div>` }
    }),
  ].sort((a, b) => b.date.localeCompare(a.date))
  const upcomingEv = events.filter((e) => e.date >= D.today).reverse()
  const pastEv = events.filter((e) => e.date < D.today)
  document.querySelector("[data-profile]").innerHTML = `
    <article class="panel" data-customer-profile="${c.id}">
      <div class="pf-head">
        <div><h2>${esc(c.parent)}</h2><p>${esc(c.district)} · клиент от ${date.full(c.since)}</p></div>
        <div class="contact"><a href="tel:${c.phone.replace(/\s/g, "")}">${icon("phone")}${esc(c.phone)}</a>${c.email ? `<a href="mailto:${esc(c.email)}">${icon("mail")}${esc(c.email)}</a>` : ""}</div>
      </div>
      <dl class="strip" style="margin-bottom:0">
        <div><dt>Партита</dt><dd>${f.parties.length}<small>${f.parties.filter((p) => p.kind === "past").length} минали · ${f.parties.filter((p) => p.kind === "future").length} предстои</small></dd></div>
        <div><dt>Деца</dt><dd>${f.kids.length}<small>${f.kids.map((k) => esc(k.name)).join(" и ")}</small></dd></div>
        <div><dt>Следващ рожден ден</dt><dd>${date.dm(nextKid.next.date)}<small>${esc(nextKid.name)} става на ${nextKid.next.turns}</small></dd></div>
        <div><dt>Клиенти от</dt><dd>${c.since.slice(0, 4)}<small>${Math.floor(diff(c.since, D.today) / 365)} години с нас</small></dd></div>
      </dl>
      ${c.note ? `<div class="note">${icon("note")}${esc(c.note)}</div>` : ""}
    </article>
    <article class="panel" data-timeline="${c.id}">
      <div class="panel-head"><h2>Партита</h2></div>
      <div class="sec-label label" style="border-top:0">Предстои</div>
      <div class="timeline">${upcomingEv.map((e) => e.html).join("")}</div>
      <div class="sec-label label">История</div>
      <div class="timeline">${pastEv.map((e) => e.html).join("")}</div>
    </article>`

  // Birthdays in the next 30 days, with whether a party is already booked.
  const bdays = fams.flatMap((x) => x.soon.map((k) => ({ f: x, k }))).sort((a, b) => a.k.next.inDays - b.k.next.inDays)
  const bdState = ({ f: x, k }) => {
    const b = D.bookings.find((b) => b.customerId === x.c.id && b.stage !== "done" && b.child.name.includes(k.name))
    if (b) return { booked: true, open: false, html: b.deposit.status === "missing" ? tag("danger", "Няма капаро", "coin") : tag("ok", `Парти ${date.dm(b.date)}`, "check") }
    const o = D.orders.find((o) => o.customerId === x.c.id && o.status === "new" && o.child.name.includes(k.name))
    if (o) return { booked: false, open: false, html: tag("warning", "Заявка без отговор", "mail") }
    return { booked: false, open: true, html: `${tag("neutral", "Няма парти")}<a class="muted" style="font-size:13px;font-weight:700" href="tel:${x.c.phone.replace(/\s/g, "")}">${esc(x.c.phone)}</a>` }
  }
  const withState = bdays.map((x) => ({ ...x, s: bdState(x) }))
  const notBooked = withState.filter((x) => !x.s.booked)
  const booked = withState.filter((x) => x.s.booked)
  const bdRow = (x) => `<div class="bd${x.s.open ? " open" : ""}" data-birthday="${x.f.c.id}-${esc(x.k.name)}">${dateTile(x.k.next.date)}<div><b>${esc(x.k.name)} → ${x.k.next.turns} г.</b><div class="fam-name">${esc(x.f.c.parent)}</div></div><div class="st">${x.s.html}</div></div>`
  document.querySelector("[data-birthdays]").innerHTML = `
    <div class="panel-head"><h2>Рождени дни скоро</h2><p>До ${date.dm(PF.addDays(D.today, 30))}: ${bdays.length} деца. ${notBooked.length} още нямат записано парти.</p></div>
    <div class="bd-label label">Още без парти · ${notBooked.length}</div>
    <div class="list-b">${notBooked.map(bdRow).join("")}</div>
    <div class="bd-label label booked-label">С парти · ${booked.length}</div>
    <div class="list-b booked">${booked.map(bdRow).join("")}</div>`
})()
</script>
</body>
</html>
