<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Отпуска</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<link rel="stylesheet" href="./pf.css">
<script src="./pf.js"></script>
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 600px; gap: 24px; align-items: start; }
  .col { display: grid; gap: 16px; }
  .ticket { --stub: 180px; }
  .ticket .stub { justify-content: center; }
  .range { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .range small { display: block; font-size: 24px; color: var(--color-muted); margin-top: 2px; }
  .stub .len { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-muted); }
  .t-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .t-top h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
  .reason { margin-top: 10px; font-size: 16.5px; font-weight: 500; line-height: 1.45; }
  .steps { display: flex; gap: 0; margin-top: 14px; font-size: 13px; font-weight: 700; }
  .steps span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 0; color: var(--color-muted); }
  .steps span + span::before { content: ""; width: 22px; height: 2px; background: var(--color-line); margin-right: 6px; }
  .steps .done { color: var(--status-ok); }
  .steps .now { color: var(--color-ink); }
  .hits { margin-top: 14px; padding: 12px 14px; border: 1.5px dashed var(--status-warning); border-radius: var(--radius-sm); background: color-mix(in oklab, var(--status-warning) 6%, var(--color-surface)); display: grid; gap: 8px; }
  .hit { display: grid; grid-template-columns: auto 58px minmax(0, 1fr); gap: 12px; align-items: center; }
  .hit .date-tile { width: 44px; height: 48px; }
  .hit .date-tile span { font-size: 24px; }
  .hit .t { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
  .hit b { display: block; font-size: 14.5px; }
  .hit span.m { font-size: 13px; color: var(--color-muted); font-weight: 600; }

  .past .row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--color-line); }
  .past .row .d { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; }
  .past .row .d small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--color-muted); margin-top: 2px; }
  .past .row b { display: block; font-size: 15px; }
  .past .row span.m { font-size: 13px; color: var(--color-muted); font-weight: 600; }
  .past .row:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }

  .newreq .panel-head { justify-content: space-between; }
  .cal { margin: 0 16px; border: 1px solid var(--color-line); border-radius: var(--radius-sm); overflow: hidden; }
  .cal-h, .cal-w { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-h span { text-align: center; font-size: 12px; font-weight: 800; color: var(--color-muted); text-transform: uppercase; padding: 6px 0; background: var(--color-surface-2); }
  .cal-w button { position: relative; min-height: 62px; border: 0; border-top: 1px solid var(--color-line); border-left: 1px solid var(--color-line); background: var(--color-surface); text-align: left; padding: 4px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cal-w button:first-child { border-left: 0; }
  .cal-w button:hover { background: var(--color-surface-2); }
  .cal-w .n { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1; font-variant-numeric: tabular-nums; }
  .cal-w .m1 { font-size: 11px; font-weight: 800; color: var(--color-muted); text-transform: uppercase; margin-left: 3px; font-family: var(--font-body); }
  .cal-w .past { color: var(--color-muted); background: color-mix(in oklab, var(--color-surface-2) 50%, var(--color-surface)); }
  .cal-w .today .n { color: var(--color-accent); }
  .cal-w .today { box-shadow: inset 0 0 0 2px var(--color-accent); }
  .cal-w .dot { font-size: 11px; font-weight: 800; padding: 1px 4px; border-radius: 4px; border: 1.5px solid var(--color-ink); line-height: 1.2; width: fit-content; font-variant-numeric: tabular-nums; }
  .cal-w .lp { background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--status-warning) 16%, var(--color-surface)) 0 6px, var(--color-surface) 6px 12px); }
  .cal-w .lp .dot { border-color: var(--status-warning); border-style: dashed; color: var(--status-warning); }
  .cal-w .la { background: color-mix(in oklab, var(--status-ok) 11%, var(--color-surface)); }
  .cal-w .lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  .cal-w .lp .lbl { color: var(--status-warning); }
  .cal-w .la .lbl { color: var(--status-ok); }
  .key { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px 0; font-size: 13px; font-weight: 700; color: var(--color-muted); }
  .key span { display: inline-flex; gap: 6px; align-items: center; }
  .key i { width: 14px; height: 12px; border-radius: 3px; display: inline-block; }
  .key .kb { border: 1.5px solid var(--color-ink); }
  .key .kp { background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--status-warning) 30%, var(--color-surface)) 0 3px, var(--color-surface) 3px 6px); border: 1px solid var(--status-warning); }
  .key .ko { background: color-mix(in oklab, var(--status-ok) 16%, var(--color-surface)); border: 1px solid var(--status-ok); }
  .form { padding: 14px 16px 16px; display: grid; gap: 12px; border-top: 1.5px solid var(--color-ink); margin-top: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--color-ink); border-radius: var(--radius-sm); background: var(--color-surface); font-weight: 700; color: var(--color-muted); cursor: pointer; text-align: left; }
  .form .hint { font-size: 13.5px; color: var(--color-muted); font-weight: 600; display: flex; gap: 8px; align-items: flex-start; }
  .form .send { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  @media (max-width: 1600px) {
    .layout { grid-template-columns: minmax(0, 1fr) 500px; gap: 20px; }
    .page-head h1 { font-size: 44px; }
    .ticket { --stub: 150px; }
    .range { font-size: 46px; }
    .t-top h2 { font-size: 30px; }
    .reason { font-size: 15.5px; }
    .cal-w button { min-height: 50px; }
    .form { gap: 10px; padding: 12px 16px 14px; margin-top: 10px; }
    .form textarea { min-height: 44px; }
    .past .row { padding: 9px 16px; }
  }
  @media (max-width: 720px) {
    .layout { display: flex; flex-direction: column; gap: 16px; }
    .layout > * { min-width: 0; }
    .head-end { width: 100%; margin-left: 0 !important; }
    .head-end .btn { width: 100%; }
    .ticket { grid-template-columns: minmax(0, 1fr); }
    .ticket > .stub { border-right: 0; border-bottom: 2px dashed color-mix(in oklab, var(--color-ink) 40%, var(--color-surface)); flex-direction: row; align-items: baseline; gap: 10px; padding: 12px 14px; }
    .ticket > .stub::before, .ticket > .stub::after { display: none; }
    .range { font-size: 38px; }
    .range small { display: inline; font-size: 20px; }
    .t-top h2 { font-size: 26px; }
    .reason { font-size: 15px; margin-top: 6px; }
    .steps { flex-wrap: wrap; margin-top: 10px; }
    .steps span { padding-right: 8px; }
    .steps span + span::before { width: 12px; }
    .hit { grid-template-columns: 58px minmax(0, 1fr); }
    .hit .date-tile { display: none; }
    .past .row { grid-template-columns: 84px minmax(0, 1fr); padding: 10px 14px; }
    .past .row .tag { grid-column: 2; justify-self: start; }
    .past .row .d { font-size: 20px; }
    .cal { margin: 0 12px; }
    .cal-w button { min-height: 44px; padding: 3px 4px; }
    .cal-w .dot { font-size: 11px; padding: 0 3px; }
    .cal-w .lbl { display: none; }
    .cal-w .n { font-size: 16px; }
    .cal-w .m1 { display: none; }
    .pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Отпуска</h1>
        <p data-summary></p>
      </div>
      <div class="head-end"><a class="btn primary" href="#nova" data-action="new-leave">Поискай отпуска</a></div>
    </div>
    <div class="layout">
      <div class="col" data-mine aria-label="Моите заявки"></div>
      <section class="panel newreq" id="nova" data-new aria-label="Нова заявка"></section>
    </div>
  </main>
</div>
<script>
(() => {
  const { D, esc, date, animator, booking, customer, tag, dateTile, icon, addDays, diff, fromToday, parse } = PF
  PF.shell("animator", "my-leave")
  const me = animator(D.currentAnimator)
  const btn = document.querySelector("[data-action=new-leave]")
  btn.innerHTML = `${icon("plus")}Поискай отпуска`

  // Only this animator's own leave.
  const mine = D.leave.filter((l) => l.animatorId === me.id)
  const pending = mine.filter((l) => l.status === "pending").sort((a, b) => a.from.localeCompare(b.from))
  const rest = mine.filter((l) => l.status !== "pending").sort((a, b) => b.from.localeCompare(a.from))
  const len = (l) => diff(l.from, l.to) + 1
  const days = (n) => `${n} ${n === 1 ? "ден" : "дни"}`
  document.querySelector("[data-summary]").textContent = pending.length
    ? `${pending.length === 1 ? "Една заявка чака" : `${pending.length} заявки чакат`} решение от ${D.owner.short}. Тя одобрява или отказва; ти виждаш отговора тук.`
    : `Няма заявки, които чакат решение.`

  const rangeHtml = (l) => date.range(l.from, l.to).replace(/ (\S+)$/, "<small>$1</small>")
  const card = (l) => {
    const hits = l.conflicts.map(booking)
    return `<article class="ticket" data-leave="${l.id}" data-status="${l.status}">
      <div class="stub"><span class="len">${days(len(l))}</span><span class="range">${rangeHtml(l)}</span><span class="len">${date.wd(l.from)}–${date.wd(l.to)}</span></div>
      <div class="body">
        <div class="t-top"><h2>Чака решение</h2>${hits.length ? tag("warning", `Засяга ${hits.length} партита`, "alert") : tag("neutral", "Без партита в тези дни", "check")}</div>
        <p class="reason">${esc(l.reason)}</p>
        <div class="steps" aria-label="Ход на заявката"><span class="done">${icon("check")}Изпратена ${date.stamp(l.requestedAt)}</span><span class="now">${icon("clock")}${esc(D.owner.short)} решава</span><span>Одобрена или отказана</span></div>
        ${hits.length ? `<div class="hits" data-conflicts="${l.id}"><span class="issue warning">${icon("alert")}В тези дни си записана на ${hits.length} партита. Ако отпуската бъде одобрена, ${esc(D.owner.short)} ще ги даде на друг.</span>${hits.map((b) => `<div class="hit" data-booking="${b.id}">${dateTile(b.date)}<span class="t">${b.start}</span><div><b>${esc(b.child.name)}, ${b.child.age} г. · ${esc(b.program)}</b><span class="m">${date.short(b.date)} · ${esc(b.address.district)}</span></div></div>`).join("")}</div>` : ""}
      </div>
    </article>`
  }
  const row = (l) => `<div class="row" data-leave="${l.id}" data-status="${l.status}"><span class="d">${date.range(l.from, l.to)}<small>${days(len(l))}${fromToday(l.to) < 0 ? " · мина" : ""}</small></span><div><b>${esc(l.reason)}</b><span class="m">поискана ${date.dm(l.requestedAt.slice(0, 10))}${l.ownerNote ? ` · „${esc(l.ownerNote)}“` : ""}</span></div>${l.status === "approved" ? tag("ok", "Одобрена", "check") : tag("neutral", "Отказана", "x")}</div>`
  document.querySelector("[data-mine]").innerHTML = `${pending.map(card).join("")}
    <article class="panel past" data-decided><div class="panel-head"><h2>Решени</h2><span class="count">${rest.length}</span></div>${rest.map(row).join("")}</article>`

  // New request: five weeks from this Monday, own parties and leave marked.
  const t = parse(D.today)
  const monday = addDays(D.today, -((t.getUTCDay() + 6) % 7))
  const cells = Array.from({ length: 35 }, (_, i) => addDays(monday, i))
  const myParties = D.bookings.filter((b) => b.animators.includes(me.id))
  const cal = cells.map((d) => {
    const lv = mine.find((l) => l.status !== "rejected" && l.from <= d && d <= l.to)
    const ps = myParties.filter((b) => b.date === d).sort((a, b) => a.start.localeCompare(b.start))
    const cls = [fromToday(d) < 0 ? "past" : "", d === D.today ? "today" : "", lv ? (lv.status === "pending" ? "lp" : "la") : ""].join(" ")
    const n = parse(d).getUTCDate()
    return `<button type="button" class="${cls}" data-date="${d}" aria-label="${esc(date.long(d))}${ps.length ? `, ${ps.length} партита` : ""}">
      <span class="n">${n}${n === 1 || d === monday ? `<span class="m1">${date.mon(d)}</span>` : ""}</span>
      ${lv ? `<span class="lbl">${lv.status === "pending" ? "чака" : "отпуска"}</span>` : ""}
      ${ps.slice(0, 2).map((b) => `<span class="dot" data-booking="${b.id}">${b.start}</span>`).join("")}${ps.length > 2 ? `<span class="dot">+${ps.length - 2}</span>` : ""}
    </button>`
  })
  const weeks = Array.from({ length: 5 }, (_, w) => `<div class="cal-w">${cal.slice(w * 7, w * 7 + 7).join("")}</div>`).join("")
  document.querySelector("[data-new]").innerHTML = `
    <div class="panel-head"><h2>Нова заявка</h2><span class="muted" style="font-size:13px;font-weight:700">${date.dm(cells[0])} – ${date.dm(cells[34])}</span></div>
    <div class="cal" data-calendar><div class="cal-h">${["пн", "вт", "ср", "чт", "пт", "сб", "нд"].map((x) => `<span>${x}</span>`).join("")}</div>${weeks}</div>
    <div class="key"><span><i class="kb"></i>твое парти</span><span><i class="kp"></i>чака решение</span><span><i class="ko"></i>одобрена</span></div>
    <form class="form" data-leave-form onsubmit="return false">
      <div class="pair">
        <button class="pick" type="button" data-pick="from">${icon("calendar")}От: избери ден</button>
        <button class="pick" type="button" data-pick="to">${icon("calendar")}До: избери ден</button>
      </div>
      <label class="field"><span>Причина</span><textarea class="input" rows="2" placeholder="Напр. семеен повод, изпит, час при лекар"></textarea></label>
      <p class="hint">${icon("alert")}Щом избереш дни, тук ще видиш кои твои партита попадат в тях.</p>
      <div class="send"><button class="btn primary" type="submit" data-action="send">Изпрати на ${esc(D.owner.short)}</button><span class="muted" style="font-size:13px;font-weight:600">Одобрява или отказва ${esc(D.owner.short)}.</span></div>
    </form>`
})()
</script>
</body>
</html>
