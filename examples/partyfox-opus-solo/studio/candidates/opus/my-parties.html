<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Моите партита</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<link rel="stylesheet" href="./pf.css">
<script src="./pf.js"></script>
<style>
  .alerts { display: flex; flex-wrap: wrap; gap: 8px; margin: -6px 0 18px; }
  .alert { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; }
  .alert.danger { background: var(--status-danger); color: var(--color-surface); }
  .alert.warning { color: var(--status-warning); background: color-mix(in oklab, var(--status-warning) 9%, var(--color-surface)); border: 1px solid color-mix(in oklab, var(--status-warning) 40%, var(--color-surface)); }
  .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .next-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ticket { --stub: 170px; }
  .ticket .stub { justify-content: flex-start; }
  .ticket .stub .date-tile { width: 64px; height: 68px; }
  .ticket .stub .date-tile span { font-size: 38px; }
  .ticket .stub .stub-time { font-size: 56px; margin-top: 6px; }
  .ticket .stub .rel { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-accent); }
  .ticket .stub .dur { font-size: 13px; font-weight: 700; color: var(--color-muted); }
  .ticket > .body { padding: 0; }
  .t-head { padding: 18px 20px 14px; }
  .t-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 0.92; }
  .t-head p { font-size: 15px; color: var(--color-muted); font-weight: 600; margin-top: 6px; }
  .t-sec { padding: 14px 20px; border-top: 1px solid var(--color-line); display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; }
  .t-sec > svg.i { width: 20px; height: 20px; margin-top: 2px; color: var(--color-primary); }
  .t-sec .k { font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-muted); }
  .addr b { display: block; font-size: 19px; line-height: 1.3; }
  .addr .district { font-size: 14.5px; font-weight: 700; color: var(--color-muted); }
  .addr .how { margin-top: 8px; padding: 9px 12px; background: var(--color-surface-2); border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; }
  .t-sec .who b { font-size: 16px; display: block; }
  .t-sec .who a { font-weight: 700; text-underline-offset: 3px; }
  .t-sec .facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

  .day-tl { padding: 14px 16px 16px; margin-top: 16px; }
  .tl { position: relative; margin-top: 10px; }
  .tl-scale { display: grid; grid-template-columns: repeat(10, 1fr); font-size: 12px; font-weight: 700; color: var(--color-muted); border-bottom: 1px solid var(--color-line); padding-bottom: 3px; }
  .tl-lanes { position: relative; height: 84px; margin-top: 6px; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--color-line) calc(10% - 1px) 10%); }
  .tl-blk { position: absolute; height: 36px; border: 1.5px solid var(--color-ink); background: var(--color-surface); border-radius: 6px; padding: 3px 7px; font-size: 12.5px; font-weight: 800; line-height: 1.15; overflow: hidden; white-space: nowrap; }
  .tl-blk span { display: block; font-weight: 600; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; }
  .tl-blk.me { background: var(--color-primary-soft); border-color: var(--color-primary); }
  .tl-clash { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--status-warning) 30%, transparent) 0 5px, transparent 5px 10px); border-left: 2px solid var(--status-warning); border-right: 2px solid var(--status-warning); }
  .tl-note { margin-top: 10px; }

  .list { margin-top: 16px; }
  .dgroup { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 12px 16px; border-top: 1px solid var(--color-line); }
  .dgroup:first-of-type { border-top: 0; }
  .dgroup .side { display: grid; justify-items: center; gap: 4px; align-content: start; }
  .dgroup .side em { font-style: normal; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--color-muted); letter-spacing: 0.05em; }
  .mp { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; padding: 6px 0; }
  .mp + .mp { border-top: 1px dashed var(--color-line); padding-top: 10px; }
  .mp .t { font-family: var(--font-display); font-weight: 800; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; }
  .mp .t small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--color-muted); margin-top: 2px; }
  .mp b { font-size: 15.5px; display: block; }
  .mp .where { font-size: 13.5px; color: var(--color-muted); font-weight: 600; }
  .mp .iss { display: grid; gap: 4px; margin-top: 6px; }
  .mp .iss .issue { font-size: 13.5px; }
  .mp .iss .tag { justify-self: start; white-space: normal; line-height: 1.2; }
  .mp[aria-current="true"] .t { color: var(--color-primary); }

  @media (max-width: 1600px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr); gap: 20px; }
    .page-head h1 { font-size: 44px; }
    .alerts { margin-bottom: 14px; }
    .ticket { --stub: 140px; }
    .ticket .stub .stub-time { font-size: 46px; }
    .t-head { padding: 14px 18px 10px; }
    .t-head h2 { font-size: 38px; }
    .t-sec { padding: 10px 18px; }
    .addr b { font-size: 17px; }
    .addr .how { font-size: 14px; margin-top: 6px; }
    .day-tl { padding: 12px 14px 12px; }
    .tl-lanes { height: 80px; }
    .dgroup { padding: 10px 14px; grid-template-columns: 56px minmax(0, 1fr); }
    .mp { grid-template-columns: 58px minmax(0, 1fr); }
    .mp .t { font-size: 24px; }
    .tl-note { font-size: 13.5px; }
  }
  @media (max-width: 720px) {
    .page-head p { display: none; }
    .alerts { flex-direction: column; gap: 6px; margin: -4px 0 14px; }
    .alert { padding: 7px 10px; font-size: 13.5px; }
    .layout { display: flex; flex-direction: column; gap: 16px; }
    .layout > * { min-width: 0; }
    .ticket { --stub: 96px; }
    .ticket .stub { padding: 12px 10px; align-items: center; text-align: center; }
    .ticket .stub .date-tile { width: 52px; height: 56px; }
    .ticket .stub .date-tile span { font-size: 30px; }
    .ticket .stub .stub-time { font-size: 34px; }
    .t-head { padding: 12px 14px 10px; }
    .t-head h2 { font-size: 32px; }
    .t-head p { font-size: 14px; }
    .t-sec { padding: 10px 14px; grid-template-columns: 22px minmax(0, 1fr); }
    .t-sec > svg.i { width: 18px; height: 18px; }
    .t-sec .btn { grid-column: 2; justify-self: start; }
    .addr b { font-size: 16px; }
    .addr .how { font-size: 14px; }
    .ticket .hide-phone { display: none; }
    .day-tl { display: none; }
    .dgroup { grid-template-columns: 50px minmax(0, 1fr); gap: 10px; padding: 10px 12px; }
    .dgroup .side .date-tile { width: 46px; height: 50px; }
    .dgroup .side .date-tile span { font-size: 26px; }
    .mp { grid-template-columns: 54px minmax(0, 1fr); gap: 2px 8px; }
    .mp .t { font-size: 22px; }
    .list { margin-top: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Моите партита</h1>
        <p data-summary></p>
      </div>
    </div>
    <div class="alerts" data-alerts></div>
    <div class="layout">
      <section data-next aria-label="Следващото парти"></section>
      <section data-rest aria-label="Всички мои партита"></section>
    </div>
  </main>
</div>
<script>
(() => {
  const { D, esc, date, customer, animator, prog, tag, chip, dateTile, icon, issues, fromToday } = PF
  PF.shell("animator", "my-parties")
  const me = animator(D.currentAnimator)

  // Only this animator's own parties.
  const mine = D.bookings.filter((b) => b.stage !== "done" && b.animators.includes(me.id)).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
  const next = mine[0]
  const tomorrow = mine.filter((b) => b.date === next.date)
  const noDeposit = mine.filter((b) => b.deposit.status === "missing")
  const warn = mine.flatMap((b) => issues(b).filter((i) => i.kind === "warning").map((i) => ({ b, i })))
  document.querySelector("[data-summary]").textContent = `Здравей, ${me.short}. ${fromToday(next.date) === 1 ? "Утре" : date.long(next.date)} имаш ${tomorrow.length} партита, общо ${mine.length} напред.`

  // Short, own-party alerts at the top so they are seen first on a phone.
  document.querySelector("[data-alerts]").innerHTML =
    (noDeposit.length ? `<div class="alert danger" data-alert="deposit">${icon("coin")}Няма капаро: ${noDeposit.map((b) => `${esc(b.child.name)} (${date.dm(b.date)})`).join(", ")}</div>` : "")
    + [...new Map(warn.map((w) => [w.i.key, w])).values()].map((w) => {
      const same = warn.filter((x) => x.i.key === w.i.key)
      const text = { clash: "Застъпване", address: "Непълен адрес", leave: "В дните на отпуската ти", unassigned: "Без аниматор" }[w.i.key]
      return `<div class="alert warning" data-alert="${w.i.key}">${icon("alert")}${text}: ${same.map((x) => `${esc(x.b.child.name)} (${date.dm(x.b.date)})`).join(", ")}</div>`
    }).join("")

  // The next party as a ticket: time, then the address you can act on, then the parent.
  const c = customer(next.customerId)
  const others = next.animators.filter((id) => id !== me.id).map((id) => animator(id).short)
  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${next.address.line}, ${next.address.district}, София`)}`
  const nextIssues = issues(next)
  const minutes = (+next.end.slice(0, 2) * 60 + +next.end.slice(3)) - (+next.start.slice(0, 2) * 60 + +next.start.slice(3))
  document.querySelector("[data-next]").innerHTML = `
    <div class="next-label label">${icon("star")}Следващото ти парти</div>
    <article class="ticket" data-booking="${next.id}" data-next-party>
      <div class="stub">${dateTile(next.date)}<span class="stub-time">${next.start}</span><span class="dur">до ${next.end} · ${minutes} мин.</span><span class="rel">${date.rel(next.date)}</span></div>
      <div class="body">
        <div class="t-head"><h2>${esc(next.child.name)} навършва ${next.child.age}</h2><p>${esc(next.program)} · ${next.children} деца${others.length ? ` · с ${esc(others.join(", "))}` : " · сама"}</p></div>
        <div class="t-sec addr" data-address="${next.id}">${icon("pin")}<div><span class="k">Адрес</span><b>${esc(next.address.line)}</b><span class="district">${esc(next.address.district)}, София</span>${next.address.notes ? `<div class="how">${esc(next.address.notes)}</div>` : ""}</div><a class="btn sm" href="${mapUrl}" target="_blank" rel="noopener">${icon("map")}Карта</a></div>
        <div class="t-sec" data-parent="${c.id}">${icon("phone")}<div class="who"><span class="k">Родител</span><b>${esc(c.parent)}</b></div><a class="btn sm primary" href="tel:${c.phone.replace(/\s/g, "")}">${icon("phone")}${esc(c.phone)}</a></div>
        <div class="t-sec hide-phone" data-extras="${next.id}">${icon("box")}<div><span class="k">Капаро и доставчици</span><div class="facts">${next.deposit.status === "received" ? tag("ok", "Капарото е платено", "check") : tag("danger", "Няма капаро", "coin")}${next.providers.map((p) => tag(p.status === "confirmed" ? "neutral" : "warning", `${p.kind}: ${p.name}`, p.status === "confirmed" ? "check" : "clock")).join("")}${nextIssues.filter((i) => i.kind === "warning").map((i) => tag("warning", i.label, "alert")).join("")}</div></div></div>
      </div>
    </article>`

  // Tomorrow on a line, so a clash is visible as an overlap. Hours 9–19.
  const toMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3)
  const from = 9 * 60, to = 19 * 60
  const pct = (t) => ((toMin(t) - from) / (to - from)) * 100
  const lanes = []
  const blocks = tomorrow.map((b) => {
    let lane = lanes.findIndex((end) => end <= b.start)
    if (lane < 0) { lane = lanes.length; lanes.push(b.end) } else lanes[lane] = b.end
    return `<div class="tl-blk me" data-booking="${b.id}" style="left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%;top:${lane * 42}px">${b.start} ${esc(b.child.name)}<span>${esc(b.address.district)}</span></div>`
  }).join("")
  const clash = tomorrow.find((b) => b.clash)
  const other = clash && D.bookings.find((b) => b.id === clash.clash.with)
  const clashBand = clash ? `<div class="tl-clash" style="left:${pct(clash.start)}%;width:${pct(other.end) - pct(clash.start)}%" title="Застъпване"></div>` : ""
  const hoursScale = Array.from({ length: 10 }, (_, i) => `<span>${9 + i}:00</span>`).join("")

  // Every own party, by day, with its problems written out.
  const days = [...new Set(mine.map((b) => b.date))]
  const groups = days.map((d) => `<div class="dgroup" data-day="${d}"><div class="side">${dateTile(d)}<em>${fromToday(d) === 1 ? "утре" : date.wd(d)}</em></div><div>${mine.filter((b) => b.date === d).map((b) => {
    const list = issues(b)
    const co = b.animators.filter((id) => id !== me.id).map((id) => animator(id).short)
    const iss = list.map((i) => i.kind === "danger"
      ? tag("danger", "Няма капаро от родителите", "coin")
      : `<div class="issue warning" data-issue="${i.key}">${icon("alert")}<span><b style="display:inline;font-size:inherit">${esc(i.key === "leave" ? "Поискала си отпуска" : i.label)}.</b> ${esc(i.key === "clash" ? `До ${other ? other.end : ""} си на ${other ? other.child.name : ""} в ${other ? other.address.district : ""}; до ${b.address.district} се пътува ~40 мин.` : i.key === "leave" ? `${i.detail} Росица ще реши кой поема.` : i.detail)}</span></div>`).join("")
    return `<div class="mp" data-booking="${b.id}"${b.id === next.id ? ' aria-current="true"' : ""}><span class="t">${b.start}<small>до ${b.end}</small></span><div><b>${esc(b.child.name)}, ${b.child.age} г. · ${esc(b.program)}</b><span class="where">${esc(b.address.district)} · ${b.children} деца${co.length ? ` · с ${esc(co.join(", "))}` : ""}</span>${iss ? `<div class="iss">${iss}</div>` : ""}</div></div>`
  }).join("")}</div></div>`).join("")

  document.querySelector("[data-next]").insertAdjacentHTML("beforeend", `
    <article class="panel day-tl" data-timeline="${next.date}">
      <div style="display:flex;align-items:baseline;gap:10px"><h2 class="h2">${fromToday(next.date) === 1 ? "Утре" : date.short(next.date)}, ${date.long(next.date).split(",")[1].trim()}</h2><span class="muted" style="font-weight:700;font-size:13px">${tomorrow.length} партита</span></div>
      <div class="tl"><div class="tl-scale">${hoursScale}</div><div class="tl-lanes" style="height:${lanes.length * 42}px">${clashBand}${blocks}</div></div>
      ${clash ? `<div class="issue warning tl-note">${icon("alert")}${esc(clash.clash.note)}</div>` : ""}
    </article>`)
  document.querySelector("[data-rest]").innerHTML = `
    <article class="panel list" data-all-parties>
      <div class="panel-head"><h2>Всички мои партита</h2><span class="count">${mine.length}</span></div>
      ${groups}
    </article>`
})()
</script>
</body>
</html>
