<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Партита и капаро</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<link rel="stylesheet" href="./pf.css">
<script src="./pf.js"></script>
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: start; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; font-weight: 700; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .danger i { background: var(--status-danger); }
  .legend .warning i { background: color-mix(in oklab, var(--status-warning) 18%, var(--color-surface)); border: 1.5px solid var(--status-warning); }
  .legend .ok i { background: color-mix(in oklab, var(--status-ok) 14%, var(--color-surface)); border: 1.5px solid var(--status-ok); }
  .legend b { font-variant-numeric: tabular-nums; }

  .board { padding: 4px 0 6px; }
  .cols, .row { display: grid; grid-template-columns: 84px minmax(170px, 1.05fr) minmax(150px, 1fr) 190px 214px; gap: 14px; align-items: center; }
  .cols { padding: 10px 18px 8px 102px; border-bottom: 1.5px solid var(--color-ink); }
  .day { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--color-line); }
  .day:last-child { border-bottom: 0; }
  .day-side { display: grid; justify-items: center; align-content: start; gap: 5px; padding-top: 4px; }
  .day-side em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .day-side em.soon { color: var(--color-accent); }
  .row { min-height: 56px; padding: 6px 0; }
  .row + .row { border-top: 1px dashed var(--color-line); }
  .row .ptime { font-family: var(--font-display); font-weight: 800; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; }
  .row .ptime small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--color-muted); margin-top: 3px; }
  .party { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .party strong { display: block; font-size: 15.5px; line-height: 1.2; }
  .party span { font-size: 13px; color: var(--color-muted); font-weight: 600; }
  .place { min-width: 0; }
  .place strong { display: block; font-size: 14.5px; }
  .place span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-size: 13px; line-height: 1.3; color: var(--color-muted); overflow: hidden; }
  .crew { display: flex; flex-wrap: wrap; gap: 4px; }
  .state { display: flex; flex-wrap: wrap; gap: 4px; }
  .row.is-danger .ptime { color: var(--status-danger); }

  .due-panel .panel-head { padding-bottom: 4px; }
  .due-group { padding: 6px 16px 14px; }
  .due-group + .due-group { border-top: 1.5px solid var(--color-ink); padding-top: 12px; }
  .due-group > .label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .due-group > .label.danger { color: var(--status-danger); }
  .due-group > .label.warning { color: var(--status-warning); }
  .due { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; }
  .due + .due { border-top: 1px solid var(--color-line); }
  .due h3 { font-size: 15px; line-height: 1.25; }
  .due p { font-size: 13px; color: var(--color-muted); font-weight: 600; }
  .due .note { color: var(--color-ink); font-weight: 500; font-style: italic; }
  .due .acts { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .due.danger .date-tile { border-color: var(--status-danger); }
  .due.danger .date-tile b { background: var(--status-danger); color: var(--color-surface); }
  .due-mini { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
  .due-mini + .due-mini { border-top: 1px solid var(--color-line); }
  .due-mini .t { font-family: var(--font-display); font-weight: 800; font-size: 19px; width: 74px; flex: none; font-variant-numeric: tabular-nums; }
  .due-mini .w { min-width: 0; flex: 1; }
  .due-mini .w b { display: block; }
  .due-mini .w span { display: block; font-size: 13px; color: var(--status-warning); font-weight: 700; }

  @media (max-width: 1600px) {
    .layout { grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; }
    .cols, .row { grid-template-columns: 70px minmax(150px, 1fr) minmax(110px, 0.8fr) 150px 170px; gap: 12px; }
    .cols { padding-left: 96px; }
    .day { grid-template-columns: 64px minmax(0, 1fr); padding: 8px 16px; }
    .row { min-height: 50px; padding: 4px 0; }
    .row .ptime { font-size: 24px; }
    .party .prog { display: none; }
    .page-head h1 { font-size: 44px; }
    .chip { font-size: 12.5px; }
    .due-group { padding-bottom: 10px; }
    .due { padding: 8px 0; }
    .due .note { display: none; }
  }
  @media (max-width: 720px) {
    .layout { display: flex; flex-direction: column-reverse; gap: 16px; }
    .page-head .legend { display: none; }
    .cols { display: none; }
    .board .day { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 10px 12px; }
    .day-side .date-tile { width: 46px; height: 50px; }
    .day-side .date-tile span { font-size: 26px; }
    .row { grid-template-columns: 58px minmax(0, 1fr); gap: 4px 10px; align-items: start; }
    .row .ptime { font-size: 22px; grid-row: span 3; }
    .place, .crew { grid-column: 2; }
    .place strong { display: inline; font-size: 13px; }
    .place span { display: none; }
    .state { grid-column: 2; }
    .crew { display: none; }
    .due-group { padding: 4px 14px 10px; }
    .due .note { display: block; }
    .due-panel .panel-head h2 { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Партита и капаро</h1>
        <p data-summary></p>
      </div>
      <div class="head-end legend" data-legend aria-label="Брой по състояние"></div>
    </div>
    <div class="layout">
      <section class="panel board" data-board aria-label="Предстоящи партита по дни">
        <div class="cols label" aria-hidden="true"><span>Час</span><span>Парти</span><span>Къде</span><span>Аниматори</span><span>Капаро и сигнали</span></div>
      </section>
      <aside class="panel due-panel" data-due aria-label="Чака решение от теб">
        <div class="panel-head"><h2>Чака теб</h2></div>
      </aside>
    </div>
  </main>
</div>
<script>
(() => {
  const { D, esc, date, customer, issues, statusOf, prog, tag, chip, dateTile, icon, fromToday } = PF
  PF.shell("owner", "bookings")

  const upcoming = D.bookings.filter((b) => b.stage !== "done").sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
  const pastMissing = D.bookings.filter((b) => b.stage === "done" && b.deposit.status === "missing")
  const last = upcoming[upcoming.length - 1]

  // Legend counts every state, like a schedule footer.
  const count = (key) => upcoming.filter((b) => issues(b).some((i) => i.key === key)).length
  const missing = upcoming.filter((b) => b.deposit.status === "missing").length + pastMissing.length
  const okCount = upcoming.filter((b) => statusOf(b) === "ok").length
  document.querySelector("[data-summary]").textContent = `${upcoming.length} предстоящи партита до ${date.dm(last.date)}. Червено значи само едно: няма капаро.`
  document.querySelector("[data-legend]").innerHTML = [
    ["danger", missing, "без капаро"], ["warning", count("unassigned"), "без аниматор"], ["warning", count("clash"), "застъпване"],
    ["warning", count("address"), "непълен адрес"], ["warning", count("leave"), "засегнати от отпуска"], ["ok", okCount, "наред"],
  ].map(([kind, n, text]) => `<span class="${kind}" data-legend-item="${text}"><i></i><b>${n}</b> ${text}</span>`).join("")

  // Board, grouped by day.
  const days = [...new Set(upcoming.map((b) => b.date))]
  const board = document.querySelector("[data-board]")
  board.insertAdjacentHTML("beforeend", days.map((day) => {
    const rows = upcoming.filter((b) => b.date === day).map((b) => {
      const list = issues(b)
      const dep = b.deposit.status === "received" ? tag("ok", `Капаро · ${date.dm(b.deposit.on)}`, "check") : tag("danger", "Няма капаро", "coin")
      const crew = b.animators.length ? b.animators.map(chip).join("") : `<span class="chip none" data-unassigned>${icon("alert")}Няма аниматор</span>`
      const warn = list.filter((i) => i.kind === "warning" && i.key !== "unassigned").map((i) => `<span title="${esc(i.detail)}">${tag("warning", i.label, "alert")}</span>`).join("")
      return `<div class="row ${statusOf(b) === "danger" ? "is-danger" : ""}" data-booking="${b.id}" data-status="${statusOf(b)}">
        <div class="ptime">${b.start}<small>до ${b.end}</small></div>
        <div class="party">${prog(b.program)}<div><strong>${esc(b.child.name)}, ${b.child.age} г.</strong><span>${esc(b.program)} · ${b.children} деца</span></div></div>
        <div class="place"><strong>${esc(b.address.district)}</strong><span title="${esc(b.address.line)}">${esc(b.address.line)}</span></div>
        <div class="crew">${crew}</div>
        <div class="state">${dep}${warn}</div>
      </div>`
    }).join("")
    const n = fromToday(day)
    const rel = n === 1 ? "утре" : n < 7 ? date.wd(day) : date.wd(day)
    return `<div class="day" data-day="${day}"><div class="day-side">${dateTile(day)}<em class="${n <= 2 ? "soon" : ""}">${rel}</em></div><div>${rows}</div></div>`
  }).join(""))

  // Rail: what waits on the owner. Red first, then amber.
  const redItems = [...upcoming.filter((b) => b.deposit.status === "missing"), ...pastMissing]
  const red = redItems.map((b) => {
    const c = customer(b.customerId)
    const done = b.stage === "done"
    return `<article class="due danger" data-booking="${b.id}" data-status="danger">
      ${dateTile(b.date)}
      <div><h3>${esc(b.child.name)}, ${b.child.age} г. · ${esc(b.program)}</h3>
        <p>${done ? `Партито мина на ${date.dm(b.date)}` : `${date.short(b.date)}, ${b.start} · ${esc(b.address.district)}`}</p>
        <p>${esc(c.parent)} · <a href="tel:${c.phone.replace(/\s/g, "")}">${esc(c.phone)}</a></p>
        ${c.note ? `<p class="note">„${esc(c.note)}“</p>` : done ? `<p class="note">Капарото не е отбелязано, въпреки че партито мина.</p>` : ""}
      </div>
      <div class="acts"><button class="btn sm primary" type="button" data-action="mark-deposit">${icon("check")}Отбележи получено</button></div>
    </article>`
  }).join("")
  const amberItems = upcoming.flatMap((b) => issues(b).filter((i) => i.kind === "warning").map((i) => ({ b, i })))
  const amber = amberItems.map(({ b, i }) => `<div class="due-mini" data-booking="${b.id}" data-issue="${i.key}">
      <span class="t">${date.dm(b.date)}</span>
      <div class="w"><b>${esc(b.child.name)} · ${b.start}</b><span>${esc(i.label)}${i.key === "clash" ? `: ${esc(PF.animator(b.clash.animator).short)} до ${PF.booking(b.clash.with).end} в ${esc(PF.booking(b.clash.with).address.district)}` : ""}</span></div>
      ${i.key === "unassigned" ? `<button class="btn sm" type="button" data-action="assign">Избери</button>` : i.key === "leave" ? `<a class="btn sm" href="./leave-requests.html${location.search}">Отпуски</a>` : `<button class="btn sm ghost" type="button" data-action="open">Виж</button>`}
    </div>`).join("")
  document.querySelector("[data-due]").insertAdjacentHTML("beforeend",
    `<div class="due-group" data-group="deposit"><div class="label danger">${icon("coin")}Няма капаро · ${redItems.length}</div>${red}</div>`
    + `<div class="due-group" data-group="attention"><div class="label warning">${icon("alert")}Нужно внимание · ${amberItems.length}</div>${amber}</div>`)
})()
</script>
</body>
</html>
