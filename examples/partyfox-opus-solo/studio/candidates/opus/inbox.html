<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Заявки от сайта</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<link rel="stylesheet" href="./pf.css">
<script src="./pf.js"></script>
<style>
  .layout { display: grid; grid-template-columns: 400px minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
  .list .panel-head { justify-content: space-between; }
  .seg { display: flex; gap: 4px; padding: 0 12px 10px; border-bottom: 1.5px solid var(--color-ink); }
  .seg button { border: 0; background: transparent; padding: 7px 10px; border-radius: var(--radius-sm); font-weight: 800; font-size: 14px; color: var(--color-muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-surface); }
  .seg button[aria-pressed="true"] .count { background: var(--color-surface); color: var(--color-ink); }
  .order { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 14px 12px 10px; border-bottom: 1px solid var(--color-line); cursor: pointer; text-decoration: none; }
  .order:last-child { border-bottom: 0; border-radius: 0 0 var(--radius-md) var(--radius-md); }
  .order:hover { background: color-mix(in oklab, var(--color-surface-2) 60%, var(--color-surface)); }
  .order .dot { grid-row: span 3; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
  .order.new .dot { background: var(--status-warning); }
  .order .who { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; display: block; }
  .order time { font-size: 12.5px; font-weight: 700; color: var(--color-muted); white-space: nowrap; }
  .order .what { grid-column: 2 / 4; font-size: 14px; color: var(--color-ink); }
  .order .what span { color: var(--color-muted); }
  .order .flags { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .order .flags .tag { font-size: 12px; padding: 3px 6px; }
  .order[aria-current="true"] { background: var(--color-primary-soft); box-shadow: inset 4px 0 0 var(--color-primary); }
  .order.done .who { color: var(--color-muted); }

  .detail { display: grid; gap: 16px; }
  .ticket { --stub: 150px; }
  .ticket .stub { align-items: center; text-align: center; justify-content: center; }
  .ticket .stub .date-tile { width: 64px; height: 68px; }
  .ticket .stub .date-tile span { font-size: 38px; }
  .ticket .stub .stub-time { font-size: 38px; }
  .ticket .stub .rel { font-size: 13px; font-weight: 800; color: var(--status-warning); text-transform: uppercase; letter-spacing: 0.05em; }
  .ticket .body h2 { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 0.95; }
  .ticket .body .sub { margin-top: 6px; font-size: 15px; color: var(--color-muted); font-weight: 600; }
  .ticket .body .issues { display: grid; gap: 6px; margin-top: 14px; }
  .form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--color-line); }
  .form > div { padding: 12px 18px; border-bottom: 1px solid var(--color-line); min-width: 0; }
  .form > div:not(:nth-child(3n)) { border-right: 1px solid var(--color-line); }
  .form dt { font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 3px; }
  .form dd { margin: 0; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .form dd a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .form .missing { color: var(--status-warning); font-weight: 700; font-size: 14px; display: inline-flex; gap: 5px; align-items: center; }
  .msg { padding: 16px 18px 6px; }
  .msg blockquote { margin: 6px 0 0; font-size: 17px; line-height: 1.5; font-weight: 500; padding-left: 14px; border-left: 3px solid var(--color-accent); max-width: 68ch; }
  .foot { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-top: 1.5px solid var(--color-ink); margin-top: 14px; flex-wrap: wrap; }
  .foot .spacer { flex: 1; }
  .foot .hint { font-size: 13px; color: var(--color-muted); font-weight: 600; }

  .side { display: grid; gap: 16px; }
  .side .panel { padding: 16px; }
  .side h3 { font-family: var(--font-display); font-weight: 800; font-size: 23px; line-height: 1; margin-bottom: 10px; }
  .dayrow { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--color-line); align-items: center; }
  .dayrow .t { font-family: var(--font-display); font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; }
  .dayrow .t small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--color-muted); font-weight: 700; }
  .dayrow b { font-size: 14px; display: block; }
  .dayrow .crew { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .dayrow.wanted { background: color-mix(in oklab, var(--status-warning) 8%, var(--color-surface)); border: 1.5px dashed var(--status-warning); border-radius: var(--radius-sm); padding: 8px; margin: 4px 0; }
  .dayrow.wanted b { color: var(--status-warning); }
  .facts { display: grid; gap: 8px; font-size: 14px; }
  .facts div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .facts span { color: var(--color-muted); font-weight: 600; }
  .facts b { text-align: right; }
  .family-empty { font-size: 14px; color: var(--color-muted); font-weight: 600; }

  @media (max-width: 1600px) {
    .layout { grid-template-columns: 340px minmax(0, 1fr) 300px; gap: 18px; }
    .page-head h1 { font-size: 44px; }
    .order { padding: 9px 12px 9px 8px; }
    .order .flags { display: none; }
    .order .what { font-size: 13.5px; }
    .ticket { --stub: 130px; }
    .ticket .body h2 { font-size: 34px; }
    .ticket .stub .stub-time { font-size: 32px; }
    .ticket .stub .date-tile { width: 56px; height: 60px; }
    .ticket .stub .date-tile span { font-size: 32px; }
    .form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form > div { padding: 9px 16px; }
    .form > div:not(:nth-child(3n)) { border-right: 0; }
    .form > div:nth-child(odd) { border-right: 1px solid var(--color-line); }
    .form > div:last-child:nth-child(odd) { grid-column: 1 / -1; border-right: 0; }
    .form dd { font-size: 15px; }
    .msg blockquote { font-size: 16px; }
    .side .panel { padding: 14px; }
    .side h3 { font-size: 21px; }
    .price { display: none; }
  }
  @media (max-width: 720px) {
    .layout { display: block; }
    .detail, .side { display: none; }
    .seg { overflow: hidden; }
    .seg button { padding: 6px 8px; font-size: 13px; }
    .order .flags { display: flex; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Заявки от сайта</h1>
        <p data-summary></p>
      </div>
    </div>
    <div class="layout">
      <section class="panel list" aria-label="Заявки">
        <div class="panel-head"><h2>Входящи</h2><span class="muted" style="font-size:13px;font-weight:700">най-новите горе</span></div>
        <div class="seg" role="group" aria-label="Филтър" data-filter></div>
        <div data-orders></div>
      </section>
      <section class="detail" data-detail aria-label="Избрана заявка"></section>
      <aside class="side" data-side aria-label="Контекст"></aside>
    </div>
  </main>
</div>
<script>
(() => {
  const { D, esc, date, customer, animator, prog, tag, chip, dateTile, icon, fromToday, booking, issues, statusOf, unset } = PF
  PF.shell("owner", "inbox")
  const SELECTED = "o4"

  const FLAG = {
    large: ["warning", "Голяма поръчка", "users"],
    repeat: ["primary", "Връщат се", "repeat"],
    "missing-info": ["warning", "Липсват данни", "alert"],
    "short-notice": ["warning", "Кратък срок", "clock"],
  }
  const STATUS = { new: "Без отговор", replied: "Отговорено", booked: "Записано" }
  const orders = [...D.orders].sort((a, b) => b.receivedAt.localeCompare(a.receivedAt))
  const counts = { new: 0, replied: 0, booked: 0 }
  orders.forEach((o) => counts[o.status]++)

  document.querySelector("[data-summary]").textContent = `${counts.new} заявки чакат отговор. Най-старата е от ${date.stamp(orders.filter((o) => o.status === "new").at(-1).receivedAt)}.`
  document.querySelector("[data-filter]").innerHTML = [["new", "Нови", "warning"], ["replied", "Отговорени", ""], ["booked", "Записани", ""]]
    .map(([id, text, kind], index) => `<button type="button" data-filter-id="${id}" aria-pressed="${index === 0}">${text}<span class="count ${index === 0 ? "" : kind}">${counts[id]}</span></button>`).join("")

  const wanted = (o) => o.wantedDate ? `за ${date.short(o.wantedDate)}` : `<span>без дата</span>`
  const what = (o) => {
    const child = o.child.name ? `${esc(o.child.name)}${o.child.age ? `, ${o.child.age} г.` : ""}` : "<span>без име на дете</span>"
    return `${child} · ${esc(o.program)} · ${wanted(o)}`
  }
  document.querySelector("[data-orders]").innerHTML = orders.map((o) => `
    <a class="order ${o.status === "new" ? "new" : "done"}" href="#" data-order="${o.id}" data-status="${o.status}"${o.id === SELECTED ? ' aria-current="true"' : ""}>
      <span class="dot" aria-hidden="true"></span>
      <span class="who">${esc(o.parent.name)}</span>
      <time>${date.stamp(o.receivedAt)}</time>
      <span class="what">${what(o)}</span>
      <span class="flags">${o.status !== "new" ? tag(o.status === "booked" ? "ok" : "neutral", STATUS[o.status], o.status === "booked" ? "check" : "mail") : ""}${o.flags.map((f) => tag(...FLAG[f].slice(0, 2), FLAG[f][2])).join("")}</span>
    </a>`).join("")

  // The selected order, as the form it is.
  const o = D.orders.find((x) => x.id === SELECTED)
  const p = D.programs.find((x) => x.name === o.program)
  const n = fromToday(o.wantedDate)
  const missing = (text) => `<span class="missing">${icon("alert")}${text}</span>`
  const flagText = {
    "short-notice": `Кратък срок: партито е ${n === 1 ? "утре" : date.rel(o.wantedDate)}, а заявката е от ${date.stamp(o.receivedAt)}.`,
    large: "Голяма поръчка.", "missing-info": "Липсват данни във формата.", repeat: "Семейството вече е правило парти при нас.",
  }
  const fields = [
    ["Дете", o.child.name ? `${esc(o.child.name)}, ${o.child.age} г.` : missing("не е попълнено")],
    ["Желана дата", o.wantedDate ? `${date.long(o.wantedDate)}` : missing("не е попълнена")],
    ["Час", o.wantedTime ? `${o.wantedTime}` : missing("не е попълнен")],
    ["Програма", `${esc(o.program)}${p ? ` <span class="muted" style="font-weight:600">· ${p.minutes} мин.</span>` : ""}`],
    ["Брой деца", o.children ?? missing("не е попълнен")],
    ["Място", o.place ? esc(o.place) : missing("не е попълнено")],
    ["Родител", esc(o.parent.name)],
    ["Телефон", o.parent.phone ? `<a href="tel:${o.parent.phone.replace(/\s/g, "")}">${esc(o.parent.phone)}</a>` : missing("няма")],
    ["Имейл", o.parent.email ? esc(o.parent.email) : missing("няма имейл")],
  ]
  document.querySelector("[data-detail]").innerHTML = `
    <article class="ticket" data-order-detail="${o.id}">
      <div class="stub">${dateTile(o.wantedDate)}<span class="stub-time">${o.wantedTime}</span><span class="rel">${date.rel(o.wantedDate)}</span></div>
      <div class="body">
        <span class="label">Заявка от сайта · ${date.stamp(o.receivedAt)} · ${STATUS[o.status]}</span>
        <h2 style="margin-top:6px">${esc(o.child.name)} навършва ${o.child.age}</h2>
        <p class="sub">${esc(o.program)} · ${o.children} деца · ${esc(o.place)}</p>
        <div class="issues">${o.flags.map((f) => `<div class="issue warning" data-flag="${f}">${icon("alert")}${esc(flagText[f])}</div>`).join("")}</div>
      </div>
    </article>
    <article class="panel" data-order-form="${o.id}">
      <div class="panel-head"><h2>Попълнено във формата</h2></div>
      <dl class="form" style="margin:0">${fields.map(([k, v]) => `<div data-field="${k}"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
      <div class="msg"><span class="label">Съобщение</span><blockquote>${esc(o.message)}</blockquote></div>
      <div class="foot">
        <button class="btn primary" type="button" data-action="book">${icon("calendar")}Запиши парти</button>
        <button class="btn" type="button" data-action="replied">${icon("check")}Отбележи като отговорена</button>
        <span class="spacer"></span>
        <button class="btn ghost" type="button" data-action="decline">${icon("x")}Откажи</button>
      </div>
    </article>`

  // Context: that day's schedule, the family, the price.
  const sameDay = D.bookings.filter((b) => b.date === o.wantedDate).sort((a, b) => a.start.localeCompare(b.start))
  const rows = []
  let placed = false
  for (const b of sameDay) {
    if (!placed && b.start > o.wantedTime) { rows.push("wanted"); placed = true }
    rows.push(b)
  }
  if (!placed) rows.push("wanted")
  // Who knows the program and has no party or leave in the wanted slot. Shown, not chosen.
  const toMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3)
  const wantStart = toMin(o.wantedTime), wantEnd = wantStart + (p ? p.minutes : 120)
  const free = D.animators.filter((a) => a.programs.includes(o.program)
    && !D.leave.some((l) => l.animatorId === a.id && l.status !== "rejected" && l.from <= o.wantedDate && o.wantedDate <= l.to)
    && !sameDay.some((b) => b.animators.includes(a.id) && toMin(b.start) < wantEnd && wantStart < toMin(b.end)))
  const freeText = free.length ? `Свободни и водят ${esc(o.program)}: ${free.map((a) => esc(a.short)).join(", ")}` : `Никой, който води ${esc(o.program)}, не е свободен в този час`
  const dayHtml = rows.map((b) => b === "wanted"
    ? `<div class="dayrow wanted" data-wanted><span class="t">${o.wantedTime}<small>желано</small></span><div><b>${esc(o.child.name)} · ${esc(o.program)}</b><span class="muted" style="display:block;font-size:13px;font-weight:600" data-free="${free.map((a) => a.id).join(" ")}">${freeText}</span></div></div>`
    : `<div class="dayrow" data-booking="${b.id}"><span class="t">${b.start}<small>до ${b.end}</small></span><div><b>${esc(b.child.name)} · ${esc(b.address.district)}</b><div class="crew">${b.animators.map(chip).join("")}</div></div></div>`).join("")
  const fam = o.customerId ? customer(o.customerId) : null
  document.querySelector("[data-side]").innerHTML = `
    <section class="panel" data-context="day">
      <h3>${date.short(o.wantedDate)} в графика</h3>
      <p class="muted" style="font-size:13px;font-weight:600;margin-bottom:6px">${sameDay.length} партита вече са записани за деня.</p>
      ${dayHtml}
    </section>
    <section class="panel" data-context="family">
      <h3>Семейство</h3>
      ${fam ? `<p><b>${esc(fam.parent)}</b></p>` : `<p class="family-empty">Нов клиент: няма предишни партита с този телефон.</p>`}
    </section>
    <section class="panel price" data-context="price">
      <h3>Цена и капаро</h3>
      <div class="facts">
        <div><span>${esc(o.program)}</span>${unset()}</div>
        <div><span>Капаро</span>${unset()}</div>
        <div><span>Срок за капарото</span>${unset()}</div>
      </div>
    </section>`
})()
</script>
</body>
</html>
