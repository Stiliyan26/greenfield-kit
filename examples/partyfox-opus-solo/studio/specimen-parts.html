<style>
  .pf-parts { display: grid; gap: 12px; font-family: var(--font-body); color: var(--color-ink); }
  .pf-booking { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px;
    background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md); }
  .pf-time { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pf-who { display: grid; gap: 2px; min-width: 0; }
  .pf-who strong { font-size: 15px; }
  .pf-who span { font-size: 13px; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-tag { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-sm); white-space: nowrap; }
  .pf-tag.danger { color: var(--status-danger); background: color-mix(in oklab, var(--status-danger) 12%, var(--color-surface)); }
  .pf-tag.warning { color: var(--status-warning); background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); }
  .pf-tag.ok { color: var(--status-ok); background: color-mix(in oklab, var(--status-ok) 12%, var(--color-surface)); }
  .pf-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pf-button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--color-line); background: var(--color-surface); color: var(--color-ink); }
  .pf-button.primary { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
</style>
<div class="pf-parts">
  <div class="pf-booking" data-part="booking-ok">
    <span class="pf-time">10:30</span>
    <span class="pf-who"><strong>Мила, 6 г. · Принцеси</strong><span>Лозенец, ул. „Червена стена“ 14, вх. Б · Ива</span></span>
    <span class="pf-tag ok">Капаро платено</span>
  </div>
  <div class="pf-booking" data-part="booking-danger">
    <span class="pf-time">16:00</span>
    <span class="pf-who"><strong>Ники, 4 г. · Пирати</strong><span>Надежда 2, ул. „Хан Омуртаг“ 7 · Теодора</span></span>
    <span class="pf-tag danger">Няма капаро</span>
  </div>
  <div class="pf-booking" data-part="booking-warning">
    <span class="pf-time">11:00</span>
    <span class="pf-who"><strong>Алекс, 8 г. · Детективи</strong><span>Кръстова вада, зала „Смехорани“</span></span>
    <span class="pf-tag warning">Без аниматор</span>
  </div>
  <div class="pf-actions">
    <button class="pf-button primary" type="button">Одобри отпуската</button>
    <button class="pf-button" type="button">Отбележи капарото</button>
  </div>
</div>
