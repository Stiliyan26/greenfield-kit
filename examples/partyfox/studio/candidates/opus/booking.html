<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Резервация</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
/* Ticket Stub — shared shell. Tokens only. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--color-bg); color: var(--color-ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }
.num, .disp { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--color-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 28px; height: 58px; padding: 0 28px;
  background: var(--color-surface); border-bottom: 1px solid var(--color-line);
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: var(--color-ink); }
.brand svg { width: 28px; height: 28px; }
.brand .fox-a { fill: var(--color-primary); }
.brand .fox-b { fill: var(--color-accent); }
.tabs { display: flex; align-self: stretch; gap: 4px; }
.tabs a {
  display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; font-size: 15px;
  color: var(--color-muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs a:hover { color: var(--color-ink); }
.tabs a[aria-current="page"] { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.tabs .count { font-family: var(--font-display); font-size: 13px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-on-primary); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; width: 240px; padding: 0 12px; border: 1px solid var(--color-line); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-muted); }
.search input { border: 0; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--color-ink); }
.search input::placeholder { color: var(--color-muted); }
.search:focus-within { outline: 3px solid var(--color-primary); outline-offset: 1px; }
.me { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.me b { display: block; font-weight: 600; line-height: 1.2; }
.me span { color: var(--color-muted); font-size: 12.5px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; background: var(--color-primary-soft); color: var(--color-primary); flex: none; }
.page-title-m { display: none; }

/* ---------- bottom nav (phone) ---------- */
.bnav { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px;
  border-radius: var(--radius-md); border: 1px solid var(--color-line); background: var(--color-surface);
  font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; color: var(--color-ink);
  box-shadow: 0 1px 0 color-mix(in oklab, var(--color-line) 70%, transparent);
}
.btn:hover { background: var(--color-surface-2); }
.btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: color-mix(in oklab, var(--color-primary) 88%, var(--color-ink)); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13.5px; }
.btn-quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--color-primary); }
.btn-quiet:hover { background: var(--color-primary-soft); }
.btn .i { width: 16px; height: 16px; }
.icon-btn { width: 38px; padding: 0; }

/* ---------- status marks ---------- */
.badge-danger { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--status-danger); color: var(--color-surface); font-weight: 700; font-size: 12.5px; line-height: 1.35; white-space: nowrap; }
.badge-danger .i { width: 13px; height: 13px; stroke-width: 2.4; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12.5px; line-height: 1.35; white-space: nowrap; border: 1px solid var(--color-line); background: var(--color-surface-2); color: var(--color-muted); }
.tag .i { width: 13px; height: 13px; stroke-width: 2.2; }
.tag-warn { color: var(--status-warning); border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); background: color-mix(in oklab, var(--status-warning) 10%, var(--color-surface)); }
.tag-ok { color: var(--status-ok); border-color: color-mix(in oklab, var(--status-ok) 35%, var(--color-surface)); background: color-mix(in oklab, var(--status-ok) 8%, var(--color-surface)); }
.tag-primary { color: var(--color-primary); border-color: transparent; background: var(--color-primary-soft); }
.tag-sec { color: var(--color-secondary); border-color: transparent; background: var(--color-secondary-soft); }
.tag-accent { color: var(--color-accent); border-color: transparent; background: var(--color-tertiary-soft); }
.ok-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--status-ok); font-weight: 600; font-size: 12.5px; }
.ok-mark .short { display: none; }
.ok-mark .i { width: 14px; height: 14px; stroke-width: 2.4; }
.unset { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border: 1.5px dashed var(--color-line); border-radius: var(--radius-sm); color: var(--color-muted); font-size: 13px; font-weight: 600; white-space: nowrap; }

/* ---------- the ticket (signature) ---------- */
.tk { position: relative; display: block; border-radius: var(--radius-md); color: var(--color-ink); --stub: 62px; --notch: 6px; }
.tk-in {
  position: relative; height: 100%; display: grid; grid-template-columns: var(--stub) minmax(0, 1fr);
  background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md); overflow: hidden;
  -webkit-mask:
    radial-gradient(circle var(--notch) at var(--stub) 0, transparent 96%, var(--color-ink)) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at var(--stub) 100%, transparent 96%, var(--color-ink)) bottom / 100% 51% no-repeat;
  mask:
    radial-gradient(circle var(--notch) at var(--stub) 0, transparent 96%, var(--color-ink)) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at var(--stub) 100%, transparent 96%, var(--color-ink)) bottom / 100% 51% no-repeat;
  box-shadow: 0 1px 2px color-mix(in oklab, var(--color-line) 80%, transparent);
}
a.tk:hover .tk-in { border-color: color-mix(in oklab, var(--color-primary) 45%, var(--color-line)); }
.tk-stub {
  display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 4px 6px 10px;
  background: var(--color-primary-soft); border-right: 2px dashed color-mix(in oklab, var(--color-primary) 30%, var(--color-surface));
  font-family: var(--font-display); line-height: 1.05;
}
.tk-stub b { font-size: 19px; font-weight: 800; color: var(--color-primary); }
.tk-stub span { font-size: 14px; font-weight: 600; color: var(--color-muted); }
.tk-body { min-width: 0; padding: 7px 10px 7px 11px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.tk-title { font-weight: 700; font-size: 15px; line-height: 1.2; }
.tk-sub { color: var(--color-muted); font-size: 13px; line-height: 1.25; }
.tk-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; }
/* missing deposit: the only solid red */
.tk--danger .tk-in { border: 2px solid var(--status-danger); background: color-mix(in oklab, var(--status-danger) 6%, var(--color-surface)); }
.tk--danger .tk-stub { background: var(--status-danger); border-right-color: color-mix(in oklab, var(--status-danger) 50%, var(--color-surface)); }
.tk--danger .tk-stub b, .tk--danger .tk-stub span { color: var(--color-surface); }
/* clash: amber outline, never filled */
.tk--warn .tk-in { border: 2px solid var(--status-warning); }
.tk--warn .tk-stub { background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); border-right-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); }
.tk--warn .tk-stub b { color: var(--status-warning); }
/* no animator: dashed amber */
.tk--open .tk-in { border: 2px dashed var(--status-warning); background: color-mix(in oklab, var(--status-warning) 5%, var(--color-surface)); }
.tk--open .tk-stub { background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); border-right-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); }
.tk--open .tk-stub b { color: var(--status-warning); }
/* next / selected: the one accent */
.tk--next .tk-stub { background: var(--color-accent); border-right-color: color-mix(in oklab, var(--color-accent) 45%, var(--color-surface)); }
.tk--next .tk-stub b, .tk--next .tk-stub span { color: var(--color-on-tertiary); }
.tk:focus-visible { outline-offset: 3px; }

/* ---------- common blocks ---------- */
.panel { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); }
.h-disp { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -0.01em; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; }
.h3 { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.2; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; font-size: 14.5px; }
.dl dt { color: var(--color-muted); }
.dl dd { margin: 0; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--color-line); background: var(--color-surface); font-size: 13.5px; font-weight: 600; color: var(--color-ink); cursor: pointer; white-space: nowrap; }
.chip .n { font-family: var(--font-display); font-weight: 700; color: var(--color-muted); }
.chip[aria-pressed="true"] { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-surface); }
.chip[aria-pressed="true"] .n { color: color-mix(in oklab, var(--color-surface) 75%, var(--color-ink)); }
.chip.warn { border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); color: var(--status-warning); }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  body { font-size: 15px; }
  body > main { align-items: stretch; }
  .top { height: 52px; padding: 0 16px; gap: 10px; }
  .tabs, .search, .me > div { display: none; }
  .brand { font-size: 20px; }
  .top-right { gap: 8px; }
  .avatar { width: 32px; height: 32px; font-size: 14px; }
  .bnav {
    position: sticky; bottom: 0; z-index: 20; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--color-surface); border-top: 1px solid var(--color-line); padding: 6px 6px 10px;
  }
  .bnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; font-size: 12px; font-weight: 600; color: var(--color-muted); border-radius: var(--radius-md); }
  .bnav a .ico { position: relative; display: grid; place-items: center; width: 52px; height: 28px; border-radius: var(--radius-pill); }
  .bnav a .i { width: 21px; height: 21px; }
  .bnav a[aria-current="page"] { color: var(--color-primary); }
  .bnav a[aria-current="page"] .ico { background: var(--color-primary-soft); }
  .bnav .dot { position: absolute; top: -2px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-on-primary); font-family: var(--font-display); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
  .h-disp { font-size: 28px; }
}

main { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 28px 26px; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--color-muted); font-size: 14px; }
.crumb a { color: var(--color-primary); font-weight: 600; }
.crumb .i { width: 14px; height: 14px; }

/* the booking itself, as one big ticket */
.hero { --stub: 150px; --notch: 10px; }
.hero .tk-in { border-radius: var(--radius-lg); }
.hero .tk-stub { padding: 16px 18px; gap: 4px; }
.hero .tk-stub .d { font-family: var(--font-body); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-surface); opacity: 0.92; }
.hero .tk-stub b { font-size: 40px; line-height: 1; }
.hero .tk-stub span.to { font-size: 20px; font-weight: 700; }
.hero .tk-body { padding: 16px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 28px; align-items: center; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--color-muted); font-size: 14.5px; margin-top: 8px; }
.hero .facts span { display: inline-flex; align-items: center; gap: 6px; }
.hero .facts b { color: var(--color-ink); font-weight: 600; }

/* the red deposit block: the only solid red on the screen */
.deposit { display: flex; flex-direction: column; gap: 10px; min-width: 320px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--status-danger); color: var(--color-surface); }
.deposit .big { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1; }
.deposit .big .i { width: 26px; height: 26px; stroke-width: 2.2; }
.deposit p { font-size: 14px; }
.deposit .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.deposit .btn-light { background: var(--color-surface); border-color: var(--color-surface); color: var(--color-ink); }
.deposit .btn-line { background: transparent; border-color: color-mix(in oklab, var(--color-surface) 70%, transparent); color: var(--color-surface); box-shadow: none; }
.deposit .btn-line:hover { background: color-mix(in oklab, var(--color-surface) 14%, transparent); }
.deposit :focus-visible { outline-color: var(--color-surface); }

/* nine steps from site order to pay */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); counter-reset: s; }
.step { position: relative; padding: 30px 8px 0 0; font-size: 13.5px; }
.step::before { content: ""; position: absolute; top: 10px; left: 0; right: 0; height: 3px; background: var(--color-line); }
.step.done::before { background: var(--color-primary); }
.step .dot { position: absolute; top: 0; left: 0; width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; background: var(--color-surface); border: 2px solid var(--color-line); font-family: var(--font-display); font-weight: 700; font-size: 12.5px; color: var(--color-muted); }
.step .dot .i { width: 13px; height: 13px; stroke-width: 3; }
.step.done .dot { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.step.missing .dot { background: var(--status-danger); border-color: var(--status-danger); color: var(--color-surface); }
.step.next .dot { border-color: var(--color-accent); color: var(--color-accent); border-width: 3px; }
.step .l { font-weight: 600; line-height: 1.25; display: block; }
.step .w { color: var(--color-muted); font-size: 12.5px; }
.step.missing .l, .step.missing .w { color: var(--status-danger); }
.step.missing .w { font-weight: 700; }
.step.next .w { color: var(--color-accent); font-weight: 600; }
.step.todo .l { color: var(--color-muted); font-weight: 500; }

.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
.card { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.card .h3 { display: flex; align-items: center; gap: 8px; }
.card .h3 .i { color: var(--color-muted); }
.addr { font-size: 17px; font-weight: 600; line-height: 1.35; }
.addrnote { color: var(--color-muted); font-size: 14px; margin-top: 3px; }
.prov { list-style: none; margin: 0; padding: 0; }
.prov li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--color-line); font-size: 14.5px; }
.prov li:first-child { border-top: 0; padding-top: 0; }
.prov small { display: block; color: var(--color-muted); font-size: 13px; }
.msgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 14px; border-radius: var(--radius-md); background: var(--color-surface-2); font-size: 14px; }
.msg .m { display: flex; gap: 8px; color: var(--color-muted); font-size: 12.5px; margin-bottom: 3px; font-weight: 600; }
.msg.remind { background: color-mix(in oklab, var(--status-danger) 7%, var(--color-surface)); border: 1px solid color-mix(in oklab, var(--status-danger) 30%, var(--color-surface)); }
.fam { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.fam .muted { font-size: 13.5px; }

@media (max-width: 1500px) {
  main { gap: 14px; padding-top: 14px; }
  .hero { --stub: 128px; }
  .hero .tk-stub b { font-size: 34px; }
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
  .cols .c-fam { display: none; }
  .step { font-size: 13px; }
}
@media (max-width: 760px) {
  main { padding: 12px 16px 20px; gap: 14px; }
  .hero { --stub: 92px; --notch: 8px; }
  .hero .tk-stub { padding: 12px; }
  .hero .tk-stub b { font-size: 26px; }
  .hero .tk-stub span.to { font-size: 16px; }
  .hero .tk-stub .d { font-size: 11.5px; }
  .hero .tk-body { grid-template-columns: 1fr; padding: 12px 14px; }
  .hero .h-disp { font-size: 24px; }
  .hero .facts { gap: 4px 14px; font-size: 13.5px; }
  .hero .deposit-slot { display: none; }
  .deposit { min-width: 0; }
  .deposit .big { font-size: 22px; }
  .deposit .acts .btn { flex: 1; }
  .steps { grid-template-columns: 1fr; gap: 0; }
  .step { padding: 0 0 12px 34px; min-height: 36px; }
  .step::before { top: 23px; bottom: 0; left: 10px; right: auto; width: 3px; height: auto; }
  .step:last-child::before { display: none; }
  .step .l, .step .w { display: inline; }
  .step .w::before { content: " · "; }
  .step.done { display: none; }
  .cols { grid-template-columns: 1fr; }
  .cols .c-fam { display: flex; }
}
.steps .more { padding: 0 0 12px 34px; color: var(--color-muted); font-size: 13px; position: relative; }
.steps .more::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: var(--color-primary); }
@media (min-width: 761px) { .steps .more { display: none; } }
.deposit-m { display: none; }
@media (max-width: 760px) { .deposit-m { display: flex; } }
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="bnav"></nav>
<script>
// Ticket Stub — shared helpers. Data comes only from window.PARTYFOX.
const D = window.PARTYFOX
const Q = location.search
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
const link = (screen) => `${screen}.html${Q}`
const animator = (id) => D.animators.find((a) => a.id === id)
const hh = (n) => `${String(Math.floor(n)).padStart(2, "0")}:${n % 1 ? String(Math.round((n % 1) * 60)).padStart(2, "0") : "00"}`
const customer = (id) => D.customers.find((c) => c.id === id)
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`

const ICONS = {
  day: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  inbox: '<path d="M4 13.5 6.5 5h11l2.5 8.5V19H4z"/><path d="M4 13.5h4.5l1.2 2h4.6l1.2-2H20"/>',
  leave: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  people: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.5 14.6c2.3.2 4 1.7 4.5 4.4"/>',

const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`

const FOX = '<svg viewBox="0 0 32 32" aria-hidden="true"><path class="fox-a" d="M3 3l8.5 7h9L29 3l-2 14-11 12L5 17z"/><path class="fox-b" d="M16 29l-5-9.5h10z"/></svg>'

const OWNER_TABS = [
  { id: "ops-day", label: "Ден", m: "Ден", icon: "day" },
  { id: "inbox", label: "Поръчки", m: "Поръчки", icon: "inbox", count: () => D.orders.filter((o) => o.state !== "scheduled").length },
  { id: "leave-requests", label: "Отпуски", m: "Отпуски", icon: "leave", count: () => D.leaveRequests.filter((l) => l.state === "pending").length },
  { id: "customers", label: "Клиенти", m: "Клиенти", icon: "people" },
]
const ANIMATOR_TABS = [
  { id: "my-parties", label: "Моите партита", m: "Партита", icon: "balloon" },
  { id: "my-leave", label: "Отпуск", m: "Отпуск", icon: "leave" },
  { id: "my-pay", label: "Заплащане", m: "Заплащане", icon: "wallet" },
]

// Renders the top bar and the phone tab bar. `active` is the tab to mark.
function shell({ role, active, title }) {
  const tabs = role === "owner" ? OWNER_TABS : ANIMATOR_TABS
  const me = role === "owner"
    ? `<div class="me" data-user="owner"><span class="avatar">С</span><div><b>Собственик</b><span>PartyFox</span></div></div>`
    : (() => { const a = animator(D.me); return `<div class="me" data-user="${a.id}"><span class="avatar">${esc(a.name[0])}</span><div><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div></div>` })()
  const tabLinks = tabs.map((t) => {
    const n = t.count ? t.count() : 0
    return `<a href="${link(t.id)}" data-tab="${t.id}"${t.id === active ? ' aria-current="page"' : ""}>${icon(t.icon)}${t.label}${n ? `<span class="count" aria-label="${n} чакат">${n}</span>` : ""}</a>`
  }).join("")
  const top = document.getElementById("top")
  top.className = "top"
  top.innerHTML = `
    <a class="brand" href="${link(tabs[0].id)}" aria-label="PartyFox">${FOX}<span>PartyFox</span></a>
    <span class="page-title-m">${esc(title)}</span>
    <nav class="tabs" aria-label="Основни">${tabLinks}</nav>
    <div class="top-right">
      ${role === "owner" ? `<label class="search">${icon("search")}<input type="search" aria-label="Търсене" placeholder="Търси парти"></label>` : ""}
      ${me}
    </div>`
  const nav = document.getElementById("bnav")
  nav.className = "bnav"
  nav.setAttribute("aria-label", "Основни")
  nav.innerHTML = tabs.map((t) => {
    const n = t.count ? t.count() : 0
    return `<a href="${link(t.id)}" data-tab="${t.id}"${t.id === active ? ' aria-current="page"' : ""}><span class="ico">${icon(t.icon)}${n ? `<span class="dot">${n}</span>` : ""}</span>${t.m}</a>`
  }).join("")
}

// One party ticket. opts: { start, end, title, sub, foot, kind, href, data, extra }
function ticket(o) {
  const tag = o.href ? "a" : "div"
  const href = o.href ? ` href="${o.href}"` : ""
  const kind = o.kind ? ` tk--${o.kind}` : ""
  return `<${tag} class="tk${kind}${o.cls ? " " + o.cls : ""}"${href}${o.data || ""}${o.style ? ` style="${o.style}"` : ""}>
    <span class="tk-in">
      <span class="tk-stub"><b>${o.start}</b>${o.end ? `<span>${o.end}</span>` : ""}</span>
      <span class="tk-body">
        <span class="tk-title">${o.title}</span>
        ${o.sub ? `<span class="tk-sub">${o.sub}</span>` : ""}
        ${o.extra || ""}
        ${o.foot ? `<span class="tk-foot">${o.foot}</span>` : ""}
      </span>
    </span>
  </${tag}>`
}
const depositMissing = () => `<span class="badge-danger">${icon("alert")}Депозит липсва</span>`
const depositOk = () => `<span class="ok-mark">${icon("check")}<span class="long">Депозит платен</span><span class="short">Платен</span></span>`
const unsetMoney = (label = "не е зададено") => `<span class="unset" data-unset="money">— ${label}</span>`

    <div class="acts">
      <button class="btn btn-light" data-action="deposit-received">${icon("check")}Маркирай като получен</button>
      <button class="btn btn-line">${icon("bell")}Напомни пак</button>
    </div>

const stepHtml = (s, i) => {
  const mark = s.state === "done" ? icon("check") : s.state === "missing" ? "!" : i + 1
  const when = s.state === "missing" ? "Не е получен" : s.when || "предстои"
  return `<li class="step ${s.state}" data-step="${i + 1}"><span class="dot">${mark}</span><span class="l">${esc(s.label)}</span><span class="w">${esc(when)}</span></li>`
}
