<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Оперативен ден</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
/* Ticket Stub — shared shell. Tokens only. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--color-bg); color: var(--color-ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }
.num, .disp { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--color-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 28px; height: 58px; padding: 0 28px;
  background: var(--color-surface); border-bottom: 1px solid var(--color-line);
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: var(--color-ink); }
.brand svg { width: 28px; height: 28px; }
.brand .fox-a { fill: var(--color-primary); }
.brand .fox-b { fill: var(--color-accent); }
.tabs { display: flex; align-self: stretch; gap: 4px; }
.tabs a {
  display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; font-size: 15px;
  color: var(--color-muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs a:hover { color: var(--color-ink); }
.tabs a[aria-current="page"] { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.tabs .count { font-family: var(--font-display); font-size: 13px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-on-primary); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; width: 240px; padding: 0 12px; border: 1px solid var(--color-line); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-muted); }
.search input { border: 0; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--color-ink); }
.search input::placeholder { color: var(--color-muted); }
.search:focus-within { outline: 3px solid var(--color-primary); outline-offset: 1px; }
.me { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.me b { display: block; font-weight: 600; line-height: 1.2; }
.me span { color: var(--color-muted); font-size: 12.5px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; background: var(--color-primary-soft); color: var(--color-primary); flex: none; }
.page-title-m { display: none; }

/* ---------- bottom nav (phone) ---------- */
.bnav { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px;
  border-radius: var(--radius-md); border: 1px solid var(--color-line); background: var(--color-surface);
  font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; color: var(--color-ink);
  box-shadow: 0 1px 0 color-mix(in oklab, var(--color-ink) 6%, transparent);
}
.btn:hover { background: var(--color-surface-2); }
.btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: color-mix(in oklab, var(--color-primary) 88%, var(--color-ink)); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13.5px; }
.btn-quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--color-primary); }
.btn-quiet:hover { background: var(--color-primary-soft); }
.btn .i { width: 16px; height: 16px; }
.icon-btn { width: 38px; padding: 0; }

/* ---------- status marks ---------- */
.badge-danger { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--status-danger); color: var(--color-surface); font-weight: 700; font-size: 12.5px; line-height: 1.35; white-space: nowrap; }
.badge-danger .i { width: 13px; height: 13px; stroke-width: 2.4; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12.5px; line-height: 1.35; white-space: nowrap; border: 1px solid var(--color-line); background: var(--color-surface-2); color: var(--color-muted); }
.tag .i { width: 13px; height: 13px; stroke-width: 2.2; }
.tag-warn { color: var(--status-warning); border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); background: color-mix(in oklab, var(--status-warning) 10%, var(--color-surface)); }
.tag-ok { color: var(--status-ok); border-color: color-mix(in oklab, var(--status-ok) 35%, var(--color-surface)); background: color-mix(in oklab, var(--status-ok) 8%, var(--color-surface)); }
.tag-primary { color: var(--color-primary); border-color: transparent; background: var(--color-primary-soft); }
.tag-sec { color: var(--color-secondary); border-color: transparent; background: var(--color-secondary-soft); }
.tag-accent { color: var(--color-accent); border-color: transparent; background: var(--color-tertiary-soft); }
.ok-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--status-ok); font-weight: 600; font-size: 12.5px; }
.ok-mark .short { display: none; }
.ok-mark .i { width: 14px; height: 14px; stroke-width: 2.4; }
.unset { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border: 1.5px dashed var(--color-line); border-radius: var(--radius-sm); color: var(--color-muted); font-size: 13px; font-weight: 600; white-space: nowrap; }

/* ---------- the ticket (signature) ---------- */
.tk { position: relative; display: block; border-radius: var(--radius-md); color: var(--color-ink); --stub: 62px; --notch: 6px; }
.tk-in {
  position: relative; height: 100%; display: grid; grid-template-columns: var(--stub) minmax(0, 1fr);
  background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md); overflow: hidden;
  -webkit-mask:
    radial-gradient(circle var(--notch) at var(--stub) 0, transparent 96%, var(--color-ink)) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at var(--stub) 100%, transparent 96%, var(--color-ink)) bottom / 100% 51% no-repeat;
  mask:
    radial-gradient(circle var(--notch) at var(--stub) 0, transparent 96%, var(--color-ink)) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at var(--stub) 100%, transparent 96%, var(--color-ink)) bottom / 100% 51% no-repeat;
  box-shadow: 0 1px 2px color-mix(in oklab, var(--color-ink) 8%, transparent);
}
a.tk:hover .tk-in { border-color: color-mix(in oklab, var(--color-primary) 45%, var(--color-line)); }
.tk-stub {
  display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 4px 6px 10px;
  background: var(--color-primary-soft); border-right: 2px dashed color-mix(in oklab, var(--color-primary) 30%, var(--color-surface));
  font-family: var(--font-display); line-height: 1.05;
}
.tk-stub b { font-size: 19px; font-weight: 800; color: var(--color-primary); }
.tk-stub span { font-size: 14px; font-weight: 600; color: var(--color-muted); }
.tk-body { min-width: 0; padding: 7px 10px 7px 11px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.tk-title { font-weight: 700; font-size: 15px; line-height: 1.2; }
.tk-sub { color: var(--color-muted); font-size: 13px; line-height: 1.25; }
.tk-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; }
/* missing deposit: the only solid red */
.tk--danger .tk-in { border: 2px solid var(--status-danger); background: color-mix(in oklab, var(--status-danger) 6%, var(--color-surface)); }
.tk--danger .tk-stub { background: var(--status-danger); border-right-color: color-mix(in oklab, var(--status-danger) 50%, var(--color-surface)); }
.tk--danger .tk-stub b, .tk--danger .tk-stub span { color: var(--color-surface); }
/* clash: amber outline, never filled */
.tk--warn .tk-in { border: 2px solid var(--status-warning); }
.tk--warn .tk-stub { background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); border-right-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); }
.tk--warn .tk-stub b { color: var(--status-warning); }
/* no animator: dashed amber */
.tk--open .tk-in { border: 2px dashed var(--status-warning); background: color-mix(in oklab, var(--status-warning) 5%, var(--color-surface)); }
.tk--open .tk-stub { background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); border-right-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); }
.tk--open .tk-stub b { color: var(--status-warning); }
/* next / selected: the one accent */
.tk--next .tk-stub { background: var(--color-accent); border-right-color: color-mix(in oklab, var(--color-accent) 45%, var(--color-surface)); }
.tk--next .tk-stub b, .tk--next .tk-stub span { color: var(--color-on-tertiary); }
.tk:focus-visible { outline-offset: 3px; }

/* ---------- common blocks ---------- */
.panel { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted); }
.h-disp { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -0.01em; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; }
.h3 { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.2; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; font-size: 14.5px; }
.dl dt { color: var(--color-muted); }
.dl dd { margin: 0; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--color-line); background: var(--color-surface); font-size: 13.5px; font-weight: 600; color: var(--color-ink); cursor: pointer; white-space: nowrap; }
.chip .n { font-family: var(--font-display); font-weight: 700; color: var(--color-muted); }
.chip[aria-pressed="true"] { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-surface); }
.chip[aria-pressed="true"] .n { color: color-mix(in oklab, var(--color-surface) 75%, var(--color-ink)); }
.chip.warn { border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-surface)); color: var(--status-warning); }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  body { font-size: 15px; }
  body > main { align-items: stretch; }
  .top { height: 52px; padding: 0 16px; gap: 10px; }
  .tabs, .search, .me > div { display: none; }
  .brand { font-size: 20px; }
  .top-right { gap: 8px; }
  .avatar { width: 32px; height: 32px; font-size: 14px; }
  .bnav {
    position: sticky; bottom: 0; z-index: 20; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--color-surface); border-top: 1px solid var(--color-line); padding: 6px 6px 10px;
  }
  .bnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; font-size: 12px; font-weight: 600; color: var(--color-muted); border-radius: var(--radius-md); }
  .bnav a .ico { position: relative; display: grid; place-items: center; width: 52px; height: 28px; border-radius: var(--radius-pill); }
  .bnav a .i { width: 21px; height: 21px; }
  .bnav a[aria-current="page"] { color: var(--color-primary); }
  .bnav a[aria-current="page"] .ico { background: var(--color-primary-soft); }
  .bnav .dot { position: absolute; top: -2px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-on-primary); font-family: var(--font-display); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
  .h-disp { font-size: 28px; }
}

main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 28px 24px; min-height: 0; }
.dayhead { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.dayhead .meta { color: var(--color-muted); font-size: 15px; margin-top: 4px; }
.dayhead .meta b { color: var(--color-ink); font-weight: 600; }
.dayhead .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--color-line); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
.seg button { border: 0; background: transparent; height: 36px; padding: 0 14px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--color-muted); }
.seg button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-surface); }

/* issues pinned above the roster */
.issues { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.issues-label { display: flex; flex-direction: column; justify-content: center; padding-right: 6px; }
.issues-label .n { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 0.9; }
.issues-label .eyebrow { margin-top: 4px; }
.issue { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md); border-top: 4px solid var(--status-warning); }
.issue--danger { border-top-color: var(--status-danger); }
.issue .t { font-weight: 700; font-size: 15px; }
.issue .hd { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.issue .hd .num { margin-left: auto; color: var(--color-muted); font-size: 15px; font-weight: 600; }
.issue .d { color: var(--color-muted); font-size: 13.5px; line-height: 1.35; }
.issue .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; align-items: center; }
.pick { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 4px; border-radius: var(--radius-pill); border: 1px solid var(--color-line); background: var(--color-surface); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.pick .avatar { width: 22px; height: 22px; font-size: 12px; }
.pick:hover { border-color: var(--color-primary); color: var(--color-primary); }
.pick small { color: var(--color-muted); font-weight: 500; font-size: 12px; }

/* roster: one row per animator, hours across */
.roster { flex: 1; min-height: 0; display: grid; grid-template-columns: 190px minmax(0, 1fr); background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); overflow: hidden; }
.roster .corner { border-bottom: 1px solid var(--color-line); border-right: 1px solid var(--color-line); padding: 8px 14px; display: flex; align-items: center; }
.hours { position: relative; height: 34px; border-bottom: 1px solid var(--color-line); }
.hours span { position: absolute; top: 9px; transform: translateX(-50%); font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--color-muted); }
.hours span:first-child { transform: none; padding-left: 6px; }
.who { padding: 12px 14px; border-right: 1px solid var(--color-line); border-bottom: 1px solid var(--color-line); display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.who .name { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; }
.who .role { color: var(--color-muted); font-size: 13px; padding-left: 43px; }
.who .tag { align-self: flex-start; margin-left: 43px; margin-top: 3px; }
.who--open .avatar { background: color-mix(in oklab, var(--status-warning) 14%, var(--color-surface)); color: var(--status-warning); border: 1.5px dashed var(--status-warning); }
.lane { position: relative; border-bottom: 1px solid var(--color-line); background: repeating-linear-gradient(90deg, var(--color-line) 0 1px, transparent 1px calc(100% / 12)); background-color: var(--color-surface); }
.roster > :nth-last-child(-n+2) { border-bottom: 0; }
.lane .tk { position: absolute; container-type: size; }
}
.lane .tk .tk-body { padding-top: 5px; padding-bottom: 5px; gap: 1px; }
.lane .tk .tk-foot { margin-top: 2px; }
.lane .tk .tk-sub { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.lane .tk .addr { color: var(--color-muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.leave { position: absolute; top: 8px; bottom: 8px; border-radius: var(--radius-md); border: 1px solid var(--color-line); background: repeating-linear-gradient(135deg, var(--color-surface-2) 0 7px, var(--color-surface) 7px 14px); display: flex; flex-direction: column; justify-content: center; padding: 6px 12px; color: var(--color-muted); font-size: 13px; }
.leave b { color: var(--color-ink); font-weight: 600; font-size: 13.5px; }
.clashband { position: absolute; height: 20px; border-radius: var(--radius-sm); background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--status-warning) 26%, var(--color-surface)) 0 5px, var(--color-surface) 5px 10px); border: 1px solid var(--status-warning); }
.clashlabel { position: absolute; height: 20px; display: flex; align-items: center; gap: 4px; padding-left: 8px; color: var(--status-warning); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.clashlabel .i { width: 14px; height: 14px; stroke-width: 2.2; }

/* phone list, hidden on wide screens */
.plist { display: none; }

@media (max-width: 1500px) {
  .issues { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .issues-label { display: none; }
  .roster { grid-template-columns: 160px minmax(0, 1fr); }
  .who .role, .who .tag { padding-left: 0; margin-left: 0; }
  .who .name .avatar { display: none; }
}
@media (max-width: 760px) {
  main { padding: 14px 16px 20px; gap: 14px; }
  .dayhead { gap: 10px; align-items: center; }
  .dayhead .h-disp { font-size: 24px; }
  .dayhead .meta { font-size: 14px; margin-top: 2px; }
  .dayhead .tools { margin-left: 0; width: 100%; }
  .dayhead .tools .seg, .dayhead .tools .btn-primary span { display: none; }
  .dayhead .tools .btn-primary { margin-left: auto; }
  .issues { grid-template-columns: 1fr; gap: 8px; }
  .issue { padding: 10px 12px; gap: 4px; border-top-width: 3px; }
  .issue .d { font-size: 13px; }
  .roster { display: none; }
  .plist { display: flex; flex-direction: column; gap: 8px; }
  .plist .tk { min-height: 70px; }
  .plist .who-line { color: var(--color-muted); font-size: 13px; }
  .plist .who-line b { color: var(--color-ink); font-weight: 600; }
  .plist .leave-line { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px dashed var(--color-line); border-radius: var(--radius-md); color: var(--color-muted); font-size: 13.5px; background: repeating-linear-gradient(135deg, var(--color-surface-2) 0 7px, var(--color-bg) 7px 14px); }
  .plist .leave-line b { color: var(--color-ink); font-family: var(--font-display); font-size: 16px; }
}
@container (max-height: 100px) { .lane .tk .addr { display: none; } }
@container (max-width: 215px) {
  .tk .tk-in { --stub: 54px; }
  .tk .tk-stub { padding-left: 8px; }
  .tk .tk-stub b { font-size: 17px; }
  .tk .tk-body { padding: 6px 8px; }
  .tk .badge-danger .i, .tk .tag .i { display: none; }
  .tk .ok-mark .long { display: none; }
  .tk .ok-mark .short { display: inline; }
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="bnav"></nav>
<script>
// Ticket Stub — shared helpers. Data comes only from window.PARTYFOX.
const D = window.PARTYFOX
const Q = location.search
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
const link = (screen) => `${screen}.html${Q}`
const animator = (id) => D.animators.find((a) => a.id === id)
const hh = (n) => `${String(Math.floor(n)).padStart(2, "0")}:${n % 1 ? String(Math.round((n % 1) * 60)).padStart(2, "0") : "00"}`
const customer = (id) => D.customers.find((c) => c.id === id)
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`

const ICONS = {
  day: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  inbox: '<path d="M4 13.5 6.5 5h11l2.5 8.5V19H4z"/><path d="M4 13.5h4.5l1.2 2h4.6l1.2-2H20"/>',
  leave: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',

const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`

const FOX = '<svg viewBox="0 0 32 32" aria-hidden="true"><path class="fox-a" d="M3 3l8.5 7h9L29 3l-2 14-11 12L5 17z"/><path class="fox-b" d="M16 29l-5-9.5h10z"/></svg>'

const OWNER_TABS = [
  { id: "ops-day", label: "Ден", m: "Ден", icon: "day" },
  { id: "inbox", label: "Поръчки", m: "Поръчки", icon: "inbox", count: () => D.orders.filter((o) => o.state !== "scheduled").length },
  { id: "leave-requests", label: "Отпуски", m: "Отпуски", icon: "leave", count: () => D.leaveRequests.filter((l) => l.state === "pending").length },
  { id: "customers", label: "Клиенти", m: "Клиенти", icon: "people" },
]
const ANIMATOR_TABS = [
  { id: "my-parties", label: "Моите партита", m: "Партита", icon: "balloon" },
  { id: "my-leave", label: "Отпуск", m: "Отпуск", icon: "leave" },
  { id: "my-pay", label: "Заплащане", m: "Заплащане", icon: "wallet" },
]

// Renders the top bar and the phone tab bar. `active` is the tab to mark.
function shell({ role, active, title }) {
  const tabs = role === "owner" ? OWNER_TABS : ANIMATOR_TABS
  const me = role === "owner"
    ? `<div class="me" data-user="owner"><span class="avatar">С</span><div><b>Собственик</b><span>PartyFox</span></div></div>`
    : (() => { const a = animator(D.me); return `<div class="me" data-user="${a.id}"><span class="avatar">${esc(a.name[0])}</span><div><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div></div>` })()
  const tabLinks = tabs.map((t) => {
    const n = t.count ? t.count() : 0
    return `<a href="${link(t.id)}" data-tab="${t.id}"${t.id === active ? ' aria-current="page"' : ""}>${icon(t.icon)}${t.label}${n ? `<span class="count" aria-label="${n} чакат">${n}</span>` : ""}</a>`
  }).join("")
  const top = document.getElementById("top")
  top.className = "top"
  top.innerHTML = `
    <a class="brand" href="${link(tabs[0].id)}" aria-label="PartyFox">${FOX}<span>PartyFox</span></a>
    <span class="page-title-m">${esc(title)}</span>
    <nav class="tabs" aria-label="Основни">${tabLinks}</nav>
    <div class="top-right">
      ${role === "owner" ? `<label class="search">${icon("search")}<input type="search" aria-label="Търсене" placeholder="Търси парти"></label>` : ""}
      ${me}
    </div>`
  const nav = document.getElementById("bnav")
  nav.className = "bnav"
  nav.setAttribute("aria-label", "Основни")
  nav.innerHTML = tabs.map((t) => {
    const n = t.count ? t.count() : 0
    return `<a href="${link(t.id)}" data-tab="${t.id}"${t.id === active ? ' aria-current="page"' : ""}><span class="ico">${icon(t.icon)}${n ? `<span class="dot">${n}</span>` : ""}</span>${t.m}</a>`
  }).join("")
}

// One party ticket. opts: { start, end, title, sub, foot, kind, href, data, extra }
function ticket(o) {
  const tag = o.href ? "a" : "div"
  const href = o.href ? ` href="${o.href}"` : ""
  const kind = o.kind ? ` tk--${o.kind}` : ""
  return `<${tag} class="tk${kind}${o.cls ? " " + o.cls : ""}"${href}${o.data || ""}${o.style ? ` style="${o.style}"` : ""}>
    <span class="tk-in">
      <span class="tk-stub"><b>${o.start}</b>${o.end ? `<span>${o.end}</span>` : ""}</span>
      <span class="tk-body">
        <span class="tk-title">${o.title}</span>
        ${o.sub ? `<span class="tk-sub">${o.sub}</span>` : ""}
        ${o.extra || ""}
        ${o.foot ? `<span class="tk-foot">${o.foot}</span>` : ""}
      </span>
    </span>
  </${tag}>`
}
const depositMissing = () => `<span class="badge-danger">${icon("alert")}Депозит липсва</span>`
const depositOk = () => `<span class="ok-mark">${icon("check")}<span class="long">Депозит платен</span><span class="short">Платен</span></span>`
const unsetMoney = (label = "не е зададено") => `<span class="unset" data-unset="money">— ${label}</span>`

shell({ role: "owner", active: "ops-day", title: "Ден" })
const H0 = D.hours.start, H1 = D.hours.end, SPAN = H1 - H0
const pct = (h) => ((h - H0) / SPAN) * 100
const bookings = [...D.bookings].sort((a, b) => a.start - b.start)
const clashes = bookings.filter((b) => b.clashWith).map((b) => {
  const other = D.bookings.find((x) => x.id === b.clashWith)
  return { a: other, b, from: Math.max(other.start, b.start), to: Math.min(other.end, b.end) }
})
const clashIds = new Set(clashes.flatMap((c) => [c.a.id, c.b.id]))
const overlaps = (a, b) => a.start < b.end && b.start < a.end

function kindOf(b) {
  if (!b.deposit) return "danger"
  if (!b.animator) return "open"
  if (clashIds.has(b.id)) return "warn"
  return ""
}
function foot(b) {
  if (!b.deposit) return depositMissing()
  if (!b.animator) return `<span class="tag tag-warn">${icon("alert")}Без аниматор</span>`
  if (clashIds.has(b.id)) return `<span class="tag tag-warn">${icon("alert")}Застъпване</span>`
  return depositOk()
}
function bookingTicket(b, extra = "") {
  return ticket({
    start: hh(b.start), end: hh(b.end), kind: kindOf(b), href: b.id === D.booking.id ? link("booking") : "#",
    title: `${esc(b.child)}, ${b.age} г.`, sub: esc(b.package), foot: foot(b), extra,
    data: ` data-booking="${b.id}" title="${esc(b.child)} · ${hh(b.start)}–${hh(b.end)} · ${esc(b.address)}"`,
  })
}

// free animators for a booking: no overlapping party, no leave at that time
function freeFor(b) {
  return D.animators.map((a) => {
    const busy = D.bookings.some((x) => x.animator === a.id && overlaps(x, b))
    const away = D.leave.some((l) => l.animator === a.id && l.from < b.end && b.start < l.to)
    const back = D.bookings.find((x) => x.animator === a.id && x.end === b.start)
    return { a, free: !busy && !away, back }
  }).filter((x) => x.free)
}

const missing = bookings.filter((b) => !b.deposit)
const open = bookings.filter((b) => !b.animator)
const issueCards = [
  ...missing.map((b) => `
    <article class="issue issue--danger" data-issue="deposit" data-booking="${b.id}">
      <div class="hd">${depositMissing()}<span class="t">${esc(b.child)}, ${b.age} г. · ${esc(b.package)}</span><span class="num">${hh(b.start)}</span></div>
      <div class="d">Аниматор ${esc(animator(b.animator).name)}. ${esc(D.booking.depositNote)}</div>
      <div class="acts"><button class="btn btn-primary btn-sm" data-action="deposit-received">${icon("check")}Депозитът е получен</button><a class="btn btn-sm" href="${link("booking")}">Отвори</a></div>
    </article>`),
  ...clashes.map((c) => `
    <article class="issue" data-issue="clash" data-booking="${c.b.id}">
      <div class="hd"><span class="tag tag-warn">${icon("alert")}Застъпване</span><span class="t">${esc(animator(c.b.animator).name)} е на две партита</span><span class="num">${hh(c.from)}–${hh(c.to)}</span></div>
      <div class="d">${esc(c.a.child)} ${hh(c.a.start)}–${hh(c.a.end)} и ${esc(c.b.child)} ${hh(c.b.start)}–${hh(c.b.end)}. Свободни за ${esc(c.b.child)}:</div>
      <div class="acts">${freeFor(c.b).map((f) => `<button class="pick" data-assign="${f.a.id}" data-booking="${c.b.id}"><span class="avatar">${esc(f.a.name[0])}</span>${esc(f.a.name)}</button>`).join("") || '<span class="muted">никой</span>'}</div>
    </article>`),
  ...open.map((b) => `
    <article class="issue" data-issue="unassigned" data-booking="${b.id}">
      <div class="hd"><span class="tag tag-warn">${icon("alert")}Без аниматор</span><span class="t">${esc(b.child)}, ${b.age} г. · ${esc(b.package)}</span><span class="num">${hh(b.start)}–${hh(b.end)}</span></div>
      <div class="d">Свободни в ${hh(b.start)}:</div>
      <div class="acts">${freeFor(b).map((f) => `<button class="pick" data-assign="${f.a.id}" data-booking="${b.id}"${f.back ? ` title="Свършва ${esc(f.back.child)} в ${hh(f.back.end)}"` : ""}><span class="avatar">${esc(f.a.name[0])}</span>${esc(f.a.name)}${f.back ? `<small>след ${hh(f.back.end)}</small>` : ""}</button>`).join("")}</div>
    </article>`),
]

// roster rows
const TK_MIN = 72, GAP = 22
const rows = D.animators.map((a) => {
  const mine = bookings.filter((b) => b.animator === a.id)
  const subs = []
  mine.forEach((b) => {
    let i = subs.findIndex((lane) => lane.every((x) => !overlaps(x, b)))
    if (i < 0) { subs.push([]); i = subs.length - 1 }
    subs[i].push(b); b._sub = i
  })
  return { a, mine, subs: Math.max(1, subs.length), leave: D.leave.filter((l) => l.animator === a.id) }
})
rows.push({ open: true, mine: open.map((b) => ((b._sub = 0), b)), subs: 1, leave: [] })

function laneHtml(r) {
  const n = r.subs
  const pad = 7
  const items = r.mine.map((b) => {
    const top = n === 1 ? `${pad}px` : `calc(${b._sub} * (100% - ${2 * pad}px + ${GAP}px) / ${n} + ${pad}px)`
    const height = n === 1 ? `calc(100% - ${2 * pad}px)` : `calc((100% - ${2 * pad}px - ${(n - 1) * GAP}px) / ${n})`
    const html = bookingTicket(b, `<span class="addr">${esc(b.address)}</span>`)
    return html.replace('class="tk', `style="left:calc(${pct(b.start)}% + 3px);width:calc(${pct(b.end) - pct(b.start)}% - 6px);top:${top};height:${height}" class="tk`)
  }).join("")
  const leave = r.leave.map((l) => `<div class="leave" data-leave="${r.a.id}" style="left:calc(${pct(l.from)}% + 3px);width:calc(${pct(l.to) - pct(l.from)}% - 6px)"><b>Отпуск · ${hh(l.from)}–${hh(l.to)}</b><span>одобрен</span></div>`).join("")
  const clash = !r.open && clashes.filter((c) => c.b.animator === r.a.id).map((c) => `
      <div class="clashband" data-clash="${c.b.id}" style="left:${pct(c.from)}%;width:${pct(c.to) - pct(c.from)}%;top:calc(50% - 10px)"></div>
      <div class="clashlabel" style="left:${pct(c.to)}%;top:calc(50% - 10px)">${icon("alert")}Застъпване ${hh(c.from)}–${hh(c.to)}</div>`).join("") || ""
  return `<div class="lane" data-lane="${r.open ? "open" : r.a.id}">${leave}${clash}${items}</div>`
}
function whoHtml(r) {
  if (r.open) return `<div class="who who--open" data-row="open"><div class="name"><span class="avatar">?</span>Без аниматор</div><span class="tag tag-warn">${plural(r.mine.length, "парти", "партита")}</span></div>`
  const a = r.a
  const flags = []
  if (clashes.some((c) => c.b.animator === a.id)) flags.push(`<span class="tag tag-warn">${icon("alert")}Застъпване</span>`)
  return `<div class="who" data-row="${a.id}"><div class="name"><span class="avatar">${esc(a.name[0])}</span>${esc(a.name)}</div><span class="role">${esc(a.role)}<br>${plural(r.mine.length, "парти", "партита")}</span>${flags.join("")}</div>`
}
const hourLabels = Array.from({ length: SPAN }, (_, i) => `<span style="left:${(i / SPAN) * 100}%">${hh(H0 + i)}</span>`).join("")
const rosterRows = rows.map((r) => `minmax(${r.subs * TK_MIN + (r.subs - 1) * GAP + 14}px, ${r.subs}fr)`).join(" ")

// phone: one list by start time, with the leave in its place
const plist = []
let leaveShown = false
bookings.forEach((b) => {
  D.leave.forEach((l) => { if (!leaveShown && l.from <= b.start) { leaveShown = true; plist.push(`<div class="leave-line" data-leave="${l.animator}"><b>${hh(l.from)}–${hh(l.to)}</b><span>${esc(animator(l.animator).name)} е в отпуск (одобрен)</span></div>`) } })
  const who = b.animator ? `<span class="who-line">Аниматор <b>${esc(animator(b.animator).name)}</b></span>` : ""
  plist.push(bookingTicket(b, who))
})

const s = D.summary
document.getElementById("app").innerHTML = `
  <section class="dayhead" data-section="day">
    <div>
      <h1 class="h-disp">${esc(D.day)}</h1>
      <p class="meta"><b>${plural(s.parties, "парти", "партита")}</b> · ${plural(D.animators.length, "аниматор", "аниматора")} · ${plural(D.leave.length, "отпуск", "отпуска")}</p>
    </div>
    <div class="tools">
      <button class="btn icon-btn" aria-label="Предишен ден">${icon("left")}</button>
      <button class="btn">Днес</button>
      <button class="btn icon-btn" aria-label="Следващ ден">${icon("right")}</button>
      <div class="seg" role="group" aria-label="Изглед"><button aria-pressed="true">Ден</button><button aria-pressed="false">Седмица</button></div>
      <button class="btn btn-primary">${icon("plus")}<span>Ново парти</span></button>
    </div>
  </section>
  <section class="issues" aria-label="Нужно внимание" data-section="issues">
    <div class="issues-label"><span class="n">${issueCards.length}</span><span class="eyebrow">за решаване</span></div>
    ${issueCards.join("")}
  </section>
  <section class="roster" style="grid-template-rows:34px ${rosterRows}" aria-label="График по аниматори" data-section="roster">
    <div class="corner eyebrow">Аниматор</div>
    <div class="hours" aria-hidden="true">${hourLabels}</div>
    ${rows.map((r) => whoHtml(r) + laneHtml(r)).join("")}
  </section>
  <section class="plist" aria-label="Партита по час" data-section="list">
    <h2 class="eyebrow">Партита по час</h2>
    ${plist.join("")}
  </section>`
</script>
</body>
</html>
