<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отпуски — PartyFox</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }

  .page { max-width: 1100px; margin: 0 auto; padding: clamp(16px, 2.4vw, 36px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .02em; color: var(--color-primary); }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-tertiary); }
  .role { font-size: 12px; color: var(--color-muted); text-transform: uppercase; letter-spacing: .08em; }

  h1.heading { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 2.6vw, 32px); margin: 0 0 10px; border-bottom: 4px double var(--color-ink); padding-bottom: 10px; }
  .sub { color: var(--color-muted); margin: 8px 0 18px; font-size: 14px; }

  .chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 14px; border-radius: 0 var(--radius-pill) var(--radius-pill) 0; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--color-line); background: var(--color-surface-2); color: var(--color-muted); }
  .chip::before { content: ""; position: absolute; left: -1px; top: 50%; width: 8px; height: 8px; background: var(--color-bg); border-radius: 50%; transform: translate(-50%, -50%); border: 1px solid var(--color-line); }
  .chip[data-status="ok"] { background: color-mix(in oklab, var(--status-ok) 14%, var(--color-surface)); color: var(--status-ok); border-color: color-mix(in oklab, var(--status-ok) 40%, var(--color-line)); }
  .chip[data-status="warning"] { background: color-mix(in oklab, var(--status-warning) 16%, var(--color-surface)); color: var(--status-warning); border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-line)); }
  .chip[data-status="declined"] { background: var(--color-surface-2); color: var(--color-muted); }

  h2.section { font-family: var(--font-display); font-size: 15px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--color-line); }
  h2.section:first-of-type { margin-top: 0; }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .req {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: center;
    background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg);
    padding: 14px 18px;
  }
  .req .who { font-family: var(--font-display); font-weight: 700; }
  .req .role-tag { color: var(--color-muted); font-size: 12px; }
  .req .dates { font-size: 13px; }
  .req .reason { font-size: 13px; color: var(--color-muted); margin-top: 2px; }
  .req .cover { font-size: 12px; margin-top: 6px; padding: 6px 8px; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); color: color-mix(in oklab, var(--status-warning) 70%, var(--color-ink)); }
  .req .owner-note { font-size: 12px; color: var(--color-muted); margin-top: 6px; }
  .actions { display: flex; gap: 8px; }
  .btn { border-radius: var(--radius-md); padding: 8px 14px; font-size: 13px; font-weight: 600; border: 1px solid transparent; }
  .btn.primary { background: var(--color-primary); color: var(--color-on-primary); }
  .btn.ghost { background: var(--color-surface); border-color: var(--color-line); color: var(--color-ink); }

  @media (max-width: 900px) {
    .req { grid-template-columns: 1fr; gap: 8px; }
    .actions { flex-direction: row; }
    .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>PartyFox</div>
    <span class="role">Собственик</span>
  </div>
  <h1 class="heading">Отпуски</h1>
  <p class="sub" data-field="subhead"></p>

  <h2 class="section">Чакат одобрение</h2>
  <div class="list" id="pending"></div>

  <h2 class="section">Решени</h2>
  <div class="list" id="decided"></div>
</div>

<script>
  const D = window.PARTYFOX;
  const animatorById = Object.fromEntries(D.animators.map(a => [a.id, a]));
  const pending = D.leaveRequests.filter(l => l.state === "pending");
  const decided = D.leaveRequests.filter(l => l.state !== "pending");

  document.querySelector('[data-field="subhead"]').textContent =
    `${pending.length} чакат решение от вас`;

  function dates(l) {
    if (l.hours) return `${l.from}, ${l.hours}`;
    if (l.from === l.to) return l.from;
    return `${l.from} – ${l.to} · ${l.days} дни`;
  }

  function card(l, decided) {
    const a = animatorById[l.animator];
    const coverBlock = l.cover.length
      ? `<div class="cover">Засяга: ${l.cover.map(c => `${c.booking} (${c.when})`).join(", ")}</div>` : "";
    const ownerNote = l.ownerNote ? `<div class="owner-note">${l.ownerNote}</div>` : "";
    const statusChip = l.state === "approved"
      ? `<span class="chip" data-status="ok">Одобрен</span>`
      : l.state === "declined" ? `<span class="chip" data-status="declined">Отказан</span>`
      : l.cover.length ? `<span class="chip" data-status="warning">Нужно покритие</span>` : "";
    const actions = decided ? `<span class="chip" data-status="declined" style="visibility:hidden">·</span>`
      : `<div class="actions">
          <button class="btn primary" data-action="approve" data-leave="${l.id}">Одобри</button>
          <button class="btn ghost" data-action="decline" data-leave="${l.id}">Откажи</button>
        </div>`;
    return `<article class="req" data-leave="${l.id}">
      <div>
        <div class="who">${a.name}</div>
        <div class="role-tag">${a.role}</div>
        ${l.reason ? `<div class="reason">${l.reason}</div>` : ""}
      </div>
      <div>
        <div class="dates">${dates(l)}</div>
        ${coverBlock}${ownerNote}
      </div>
      ${decided ? statusChip : actions}
    </article>`;
  }

  document.getElementById("pending").innerHTML = pending.map(l => card(l, false)).join("")
    || `<p class="sub">Няма чакащи заявки.</p>`;
  document.getElementById("decided").innerHTML = decided.map(l => card(l, true)).join("");
</script>
</body>
</html>
