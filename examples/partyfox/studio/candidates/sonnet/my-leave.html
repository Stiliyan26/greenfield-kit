<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка за отпуск — PartyFox</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }

  .page { max-width: 640px; margin: 0 auto; padding: clamp(16px, 3vw, 32px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .02em; color: var(--color-primary); }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-tertiary); }
  .role { font-size: 12px; color: var(--color-muted); text-transform: uppercase; letter-spacing: .08em; }

  h1.heading { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3vw, 28px); margin: 0 0 10px; border-bottom: 4px double var(--color-ink); padding-bottom: 10px; }
  .sub { color: var(--color-muted); margin: 8px 0 18px; font-size: 14px; }

  .card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 20px; }
  .card h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--color-line); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--color-muted); margin-bottom: 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .input, textarea {
    width: 100%; border: 1px solid var(--color-line); background: var(--color-bg);
    border-radius: var(--radius-sm); padding: 9px 11px; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 64px; }
  .btn { border-radius: var(--radius-md); padding: 11px 16px; font-size: 14px; font-weight: 700; border: 1px solid transparent; width: 100%; }
  .btn.primary { background: var(--color-primary); color: var(--color-on-primary); }

  .chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 14px; border-radius: 0 var(--radius-pill) var(--radius-pill) 0; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--color-line); background: var(--color-surface-2); color: var(--color-muted); }
  .chip::before { content: ""; position: absolute; left: -1px; top: 50%; width: 8px; height: 8px; background: var(--color-bg); border-radius: 50%; transform: translate(-50%, -50%); border: 1px solid var(--color-line); }
  .chip[data-status="ok"] { background: color-mix(in oklab, var(--status-ok) 14%, var(--color-surface)); color: var(--status-ok); border-color: color-mix(in oklab, var(--status-ok) 40%, var(--color-line)); }
  .chip[data-status="warning"] { background: color-mix(in oklab, var(--status-warning) 16%, var(--color-surface)); color: var(--status-warning); border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-line)); }
  .chip[data-status="pending"] { background: color-mix(in oklab, var(--color-secondary) 14%, var(--color-surface)); color: var(--color-secondary); border-color: color-mix(in oklab, var(--color-secondary) 40%, var(--color-line)); }

  .item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--color-line); }
  .item:last-child { border-bottom: none; }
  .item .dates { font-weight: 600; font-size: 14px; }
  .item .reason { font-size: 12px; color: var(--color-muted); }

  @media (max-width: 480px) {
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>PartyFox</div>
    <span class="role" data-field="me"></span>
  </div>
  <h1 class="heading">Заявка за отпуск</h1>
  <p class="sub">Собственикът одобрява всяка заявка.</p>

  <div class="card">
    <h2>Нова заявка</h2>
    <div class="row2">
      <div class="field"><label for="from">От дата</label><input class="input" id="from" type="text" placeholder="напр. 3 окт."></div>
      <div class="field"><label for="to">До дата</label><input class="input" id="to" type="text" placeholder="напр. 5 окт."></div>
    </div>
    <div class="field"><label for="reason">Причина (по желание)</label><textarea id="reason" placeholder="Няколко думи за собственика"></textarea></div>
    <button class="btn primary" data-action="submit-leave">Изпрати заявка</button>
  </div>

  <div class="card">
    <h2>Моите заявки</h2>
    <div id="mine" data-block="my-leave"></div>
  </div>
</div>

<script>
  const D = window.PARTYFOX;
  const me = D.animators.find(a => a.id === D.me);
  document.querySelector('[data-field="me"]').textContent = `${me.name} · ${me.role}`;

  const mine = D.leaveRequests.filter(l => l.animator === D.me);
  const chip = (l) => l.state === "approved" ? `<span class="chip" data-status="ok">Одобрена</span>`
    : l.state === "declined" ? `<span class="chip" data-status="warning">Отказана</span>`
    : `<span class="chip" data-status="pending">Чака</span>`;

  document.getElementById("mine").innerHTML = mine.length ? mine.map(l => {
    const dates = l.hours ? `${l.from}, ${l.hours}` : (l.from === l.to ? l.from : `${l.from} – ${l.to}`);
    return `<div class="item" data-leave="${l.id}">
      <div>
        <div class="dates">${dates}</div>
        ${l.reason ? `<div class="reason">${l.reason}</div>` : ""}
      </div>
      ${chip(l)}
    </div>`;
  }).join("") : `<p class="sub">Все още няма подадени заявки.</p>`;
</script>
</body>
</html>
