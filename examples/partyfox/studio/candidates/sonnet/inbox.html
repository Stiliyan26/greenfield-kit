<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Входяща поща — PartyFox</title>
<script src="/_studio/frame.js"></script>
<script src="/data.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }

  .page { max-width: 1200px; margin: 0 auto; padding: clamp(16px, 2.4vw, 36px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .02em; color: var(--color-primary); }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-tertiary); }
  .role { font-size: 12px; color: var(--color-muted); text-transform: uppercase; letter-spacing: .08em; }

  h1.heading { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 2.6vw, 32px); margin: 0 0 10px; border-bottom: 4px double var(--color-ink); padding-bottom: 10px; }
  .sub { color: var(--color-muted); margin: 8px 0 20px; font-size: 14px; }

  .chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 14px; border-radius: 0 var(--radius-pill) var(--radius-pill) 0; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--color-line); background: var(--color-surface-2); color: var(--color-muted); }
  .chip::before { content: ""; position: absolute; left: -1px; top: 50%; width: 8px; height: 8px; background: var(--color-bg); border-radius: 50%; transform: translate(-50%, -50%); border: 1px solid var(--color-line); }
  .chip[data-status="ok"] { background: color-mix(in oklab, var(--status-ok) 14%, var(--color-surface)); color: var(--status-ok); border-color: color-mix(in oklab, var(--status-ok) 40%, var(--color-line)); }
  .chip[data-status="warning"] { background: color-mix(in oklab, var(--status-warning) 16%, var(--color-surface)); color: var(--status-warning); border-color: color-mix(in oklab, var(--status-warning) 45%, var(--color-line)); }
  .chip[data-status="new"] { background: color-mix(in oklab, var(--color-secondary) 16%, var(--color-surface)); color: var(--color-secondary); border-color: color-mix(in oklab, var(--color-secondary) 40%, var(--color-line)); }
  .chip.large { background: color-mix(in oklab, var(--color-tertiary) 14%, var(--color-surface)); color: var(--color-tertiary); border-color: color-mix(in oklab, var(--color-tertiary) 40%, var(--color-line)); }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .order {
    display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 18px; align-items: start;
    background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg);
    padding: 16px 18px;
  }
  .order .who { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .order .parent { color: var(--color-muted); font-size: 13px; margin-top: 2px; }
  .order .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .order dl { margin: 0; font-size: 13px; }
  .order dl div { display: flex; gap: 6px; margin-bottom: 3px; }
  .order dl dt { color: var(--color-muted); min-width: 62px; }
  .order .note { font-size: 13px; background: var(--color-surface-2); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--color-ink); }
  .order .note.warn { background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); color: color-mix(in oklab, var(--status-warning) 70%, var(--color-ink)); }
  .order .actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 120px; }
  .btn { border-radius: var(--radius-md); padding: 9px 14px; font-size: 13px; font-weight: 600; border: 1px solid transparent; text-align: center; }
  .btn.primary { background: var(--color-primary); color: var(--color-on-primary); }
  .btn.ghost { background: var(--color-surface); border-color: var(--color-line); color: var(--color-ink); }
  .order[data-received] .id { font-size: 11px; color: var(--color-muted); }

  @media (max-width: 900px) {
    .order { grid-template-columns: 1fr; gap: 10px; padding: 14px; }
    .order .actions { flex-direction: row; }
    .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>PartyFox</div>
    <span class="role">Собственик</span>
  </div>
  <h1 class="heading">Входяща поща</h1>
  <p class="sub" data-field="subhead"></p>
  <div class="list" id="list" data-block="orders"></div>
</div>

<script>
  const D = window.PARTYFOX;
  const customerById = Object.fromEntries(D.customers.map(c => [c.id, c]));
  document.querySelector('[data-field="subhead"]').textContent =
    `${D.orders.length} поръчки от сайта, най-новите отгоре`;

  const statusLabel = {
    "new": "Ново", "needs-info": "Липсва адрес", "clash": "Застъпване", "scheduled": "Насрочено",
  };
  const statusTone = { "new": "new", "needs-info": "warning", "clash": "warning", "scheduled": "ok" };

  document.getElementById("list").innerHTML = D.orders.map(o => {
    const customer = o.customer ? customerById[o.customer] : null;
    const tags = customer && customer.tags.length
      ? customer.tags.map(t => `<span class="chip">${t === "repeat" ? "Стар клиент" : t === "large" ? "Голямо парти" : "Нов клиент"}</span>`).join("")
      : "";
    const noteBlock = o.note
      ? `<div class="note ${o.state === "needs-info" || o.state === "clash" ? "warn" : ""}">${o.note}</div>` : "";
    const clashBlock = o.clashNote ? `<div class="note warn">${o.clashNote}</div>` : "";
    return `<article class="order" data-order="${o.id}" data-received>
      <div>
        <div class="id">№ ${o.id.replace("o", "")} · ${o.received}</div>
        <div class="who">${o.child}, ${o.age} г. · ${o.package}</div>
        <div class="parent">${o.parent} · ${o.phone}</div>
        <div class="chips">
          <span class="chip" data-status="${statusTone[o.state]}">${statusLabel[o.state]}</span>
          ${o.large ? `<span class="chip large">Голяма група</span>` : ""}
          ${tags}
        </div>
      </div>
      <dl>
        <div><dt>Дата</dt><span>${o.date}, ${o.time}</span></div>
        <div><dt>Гости</dt><span>${o.guests}</span></div>
        <div><dt>Адрес</dt><span>${o.address ?? "не е зададен"}</span></div>
      </dl>
      <div>${noteBlock}${clashBlock}</div>
      <div class="actions">
        ${o.state === "new" ? `<button class="btn primary" data-action="schedule">Насрочи</button>` : ""}
        ${o.state === "needs-info" ? `<button class="btn primary" data-action="ask">Питай за адрес</button>` : ""}
        ${o.state === "clash" ? `<button class="btn primary" data-action="resolve">Реши застъпване</button>` : ""}
        <button class="btn ghost" data-action="open">Отвори клиент</button>
      </div>
    </article>`;
  }).join("");
</script>
</body>
</html>
