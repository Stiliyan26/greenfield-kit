<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyFox · Ростър</title>
<script src="/_studio/frame.js"></script>
<script src="../data.js"></script>
<style>
  /* Layout candidate. Every color, font and radius comes from the studio world. */
  :root{
    --tint-warning:color-mix(in oklab, var(--status-warning) 12%, var(--color-surface));
    --tint-danger:color-mix(in oklab, var(--status-danger) 10%, var(--color-surface));
    --tint-booking:var(--color-primary-soft);
    --shadow:0 1px 2px color-mix(in oklab, var(--color-ink) 12%, transparent);
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-body);color:var(--color-ink);background:var(--color-bg);
       font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .shell{max-width:1180px;margin:0 auto;padding:20px 22px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .day{color:var(--color-muted);font-size:13px;margin-top:2px}

  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--color-surface);border:1px solid var(--color-line);border-radius:999px;
        padding:7px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .chip b{font-family:var(--font-display);font-size:16px;line-height:1}
  .chip.total{background:var(--color-secondary-soft);border-color:transparent;color:var(--color-secondary)}
  .chip.warn{border-color:var(--status-warning);background:var(--tint-warning);color:var(--status-warning)}
  .chip.bad{border-color:var(--status-danger);background:var(--tint-danger);color:var(--status-danger)}

  .grid{margin-top:18px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden}
  .ruler,.row{display:grid;grid-template-columns:170px 1fr}
  .ruler{position:sticky;top:0;background:var(--color-surface-2);border-bottom:1px solid var(--color-line);z-index:3}
  .corner{padding:10px 14px;background:var(--color-surface-2);font-size:12px;color:var(--color-muted);font-weight:600;border-right:1px solid var(--color-line)}
  .hours{position:relative;height:38px;margin-right:28px}
  .hours span{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:11.5px;color:var(--color-muted);font-variant-numeric:tabular-nums}
  .hours span:first-of-type{transform:translate(0,-50%)}

  .row{border-bottom:1px solid var(--color-line);position:relative}
  .row:last-child{border-bottom:0}
  .who{padding:12px 14px;border-right:1px solid var(--color-line);display:flex;flex-direction:column;justify-content:center;gap:2px}
  .who .nm{font-weight:650;font-size:14px}
  .who .rl{font-size:12px;color:var(--color-muted)}
  .flag{margin-top:6px;font-size:11.5px;font-weight:600;border-radius:var(--radius-sm);padding:3px 8px;align-self:flex-start;border:1px solid currentColor}
  .flag.leave{color:var(--color-muted)}
  .flag.clash{color:var(--status-warning);background:var(--tint-warning)}
  .lane{position:relative;min-height:64px;margin-right:28px}
  .lane .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--color-line)}

  /* Bookings sit on tracks, so two overlapping parties never cover each other. */
  .block{position:absolute;border-radius:var(--radius-sm);padding:5px 9px;background:var(--tint-booking);
         border:1px solid color-mix(in oklab, var(--color-primary) 35%, var(--color-surface));font-size:12px;overflow:hidden;box-shadow:var(--shadow);
         display:flex;flex-direction:column;justify-content:center;gap:1px;z-index:2}
  .block .t{font-weight:700;font-variant-numeric:tabular-nums}
  .block .d{color:var(--color-muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  .block.clashing{border:1.5px solid var(--status-warning)}

  /* Missing deposit: the one solid red treatment on the screen. */
  .block.deposit-missing{background:var(--tint-danger);border:2px solid var(--status-danger);color:var(--status-danger)}
  .block .dep{margin-top:2px;font-size:11px;font-weight:700;align-self:flex-start;background:var(--status-danger);
              color:var(--color-surface);border-radius:var(--radius-sm);padding:1px 6px}

  /* Clash: hatched amber zone behind the overlapping hours; the label lives in the name column. */
  .clash-zone{position:absolute;top:0;bottom:0;z-index:1;border-left:1.5px dashed var(--status-warning);border-right:1.5px dashed var(--status-warning);
              background:repeating-linear-gradient(45deg,color-mix(in oklab, var(--status-warning) 16%, transparent) 0 6px,transparent 6px 12px)}

  .leave-band{position:absolute;top:8px;bottom:8px;border-radius:var(--radius-sm);z-index:1;
        background:repeating-linear-gradient(135deg,var(--color-bg) 0 9px,var(--color-surface) 9px 18px);
        border:1px solid var(--color-line);display:flex;align-items:center;justify-content:center;
        font-size:11.5px;color:var(--color-muted);font-weight:600}

  .open{background:var(--tint-warning)}
  .open .who .nm{color:var(--status-warning)}
  .need{position:absolute;top:9px;bottom:9px;border:1.5px dashed var(--status-warning);border-radius:var(--radius-sm);
        background:var(--color-surface);color:var(--status-warning);font-size:12px;font-weight:600;
        display:flex;align-items:center;gap:8px;padding:0 12px;z-index:2}
  .need .t{font-weight:800}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--color-muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .lg{width:14px;height:14px;border-radius:var(--radius-sm);display:inline-block}
  .lg-booked{background:var(--tint-booking);border:1px solid color-mix(in oklab, var(--color-primary) 35%, var(--color-surface))}
  .lg-clash{background:repeating-linear-gradient(45deg,var(--status-warning) 0 3px,var(--color-surface) 3px 6px);border:1px solid var(--status-warning)}
  .lg-deposit{background:var(--status-danger)}
  .lg-need{background:var(--color-surface);border:1.5px dashed var(--status-warning)}
  .note{margin-top:14px;font-size:13px;color:var(--color-muted)}
  .note b{color:var(--status-danger)}

  @media (max-width:640px){
    .shell{padding:14px}
    .ruler,.row{grid-template-columns:96px 1fr}
    .who{padding:10px}
    .who .rl{display:none}
    .hours,.lane{margin-right:12px}
    .hours span:nth-of-type(even){display:none}
    .block{font-size:11px;padding:3px 5px}
    .block .d{display:none}
    .need{font-size:11px;padding:0 6px}
    .flag{font-size:11px;padding:2px 5px}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><h1>Оперативен ден</h1><div class="day" id="day"></div></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="grid" id="grid" aria-label="Разписание на деня"></div>

  <div class="legend">
    <span><i class="lg lg-booked"></i> Насрочено</span>
    <span><i class="lg lg-clash"></i> Застъпване на аниматор</span>
    <span><i class="lg lg-deposit"></i> Липсва депозит</span>
    <span><i class="lg lg-need"></i> Търси се аниматор</span>
  </div>
  <p class="note">Депозитът на <b>Софи (16:00)</b> не е получен. Иван е насрочен на две партита
  едновременно (14:00–16:00 и 15:00–17:00). Сумата на депозита не е зададена.</p>
</div>

<script>
const D = window.PARTYFOX;
const pct = h => ((h - D.hours.start) / (D.hours.end - D.hours.start)) * 100;
const hh = h => `${String(h).padStart(2, "0")}:00`;
document.getElementById("day").textContent = D.day + " · изглед „Ростър“";

document.getElementById("stats").innerHTML = `
  <span class="chip total"><b>${D.summary.parties}</b> партита</span>
  <span class="chip warn"><b>${D.summary.unassigned}</b> без аниматор</span>
  <span class="chip warn"><b>${D.summary.clashes}</b> застъпване</span>
  <span class="chip bad"><b>${D.summary.depositsMissing}</b> без депозит</span>`;

const ticks = Array.from({ length: D.hours.end - D.hours.start + 1 }, (_, i) => D.hours.start + i);
const tickLines = ticks.slice(1, -1).map(h => `<i class="tick" style="left:${pct(h)}%"></i>`).join("");

// Give each booking a track: a booking that overlaps an earlier one moves down.
function tracks(bookings) {
  const ends = []
  return bookings.slice().sort((a, b) => a.start - b.start).map(b => {
    let track = ends.findIndex(end => end <= b.start)
    if (track < 0) { track = ends.length; ends.push(0) }
    ends[track] = b.end
    return { ...b, track }
  })
}

let html = `<div class="ruler"><div class="corner">Аниматор</div><div class="hours">` +
  ticks.slice(0, -1).map(h => `<span style="left:${pct(h)}%">${hh(h)}</span>`).join("") + `</div></div>`;

const unassigned = D.bookings.filter(b => !b.animator);
html += `<div class="row open"><div class="who"><div class="nm">Търси се</div><div class="rl">без аниматор</div></div><div class="lane">` +
  tickLines + unassigned.map(b => `<div class="need" style="left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%">
    <span class="t">${hh(b.start)}</span> ${b.child}, ${b.age} г. · ${b.package}</div>`).join("") + `</div></div>`;

for (const a of D.animators) {
  const leave = D.leave.find(l => l.animator === a.id);
  const placed = tracks(D.bookings.filter(b => b.animator === a.id));
  const trackCount = Math.max(1, ...placed.map(b => b.track + 1));
  const clashes = placed.filter(b => b.clashWith).map(b => {
    const other = placed.find(x => x.id === b.clashWith)
    return other && { from: Math.max(b.start, other.start), to: Math.min(b.end, other.end) }
  }).filter(Boolean);
  const laneHeight = 64 + (trackCount - 1) * 48;
  const trackHeight = (laneHeight - 16 - (trackCount - 1) * 4) / trackCount;

  html += `<div class="row"><div class="who"><div class="nm">${a.name}</div><div class="rl">${a.role}</div>` +
    (leave ? `<span class="flag leave">Отпуск ${hh(leave.from)}–${hh(leave.to)}, одобрен</span>` : "") +
    clashes.map(c => `<span class="flag clash">Застъпване ${hh(c.from)}–${hh(c.to)}</span>`).join("") +
    `</div><div class="lane" style="min-height:${laneHeight}px">` + tickLines +
    (leave ? `<div class="leave-band" style="left:${pct(leave.from)}%;width:${pct(leave.to) - pct(leave.from)}%">одобрен отпуск</div>` : "") +
    clashes.map(c => `<div class="clash-zone" style="left:${pct(c.from)}%;width:${pct(c.to) - pct(c.from)}%"></div>`).join("");
  for (const b of placed) {
    const inClash = clashes.length && (b.clashWith || placed.some(x => x.clashWith === b.id));
    const cls = !b.deposit ? " deposit-missing" : inClash ? " clashing" : "";
    const top = 8 + b.track * (trackHeight + 4);
    html += `<div class="block${cls}" data-booking="${b.id}" style="left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%;top:${top}px;height:${trackHeight}px">
      <span class="t">${hh(b.start)}–${hh(b.end)}</span>
      <span class="d">${b.child}, ${b.age} г. · ${b.package}</span>
      ${b.deposit ? "" : `<span class="dep">Депозит липсва</span>`}
    </div>`;
  }
  html += `</div></div>`;
}
document.getElementById("grid").innerHTML = html;
</script>
</body>
</html>
