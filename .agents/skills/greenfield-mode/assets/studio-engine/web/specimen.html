<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World specimen</title>
  <script src="/_studio/frame.js"></script>
  <script type="module" src="/_studio/specimen.js"></script>
  <style>
    /* The specimen uses only world tokens, like a real candidate must. */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-surface-2); color: var(--color-ink); font: 400 15px/1.5 var(--font-body); }
    main { max-width: 1320px; margin: 0 auto; padding: 28px; display: grid; grid-template-columns: minmax(220px, 0.9fr) repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { background: var(--color-bg); border-radius: 16px; padding: 18px 20px; min-height: 200px; display: flex; flex-direction: column; }
    .card-head { display: flex; justify-content: space-between; gap: 8px; color: var(--color-muted); font-size: 13px; font-weight: 600; }
    .card-head span:last-child { font-weight: 400; }
    .roles { grid-row: span 4; display: grid; gap: 14px; align-content: start; }
    .role { border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: 1fr auto; min-height: 150px; }
    .role-fill { padding: 16px 18px; display: flex; justify-content: space-between; align-items: flex-start; font-weight: 600; font-size: 14px; }
    .role-fill code { font: 500 13px/1.4 var(--font-body); font-variant-numeric: tabular-nums; }
    .tones { display: grid; grid-template-columns: repeat(11, 1fr); height: 48px; }
    .aa { margin-top: auto; align-self: flex-end; line-height: 0.9; letter-spacing: -0.02em; }
    .aa.display { font: 700 116px/0.9 var(--font-display); color: var(--color-ink); }
    .aa.body { font: 400 116px/0.9 var(--font-body); color: var(--color-muted); }
    .aa.label { font: 600 116px/0.9 var(--font-body); color: var(--color-muted); }
    .sample { color: var(--color-muted); font-size: 14px; margin: 10px 0 14px; }
    .center { justify-content: center; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { height: 44px; padding: 0 16px; border-radius: var(--radius-sm); font: 500 15px var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; cursor: pointer; }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
    .btn-secondary { background: var(--color-surface-2); color: var(--color-ink); }
    .btn-inverted { background: var(--color-ink); color: var(--color-bg); }
    .btn-outlined { background: transparent; color: var(--color-ink); border-color: var(--color-muted); }
    .btn-tertiary { background: var(--color-tertiary); color: var(--color-on-tertiary); }
    .btn:focus-visible, .field:focus-within { outline: 3px solid var(--color-primary); outline-offset: 2px; }
    .field { height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 1px solid var(--color-line); border-radius: var(--radius-sm); background: var(--color-surface-2); color: var(--color-muted); font-size: 16px; }
    .field svg { width: 20px; height: 20px; flex: none; }
    .field span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bars { display: grid; gap: 18px; }
    .bar { height: 8px; border-radius: 4px; background: var(--color-surface-2); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 4px; }
    .nav { display: flex; justify-content: space-around; align-items: center; padding: 10px; border-radius: 14px; background: var(--color-surface-2); color: var(--color-ink); }
    .nav span { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-sm); }
    .nav span.on { background: var(--color-secondary); color: var(--color-on-secondary); }
    .nav svg { width: 22px; height: 22px; }
    .icon-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-sm); border: 0; }
    .icon-btn svg { width: 20px; height: 20px; }
    .alerts { display: grid; gap: 8px; }
    .alert { border-radius: var(--radius-sm); padding: 10px 12px; font-weight: 600; font-size: 14px; }
    .alert span { display: block; color: var(--color-ink); font-weight: 400; font-size: 13px; }
    .alert.danger { color: var(--status-danger); background: color-mix(in oklab, var(--status-danger) 10%, var(--color-surface)); }
    .alert.warning { color: var(--status-warning); background: color-mix(in oklab, var(--status-warning) 12%, var(--color-surface)); }
    .alert.ok { color: var(--status-ok); background: color-mix(in oklab, var(--status-ok) 10%, var(--color-surface)); }
    .wide { grid-column: span 2; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--color-muted); font-size: 12.5px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--color-line); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--color-line); }
    td.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
    tr.selected td { background: var(--color-primary-soft); }
    .pill { display: inline-flex; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
    .pill.ok { color: var(--status-ok); background: color-mix(in oklab, var(--status-ok) 12%, var(--color-surface)); }
    .pill.warning { color: var(--status-warning); background: color-mix(in oklab, var(--status-warning) 14%, var(--color-surface)); }
    .pill.danger { color: var(--color-surface); background: var(--status-danger); }
    .soft-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
    .soft-row span { height: 56px; border-radius: var(--radius-sm); display: flex; align-items: flex-end; padding: 8px 10px; font-size: 12px; font-weight: 600; }
    @media (max-width: 1100px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } .roles { grid-row: auto; grid-column: 1 / -1; grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { main { grid-template-columns: minmax(0, 1fr); padding: 14px; } .roles { grid-template-columns: minmax(0, 1fr); } .wide { grid-column: auto; } .aa.display, .aa.body, .aa.label { font-size: 88px; } }
  </style>
</head>
<body>
  <main>
    <section class="roles" id="roles" aria-label="Color roles"></section>

    <section class="card"><div class="card-head"><span>Headline</span><span data-font="display"></span></div><p class="sample" data-sample="display"></p><div class="aa display">Aa</div></section>
    <section class="card center"><div class="buttons">
      <button class="btn btn-primary" type="button">Primary</button><button class="btn btn-secondary" type="button">Secondary</button>
      <button class="btn btn-inverted" type="button">Inverted</button><button class="btn btn-outlined" type="button">Outlined</button>
    </div></section>
    <section class="card center"><label class="field" data-icon="search"><span data-sample="search"></span></label></section>

    <section class="card"><div class="card-head"><span>Body</span><span data-font="body"></span></div><p class="sample" data-sample="body"></p><div class="aa body">Aa</div></section>
    <section class="card center"><div class="bars">
      <div class="bar"><i style="width:72%;background:var(--color-primary)"></i></div>
      <div class="bar"><i style="width:86%;background:var(--color-secondary)"></i></div>
      <div class="bar"><i style="width:54%;background:var(--color-tertiary)"></i></div>
    </div></section>
    <section class="card center"><nav class="nav" aria-label="Sample navigation"><span class="on" data-icon="home"></span><span data-icon="search"></span><span data-icon="user"></span></nav></section>

    <section class="card"><div class="card-head"><span>Label</span><span data-font="body"></span></div><p class="sample" data-sample="label"></p><div class="aa label">Aa</div></section>
    <section class="card center"><div class="icon-row">
      <button class="icon-btn btn-primary" type="button" aria-label="Edit" data-icon="pencil"></button>
      <button class="btn btn-tertiary" type="button" data-icon-before="pencil">Label</button>
    </div></section>
    <section class="card center"><div class="icon-row">
      <button class="icon-btn btn-secondary" type="button" aria-label="Magic" data-icon="wand"></button>
      <button class="icon-btn btn-primary" type="button" aria-label="Shapes" data-icon="shapes"></button>
      <button class="icon-btn btn-inverted" type="button" aria-label="Tag" data-icon="tag"></button>
      <button class="icon-btn" type="button" aria-label="Delete" data-icon="trash" style="background:var(--status-danger);color:var(--color-surface)"></button>
    </div></section>

    <section class="card"><div class="card-head"><span>Status, locked</span></div><div class="alerts" id="alerts"></div></section>
    <section class="card wide"><div class="card-head"><span>Table</span></div><table><thead><tr><th>Time</th><th>Item</th><th>State</th></tr></thead><tbody id="rows"></tbody></table></section>
    <section class="card wide"><div class="card-head"><span>Soft fills</span></div>
      <div class="soft-row">
        <span style="background:var(--color-primary-soft);color:var(--color-primary)">primary-soft</span>
        <span style="background:var(--color-secondary-soft);color:var(--color-secondary)">secondary-soft</span>
        <span style="background:var(--color-tertiary-soft);color:var(--color-tertiary)">tertiary-soft</span>
      </div>
    </section>
  </main>
</body>
</html>
